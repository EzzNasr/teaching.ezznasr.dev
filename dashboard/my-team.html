<head>

<title>My team — Ezz Nasr : Teaching</title>
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  main{ padding:20px 0 64px; }
  .titlebar{ flex-wrap:wrap; row-gap:6px; } .titlebar nav{ flex-wrap:wrap; }
  .t-root{ font-family:"Cairo","Manrope",var(--sans),sans-serif; max-width:760px; }
  .t-card{ border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--shadow); padding:16px 18px; margin:0 0 16px; }
  .t-card h2{ margin:0 0 4px; font-size:17px; }
  .t-hint{ margin:0 0 12px; font-size:13.5px; color:var(--ink-dim); line-height:1.7; }
  .t-add{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .t-add input{ flex:1 1 200px; min-width:0; font:15px var(--mono); direction:ltr; text-align:start; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink); }
  .t-btn{ font:600 13.5px "Cairo",var(--mono),sans-serif; padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  .t-btn.primary{ background:var(--ink); color:var(--bg,#fff); border-color:var(--ink); }
  .t-btn.danger{ color:var(--status-fail); }
  .t-btn:disabled{ opacity:.5; cursor:default; }
  .t-msg{ margin-top:10px; font-size:13.5px; min-height:1.2em; }
  .t-msg.ok{ color:var(--status-shipped); } .t-msg.err{ color:var(--status-fail); }
  .t-list{ list-style:none; margin:0; padding:0; }
  .t-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .t-row:last-child{ border-bottom:0; }
  .t-name{ font-weight:700; flex:1 1 140px; min-width:0; }
  .t-phone{ font:13px var(--mono); color:var(--ink-dim); direction:ltr; unicode-bidi:isolate; }
  .t-badge{ font:600 11.5px var(--mono); padding:3px 9px; border-radius:999px; border:1px solid var(--line); }
  .t-badge.assistant{ background:color-mix(in srgb, var(--ink) 9%, transparent); }
  .t-empty,.t-state{ font-size:14px; color:var(--ink-dim); padding:10px 0; }
  .t-state.err{ color:var(--status-fail); }
  .t-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .t-cols h3{ margin:0 0 6px; font-size:14px; }
  .t-cols ul{ margin:0; padding-inline-start:18px; font-size:13.5px; line-height:1.9; }
  .t-warn{ font-size:13px; color:var(--ink-dim); border-inline-start:3px solid var(--line); padding:2px 10px; margin-top:12px; line-height:1.7; }
  @media (max-width:560px){ .t-cols{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="titlebar">

    <nav>

      <a href="my-team.html" aria-current="page">My team</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap page-head">
    <h1>My team</h1>
    <p class="lede">Your assistants and your Telegram link for payment requests.</p>
  </div>
  <div class="wrap">
    <div id="authgate"></div>
    <div id="mt-root" class="t-root" lang="en" dir="ltr" aria-live="polite"></div>
  </div>
</main>

<footer><div class="wrap"><p class="footer-note">teaching.ezznasr.dev/dashboard/my-team</p></div></footer>

<script src="/assets/staff-guard.js"></script>
<script>
(function () {
  "use strict";
  // Teachers only (StaffGuard bounces everyone else). Convenience only: the server checks the caller on every call.
  // Appointing, revoking, connecting and disconnecting are DECISIONS: they ask first and update their own card only.
  var MOCK = /[?&]mock=1\b/.test(location.search);
  var root = document.getElementById("mt-root");
  var S = { session: null };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag); attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
      else if (k in n && k !== "list") n[k] = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function note(node, text, kind) { node.textContent = text || ""; node.className = "t-msg" + (kind ? " " + kind : ""); }

  // ---------- API (real: AuthEngine.adminCall; mock: in memory) ----------
  var MOCK_ASST = [{ phone: "01000000010", name: "Omar" }], MOCK_TG = { linked: false, since: "" };
  function mockApi(p) {
    return new Promise(function (res) {
      setTimeout(function () {
        if (p.action === "p4_teacher_list_assistants") return res({ ok: true, assistants: MOCK_ASST.slice(), max: 3 });
        if (p.action === "p4_teacher_set_assistant") { var known = String(p.phone || "").slice(-4) === "0011"; if (known) MOCK_ASST.push({ phone: p.phone, name: "New assistant" }); return res({ ok: true, registered: known }); }
        if (p.action === "p4_teacher_revoke_assistant") { MOCK_ASST = MOCK_ASST.filter(function (a) { return a.phone !== p.phone; }); return res({ ok: true }); }
        if (p.action === "p4_tg_status") return res({ ok: true, linked: MOCK_TG.linked, since: MOCK_TG.since });
        if (p.action === "p4_tg_link_start") { MOCK_TG = { linked: true, since: "2026-10-30" }; return res({ ok: true, link: "https://t.me/example_bot?start=ABCD2345", expires_in: 900 }); }
        if (p.action === "p4_tg_unlink") { MOCK_TG = { linked: false, since: "" }; return res({ ok: true }); }
        res({ ok: false, error: "mock: unknown action" });
      }, 30);
    });
  }
  function api(payload) {
    var call;
    if (MOCK) call = mockApi(payload);
    else if (!window.AuthEngine) call = Promise.reject(new Error("auth.js didn't load."));
    else call = window.AuthEngine.adminCall(S.session, payload);
    return call.then(function (r) { if (!r || r.ok === false) throw new Error((r && r.error) || "Request failed."); return r; });
  }

  // ---------- assistants ----------
  var asstMsg = el("div", { class: "t-msg", role: "status" });
  var asstList = el("ul", { class: "t-list" });
  var asstMax = el("span", { class: "t-hint" });
  function asstRow(a) {
    var row = el("li", { class: "t-row" }, [el("span", { class: "t-name", text: a.name || a.phone }), el("span", { class: "t-phone", text: a.phone }), el("span", { class: "t-badge assistant", text: "Assistant" })]);
    var rm = el("button", { class: "t-btn danger", type: "button", text: "Remove" });
    rm.addEventListener("click", function () {
      if (!window.confirm("Remove " + (a.name || a.phone) + " as your assistant? They lose access from their next request.")) return;
      rm.disabled = true;
      api({ action: "p4_teacher_revoke_assistant", phone: a.phone }).then(function () { if (row.parentNode) row.parentNode.removeChild(row); note(asstMsg, (a.name || a.phone) + " was removed.", "ok"); },
        function (e) { rm.disabled = false; note(asstMsg, e.message, "err"); });
    });
    row.appendChild(rm);
    return row;
  }
  function loadAssistants() {
    return api({ action: "p4_teacher_list_assistants" }).then(function (r) {
      clear(asstList);
      (r.assistants || []).forEach(function (a) { asstList.appendChild(asstRow(a)); });
      if (!(r.assistants || []).length) asstList.appendChild(el("li", { class: "t-empty", text: "You have no assistants yet." }));
      asstMax.textContent = r.max ? "You can have up to " + r.max + " assistants." : "";
    }, function (e) { note(asstMsg, e.message, "err"); });
  }
  function assistantsCard() {
    var phone = el("input", { type: "tel", inputMode: "numeric", placeholder: "01XXXXXXXXX", autocomplete: "off", "aria-label": "Assistant phone" });
    var add = el("button", { class: "t-btn primary", type: "button", text: "Appoint assistant" });
    add.addEventListener("click", function () {
      var v = phone.value.trim();
      if (!v) { note(asstMsg, "Enter the phone number.", "err"); phone.focus(); return; }
      add.disabled = true;
      api({ action: "p4_teacher_set_assistant", phone: v }).then(function () {
        add.disabled = false; phone.value = "";
        return loadAssistants().then(function () { note(asstMsg, "If that number is registered and eligible, the person now appears in the list.", ""); });
      }, function (e) { add.disabled = false; note(asstMsg, e.message, "err"); });
    });
    return el("section", { class: "t-card" }, [
      el("h2", { text: "My assistants" }),
      el("p", { class: "t-hint", text: "An assistant signs in with their own student account and helps with follow-up and grading for your students only. They cannot decide payments, edit templates or student records." }),
      el("div", { class: "t-add" }, [phone, add]), asstMsg, asstList, asstMax
    ]);
  }

  // ---------- Telegram ----------
  var tgState = el("p", { class: "t-hint", role: "status" });
  var tgMsg = el("div", { class: "t-msg", role: "status" });
  var connect = el("button", { class: "t-btn primary", type: "button", text: "Connect Telegram" });
  var disconnect = el("button", { class: "t-btn danger", type: "button", text: "Disconnect" });
  function paintTg(r) {
    tgState.textContent = r.linked ? "Connected" + (r.since ? " since " + r.since : "") + ". Payment requests for your subjects arrive in Telegram." : "Not connected. Payment requests will only show on the access page.";
    connect.hidden = !!r.linked; disconnect.hidden = !r.linked;
  }
  function loadTg() { return api({ action: "p4_tg_status" }).then(paintTg, function (e) { note(tgMsg, e.message, "err"); }); }
  connect.addEventListener("click", function () {
    connect.disabled = true; note(tgMsg, "");
    api({ action: "p4_tg_link_start" }).then(function (r) {
      connect.disabled = false;
      var w = window.open(r.link, "_blank", "noopener");
      note(tgMsg, w ? "Telegram opened. Press Start there, then press \u201cCheck status\u201d. The link works for 15 minutes." : "Open this link in Telegram and press Start (it works for 15 minutes): " + r.link, "");
    }, function (e) { connect.disabled = false; note(tgMsg, e.message, "err"); });
  });
  disconnect.addEventListener("click", function () {
    if (!window.confirm("Disconnect Telegram? You will stop receiving payment requests there.")) return;
    disconnect.disabled = true;
    api({ action: "p4_tg_unlink" }).then(function () { disconnect.disabled = false; paintTg({ linked: false }); note(tgMsg, "Telegram was disconnected.", "ok"); },
      function (e) { disconnect.disabled = false; note(tgMsg, e.message, "err"); });
  });
  function telegramCard() {
    var check = el("button", { class: "t-btn", type: "button", text: "Check status" });
    check.addEventListener("click", function () { note(tgMsg, ""); loadTg(); });
    return el("section", { class: "t-card" }, [
      el("h2", { text: "Telegram" }),
      el("p", { class: "t-hint", text: "Link your own Telegram to get payment requests for your subjects and approve or reject them there." }),
      tgState, el("div", { class: "t-add" }, [connect, disconnect, check]), tgMsg
    ]);
  }

  // ---------- boot ----------
  function start(session) {
    S.session = session;
    clear(root);
    root.appendChild(assistantsCard()); root.appendChild(telegramCard());
    loadAssistants(); loadTg();
  }
  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("Could not load " + src)); }; document.head.appendChild(s); }); }
  function boot() {
    if (MOCK) { var g = document.getElementById("authgate"); if (g) g.remove(); start(null); return; }
    loadScript("/assets/auth.js").then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
        if (!session.session_token) { clear(root).appendChild(el("div", { class: "t-state err", text: "Your saved sign-in is missing a session token. Sign out and sign in again." })); return; }
        window.StaffGuard.require(null, session).then(function (role) { if (role) start(session); });
      });
    }, function (e) { clear(root).appendChild(el("div", { class: "t-state err", text: e.message })); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
