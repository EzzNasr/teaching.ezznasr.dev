<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video access — Teaching Portal</title>
<link rel="icon" href="/icons/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/forms.css">
<script src="/assets/theme.js" defer></script>
<style>
  :root {
    color-scheme: light;
    --bg: #fbf9ff;
    --bg-glow: rgba(111, 93, 235, .16);
    --surface: rgba(255, 255, 255, .94);
    --surface-strong: #ffffff;
    --surface-soft: #f5f1ff;
    --ink: #25223d;
    --ink-dim: #6e6b86;
    --line: #e8e3f5;
    --line-strong: #d5cbea;
    --accent: #6256d9;
    --accent-2: #a052d8;
    --accent-soft: #f0eaff;
    --good: #168c79;
    --low: #d45b65;
    --shadow: 0 24px 60px rgba(83, 61, 139, .12);
    --shadow-soft: 0 8px 24px rgba(83, 61, 139, .085);
    --sans: 'Manrope', system-ui, sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1120;
    --bg-glow: rgba(129, 140, 248, .16);
    --surface: rgba(25, 31, 52, .86);
    --surface-strong: #1a2035;
    --surface-soft: #171d31;
    --ink: #f1f4ff;
    --ink-dim: #9da7c0;
    --line: #2a334d;
    --line-strong: #39435f;
    --accent: #9b9cff;
    --accent-2: #c084fc;
    --accent-soft: #29274d;
    --good: #50d3a9;
    --low: #ff858d;
    --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, .22);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); transition: background .25s ease; }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 0%, var(--bg-glow), transparent 32rem),
      radial-gradient(circle at 95% 18%, rgba(255, 167, 112, .13), transparent 27rem),
      var(--bg);
    font-family: var(--sans);
    transition: color .25s ease, background .25s ease;
  }

  .dash-shell { width: min(100% - 32px, 1180px); margin: 0 auto; padding: 34px 0 72px; }
  .dash-topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom: 44px; }
  .dash-back { display:inline-flex; align-items:center; gap:8px; color:var(--ink-dim); font: 600 12px/1 var(--mono); text-decoration:none; letter-spacing:.01em; transition:color .2s ease, transform .2s ease; }
  .dash-back:hover { color:var(--accent); transform:translateX(-2px); }
  .theme-toggle { display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:var(--ink-dim); background:var(--surface); box-shadow:var(--shadow-soft); font:600 11px var(--mono); cursor:pointer; transition:all .2s ease; }
  .theme-toggle:hover { color:var(--accent); border-color:var(--accent); transform:translateY(-1px); }
  .theme-toggle:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset:3px; }
  .theme-toggle-icon { font-size:15px; line-height:1; }

  #dashboard { animation: dash-in .45s ease both; }
  @keyframes dash-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .dash-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; }
  .dash-head h1 { margin:0; color:var(--ink); font:800 clamp(28px, 5vw, 42px)/1.08 var(--sans); letter-spacing:-.045em; }
  .dash-head p { margin:10px 0 0; color:var(--ink-dim); font: 13px/1.6 var(--mono); }
  .dash-head:after { content:'MASTER PORTAL'; color:var(--accent); font:700 10px var(--mono); letter-spacing:.16em; white-space:nowrap; }

  .dash-stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:32px; }
  .dash-stat { position:relative; overflow:hidden; min-height:112px; padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow-soft); backdrop-filter:blur(14px); }
  .dash-stat:after { content:''; position:absolute; width:72px; height:72px; right:-22px; bottom:-30px; border-radius:50%; background:var(--accent-soft); }
  .dash-stat b { position:relative; z-index:1; display:block; color:var(--ink); font:800 30px/1 var(--sans); letter-spacing:-.04em; }
  .dash-stat span { position:relative; z-index:1; display:block; margin-top:9px; color:var(--ink-dim); font:11px var(--mono); }

  .dash-filters { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:24px; padding:16px 18px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:var(--shadow-soft); backdrop-filter:blur(14px); }
  .dash-filters label { display:flex; flex-direction:column; gap:5px; color:var(--ink-dim); font:600 10px var(--mono); letter-spacing:.04em; }
  .dash-select, .dash-search { border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; color:var(--ink); background:var(--surface-strong); font:13px var(--sans); min-width:150px; }
  .dash-select:focus, .dash-search:focus { outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset:1px; }
  .dash-search { min-width:220px; }
  .dash-clear { align-self:flex-end; border:1px solid var(--line-strong); border-radius:9px; padding:8px 12px; color:var(--ink-dim); background:var(--surface-soft); font:600 11px var(--mono); cursor:pointer; }
  .dash-clear:hover { color:var(--accent); border-color:var(--accent); }

  .dash-section { margin-bottom:28px; padding:22px 24px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-soft); backdrop-filter:blur(14px); }
  .dash-section h2 { display:flex; align-items:center; gap:10px; margin:0 0 8px; padding:0 0 15px; border-bottom:1px solid var(--line); color:var(--ink); font:800 16px var(--sans); letter-spacing:-.02em; }
  .dash-section h2:before { content:''; width:8px; height:8px; border-radius:3px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 0 0 5px var(--accent-soft); }
  .dash-section-note { margin:-4px 0 14px; color:var(--ink-dim); font:11px var(--mono); }
  .dash-empty { padding:20px 0 6px; color:var(--ink-dim); font:13px/1.6 var(--mono); }

  .dash-row { display:flex; align-items:center; gap:16px; min-height:66px; padding:14px 2px; border-bottom:1px solid var(--line); }
  .dash-row:last-child { border-bottom:0; }
  .dash-row.is-clickable { cursor:pointer; border-radius:10px; transition:background .15s ease; }
  .dash-row.is-clickable:hover { background:var(--surface-soft); }
  .dash-row.is-selected { background:var(--accent-soft); }
  .dash-row-main { flex:1; min-width:0; }
  .dash-row-title { overflow:hidden; color:var(--ink); font:700 14px var(--sans); text-overflow:ellipsis; white-space:nowrap; }
  .dash-row-sub { margin-top:5px; overflow:hidden; color:var(--ink-dim); font:11px var(--mono); text-overflow:ellipsis; white-space:nowrap; }
  .dash-score { flex-shrink:0; min-width:84px; text-align:right; font:600 12px var(--mono); }
  .dash-score.is-good { color:var(--good); } .dash-score.is-mid { color:var(--ink); } .dash-score.is-low { color:var(--low); }
  .dash-badge { flex-shrink:0; padding:5px 8px; border:1px solid var(--line-strong); border-radius:7px; color:var(--ink-dim); background:var(--surface-soft); font:10px var(--mono); letter-spacing:.03em; }
  .dash-link { flex-shrink:0; color:var(--accent); font:600 11px var(--mono); text-decoration:none; }
  .dash-link:hover { text-decoration:underline; }
  .dash-chapter { padding:14px 2px 8px; }
  .dash-chapter-top { display:flex; justify-content:space-between; gap:14px; margin-bottom:9px; color:var(--ink-dim); font:12px var(--mono); }
  .dash-chapter-top b { overflow:hidden; color:var(--ink); font:700 13px var(--sans); text-overflow:ellipsis; white-space:nowrap; }
  .dash-bar { height:9px; overflow:hidden; border-radius:999px; background:var(--line); }
  .dash-bar-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .5s ease; }
  .dash-bar-fill.is-low { background:var(--low); } .dash-bar-fill.is-good { background:var(--good); }
  .dash-sub-text { max-height:4.5em; overflow:hidden; margin-top:8px; color:var(--ink-dim); font:12px/1.5 var(--sans); white-space:pre-wrap; }
  .dash-err { padding:18px 0; color:var(--low); font:13px/1.6 var(--mono); }
  .dash-loadbar { width:100%; max-width:260px; height:5px; margin-top:16px; overflow:hidden; border-radius:999px; background:var(--line); }
  .dash-loadbar-fill { width:42%; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--accent), var(--accent-2)); animation:dash-loadbar-slide 1.1s ease-in-out infinite; }
  @keyframes dash-loadbar-slide { 0% { transform:translateX(-120%); } 50% { transform:translateX(85%); } 100% { transform:translateX(260%); } }
  .dash-loading-state { display:grid; place-items:center; min-height:calc(100vh - 190px); padding:28px 0 54px; }
  .dash-loading-card { position:relative; width:min(100%, 520px); overflow:hidden; padding:42px 34px 36px; border:1px solid var(--line); border-radius:26px; background:var(--surface); box-shadow:var(--shadow); text-align:center; backdrop-filter:blur(18px); }
  .dash-loading-card:before, .dash-loading-card:after { content:""; position:absolute; pointer-events:none; border-radius:50%; }
  .dash-loading-card:before { width:190px; height:190px; top:-112px; left:-88px; background:var(--accent-soft); opacity:.7; }
  .dash-loading-card:after { width:150px; height:150px; right:-74px; bottom:-92px; background:rgba(255, 167, 112, .16); }
  .dash-loading-art { position:relative; z-index:1; display:grid; place-items:center; width:104px; height:104px; margin:0 auto 26px; }
  .dash-loading-ring, .dash-loading-ring:before, .dash-loading-ring:after { position:absolute; display:block; border-radius:50%; content:""; }
  .dash-loading-ring { inset:0; border:1px solid color-mix(in srgb, var(--accent) 28%, transparent); animation:dash-loading-spin 4s linear infinite; }
  .dash-loading-ring:before { inset:10px; border:2px dashed color-mix(in srgb, var(--accent-2) 65%, transparent); animation:dash-loading-spin-reverse 2.8s linear infinite; }
  .dash-loading-ring:after { inset:25px; border:7px solid var(--accent-soft); border-top-color:var(--accent); border-right-color:var(--accent-2); animation:dash-loading-spin 1.25s cubic-bezier(.4,0,.2,1) infinite; }
  .dash-loading-core { position:relative; z-index:2; display:grid; place-items:center; width:31px; height:31px; border-radius:11px; color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 7px 18px color-mix(in srgb, var(--accent) 32%, transparent); animation:dash-loading-pulse 1.6s ease-in-out infinite; }
  .dash-loading-core:before { width:10px; height:10px; border:2px solid rgba(255,255,255,.82); border-radius:50%; content:""; }
  .dash-loading-copy { position:relative; z-index:1; }
  .dash-loading-title { margin:0; color:var(--ink); font:800 clamp(20px, 3vw, 25px)/1.2 var(--sans); letter-spacing:-.035em; }
  .dash-loading-note { margin:10px 0 0; color:var(--ink-dim); font:12px/1.6 var(--mono); }
  .dash-loading-dots { display:inline-flex; gap:4px; margin-left:3px; vertical-align:middle; }
  .dash-loading-dots i { width:4px; height:4px; border-radius:50%; background:var(--accent); animation:dash-loading-dot 1.2s ease-in-out infinite; }
  .dash-loading-dots i:nth-child(2) { animation-delay:.15s; }
  .dash-loading-dots i:nth-child(3) { animation-delay:.3s; }
  .dash-loading-meter { position:relative; z-index:1; width:min(100%, 310px); margin:24px auto 0; }
  .dash-loading-meter-label { display:flex; justify-content:space-between; color:var(--ink-dim); font:10px var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .dash-loading-meter .dash-loadbar { max-width:none; height:7px; margin-top:9px; }
  @keyframes dash-loading-spin { to { transform:rotate(360deg); } }
  @keyframes dash-loading-spin-reverse { to { transform:rotate(-360deg); } }
  @keyframes dash-loading-pulse { 0%, 100% { transform:scale(.92); } 50% { transform:scale(1.08); } }
  @keyframes dash-loading-dot { 0%, 60%, 100% { opacity:.25; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  .qz-next { border:0; border-radius:10px; padding:11px 15px; color:#fff; background:var(--accent); font:700 12px var(--mono); cursor:pointer; box-shadow:var(--shadow-soft); }
  .qz-next:hover { filter:brightness(1.08); }

  .dash-rank { flex-shrink:0; width:26px; color:var(--ink-dim); font:700 13px var(--mono); text-align:center; }
  .dash-missed-q { overflow:hidden; color:var(--ink); font:600 13px/1.4 var(--sans); text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; }


  .dash-tabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
  .dash-tab { border:1px solid var(--line-strong); border-radius:999px; padding:8px 14px; color:var(--ink-dim); background:var(--surface); font:700 12px var(--mono); cursor:pointer; transition:all .15s ease; }
  .dash-tab:hover { color:var(--accent); border-color:var(--accent); }
  .dash-tab.is-active { color:#fff; background:var(--accent); border-color:var(--accent); }
  .dash-tab small { margin-left:6px; opacity:.75; font:600 11px var(--mono); }
  .dash-note { margin:-14px 0 22px; color:var(--ink-dim); font:11px/1.6 var(--mono); }
  .dash-attempt { border-bottom:1px solid var(--line); }
  .dash-attempt:last-child { border-bottom:0; }
  .dash-attempt > .dash-row { border-bottom:0; }
  .dash-toggle { flex-shrink:0; color:var(--accent); font:600 11px var(--mono); white-space:nowrap; }
  .dash-detail { margin:0 0 14px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-soft); }
  .dash-detail-h { margin:0 0 6px; color:var(--ink-dim); font:600 11px var(--mono); }
  .dash-q { padding:10px 0; border-top:1px solid var(--line); }
  .dash-detail-h + .dash-q { border-top:0; }
  .dash-q-text { color:var(--ink); font:600 13px/1.45 var(--sans); }
  .dash-q-group { margin:12px 0 2px; color:var(--ink-dim); font:600 11px/1.5 var(--mono); }
  .dash-q-ch { margin-left:6px; color:var(--ink-dim); font:600 10px var(--mono); }
  .dash-q-a { margin-top:5px; font:12px/1.5 var(--mono); white-space:pre-wrap; }
  .dash-q-a.your { color:var(--low); }
  .dash-q-a.correct { color:var(--good); }
  .dash-ok-list { margin-top:10px; }
  .dash-ok-list summary { cursor:pointer; color:var(--ink-dim); font:600 11px var(--mono); }
  .dash-more { display:block; margin:14px auto 0; border:1px solid var(--line-strong); border-radius:9px; padding:9px 16px; color:var(--accent); background:var(--surface-soft); font:700 11px var(--mono); cursor:pointer; }
  .dash-more[hidden] { display:none; }

  /* Light-only visual polish: colorful, information-dense master view. */
  html:not([data-theme="dark"]) .dash-stat,
  html:not([data-theme="dark"]) .dash-filters,
  html:not([data-theme="dark"]) .dash-section,
  html:not([data-theme="dark"]) .theme-toggle {
    border-color: rgba(207, 201, 230, .82);
    box-shadow: 0 10px 28px rgba(83, 61, 139, .07), 0 2px 5px rgba(83, 61, 139, .035);
  }
  html:not([data-theme="dark"]) .dash-stat,
  html:not([data-theme="dark"]) .dash-section,
  html:not([data-theme="dark"]) .dash-filters {
    background: rgba(255, 255, 255, .9);
  }
  html:not([data-theme="dark"]) .dash-stat {
    border-top-width: 3px;
    background-image: linear-gradient(145deg, rgba(255,255,255,.98), rgba(248,246,255,.92));
  }
  html:not([data-theme="dark"]) .dash-stat:nth-child(1) { border-top-color: #7567e8; }
  html:not([data-theme="dark"]) .dash-stat:nth-child(2) { border-top-color: #e080b6; }
  html:not([data-theme="dark"]) .dash-stat:nth-child(3) { border-top-color: #e6a052; }
  html:not([data-theme="dark"]) .dash-stat:nth-child(4) { border-top-color: #57b99c; }
  html:not([data-theme="dark"]) .dash-stat:nth-child(1):after { background: linear-gradient(135deg, #e4dfff, #f1eaff); }
  html:not([data-theme="dark"]) .dash-stat:nth-child(2):after { background: linear-gradient(135deg, #ffe1ef, #ffeedb); }
  html:not([data-theme="dark"]) .dash-stat:nth-child(3):after { background: linear-gradient(135deg, #ffedc9, #ffe0d0); }
  html:not([data-theme="dark"]) .dash-stat:nth-child(4):after { background: linear-gradient(135deg, #d7f5e9, #dceffc); }
  html:not([data-theme="dark"]) .dash-filters { background: linear-gradient(105deg, rgba(246,242,255,.94), rgba(255,248,242,.9)); }
  html:not([data-theme="dark"]) .dash-select,
  html:not([data-theme="dark"]) .dash-search { background: rgba(255,255,255,.92); border-color: #d8d0ea; }
  html:not([data-theme="dark"]) .dash-section h2:before { box-shadow: 0 0 0 5px rgba(238,234,255,.9); }
  html:not([data-theme="dark"]) .dash-section:nth-of-type(2) h2:before { background: linear-gradient(135deg, #e080b6, #f4a261); box-shadow: 0 0 0 5px rgba(255,232,237,.9); }
  html:not([data-theme="dark"]) .dash-section:nth-of-type(3) h2:before { background: linear-gradient(135deg, #e6a052, #e080b6); box-shadow: 0 0 0 5px rgba(255,240,218,.9); }
  html:not([data-theme="dark"]) .dash-section:nth-of-type(4) h2:before { background: linear-gradient(135deg, #42b997, #62b6e8); box-shadow: 0 0 0 5px rgba(222,248,240,.9); }
  html:not([data-theme="dark"]) .dash-row.is-clickable:hover { background: linear-gradient(90deg, rgba(240,235,255,.72), rgba(255,247,242,.5)); }
  html:not([data-theme="dark"]) .dash-row.is-selected { background: linear-gradient(90deg, rgba(236,231,255,.95), rgba(255,239,247,.68)); }
  html:not([data-theme="dark"]) .dash-bar { background: #ebe6f3; }

  @media (max-width: 900px) {
    .dash-stats { grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .dash-shell { width:min(100% - 24px, 1180px); padding-top:20px; }
    .dash-topbar { margin-bottom:34px; }
    .dash-head { display:block; }
    .dash-head:after { display:block; margin-top:18px; }
    .dash-stats { grid-template-columns:1fr; gap:10px; margin-bottom:24px; }
    .dash-stat { min-height:0; padding:16px; }
    .dash-filters { flex-direction:column; align-items:stretch; }
    .dash-select, .dash-search { min-width:0; width:100%; }
    .dash-clear { align-self:stretch; }
    .dash-section { padding:18px 16px; border-radius:16px; }
    .dash-row { align-items:flex-start; gap:10px; }
    .dash-score { min-width:72px; padding-top:2px; font-size:11px; }
    .dash-badge { padding:4px 6px; }
    .theme-toggle-label { display:none; }
    .dash-loading-state { min-height:calc(100vh - 150px); padding:10px 0 34px; }
    .dash-loading-card { padding:34px 20px 30px; border-radius:22px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* ---- Video access page: extra styles (everything above is the master dashboard's own look) ---- */
  [hidden] { display: none !important; }
  :root { --warn: #b7791f; }
  html[data-theme="dark"] { --warn: #f0b35a; }
  .dash-head:after { content: 'VIDEO ACCESS'; }

  .ac-help { margin: 0 0 22px; padding: 2px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .ac-help summary { padding: 13px 0; color: var(--ink); font: 700 13px var(--sans); cursor: pointer; }
  .ac-help ul { margin: 0 0 14px; padding-left: 18px; color: var(--ink-dim); font: 12px/1.75 var(--sans); }
  .ac-help li b { color: var(--ink); }

  .ac-toast { position: sticky; top: 10px; z-index: 20; margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px; color: var(--ink); background: var(--surface-strong); box-shadow: var(--shadow-soft); font: 600 12px/1.5 var(--mono); }
  .ac-toast.is-ok { border-color: var(--good); color: var(--good); }
  .ac-toast.is-err { border-color: var(--low); color: var(--low); }

  .ac-tabs { margin-bottom: 20px; }

  .ac-card { padding: 18px 2px; border-bottom: 1px solid var(--line); }
  .ac-card:last-child { border-bottom: 0; }
  .ac-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .ac-who b { color: var(--ink); font: 800 15px var(--sans); }
  .ac-who span { display: block; margin-top: 3px; color: var(--ink-dim); font: 11px var(--mono); }
  .ac-badge { flex-shrink: 0; padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-dim); background: var(--surface-soft); font: 700 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .ac-badge.is-good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line-strong)); }
  .ac-badge.is-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line-strong)); }
  .ac-badge.is-bad  { color: var(--low);  border-color: color-mix(in srgb, var(--low) 45%, var(--line-strong)); }

  .ac-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 20px; margin: 14px 0 0; }
  .ac-field { margin: 0; }
  .ac-field dt { color: var(--ink-dim); font: 600 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  .ac-field dd { margin: 4px 0 0; color: var(--ink); font: 600 13px/1.45 var(--sans); overflow-wrap: anywhere; }
  .ac-field dd small { display: block; margin-top: 2px; color: var(--ink-dim); font: 400 11px/1.5 var(--mono); }
  .ac-note { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--warn); border-radius: 6px; color: var(--ink); background: var(--surface-soft); font: 12px/1.6 var(--sans); }

  .ac-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .ac-btn { border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 13px; color: var(--ink); background: var(--surface-soft); font: 700 11px var(--mono); cursor: pointer; }
  .ac-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ac-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .ac-btn.primary:hover { color: #fff; filter: brightness(1.08); }
  html[data-theme="dark"] .ac-btn.primary, html[data-theme="dark"] .ac-btn.primary:hover { color: #0d1120; }
  .ac-btn.danger { color: var(--low); border-color: color-mix(in srgb, var(--low) 45%, var(--line-strong)); }
  .ac-btn.danger.solid { color: #fff; background: var(--low); border-color: var(--low); }
  html[data-theme="dark"] .ac-btn.danger.solid { color: #1a0d10; }
  .ac-btn[disabled] { opacity: .55; cursor: default; }

  .ac-panel { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface-soft); }
  .ac-panel > p { margin: 0 0 10px; color: var(--ink-dim); font: 12px/1.65 var(--sans); }
  .ac-panel > p b { color: var(--ink); }
  .ac-radio { display: flex; align-items: flex-start; gap: 9px; margin: 8px 0; color: var(--ink); font: 600 13px/1.4 var(--sans); cursor: pointer; }
  .ac-radio input { margin-top: 3px; accent-color: var(--accent); }
  .ac-radio small { display: block; margin-top: 2px; color: var(--ink-dim); font: 400 11px var(--mono); }
  .ac-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin: 12px 0; }
  .ac-row label { display: flex; flex-direction: column; gap: 5px; color: var(--ink-dim); font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .ac-input { min-width: 170px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 10px; color: var(--ink); background: var(--surface-strong); font: 13px var(--sans); text-transform: none; letter-spacing: 0; }
  .ac-input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; }
  .ac-preview { margin: 12px 0 2px; padding: 10px 12px; border-radius: 10px; color: var(--ink); background: var(--accent-soft); font: 600 12px/1.55 var(--sans); }

  .ac-count { margin-left: 8px; color: var(--ink-dim); font: 600 11px var(--mono); }
  .ac-mono { font-family: var(--mono); }
  @media (max-width: 640px) { .ac-fields { grid-template-columns: 1fr; } .ac-input { min-width: 0; width: 100%; } .ac-row label { width: 100%; } }
</style>
</head>
<body>

<div class="dash-shell">
  <div class="dash-topbar">
    <a class="dash-back" href="master.html">&larr; Master dashboard</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span>
    </button>
  </div>

  <div id="authgate" style="margin-top:20px;"></div>
  <div id="dashboard" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var key = "master-dashboard-theme";
  var root = document.documentElement;
  var button = document.getElementById("themeToggle");
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  var theme = saved === "dark" || saved === "light" ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function apply(next) {
    theme = next;
    root.setAttribute("data-theme", next);
    if (!button) return;
    var dark = next === "dark";
    button.setAttribute("aria-pressed", String(dark));
    button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    button.querySelector(".theme-toggle-icon").textContent = dark ? "☀" : "☾";
    button.querySelector(".theme-toggle-label").textContent = dark ? "Light mode" : "Dark mode";
  }
  apply(theme);
  if (button) button.addEventListener("click", function () {
    var next = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(key, next); } catch (e) {}
    apply(next);
  });
})();
</script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  "use strict";

  var SLOT_LABEL = { lesson: "Lesson video", quiz: "Quiz solution video", assignment: "Assignment solution video" };
  var TERMS = [["30", "30 days"], ["60", "60 days"], ["90", "90 days"], ["120", "120 days"], ["180", "180 days"], ["365", "365 days"], ["until", "Until a date\u2026"], ["never", "Never expires"]];

  var STATE = {
    session: null,
    data: null,
    tab: null,
    open: null,                 // which inline panel is open: "<kind>:<id>"
    toast: null,                // { ok: true|false, text }
    filters: { access: { q: "", status: "active" }, history: { q: "", status: "all" } },
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "value") node.value = attrs[k];
      else if (k === "checked") node.checked = !!attrs[k];
      else if (k === "disabled") node.disabled = !!attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "object" && typeof c.nodeType === "number" ? c : document.createTextNode(String(c)));
    });
    return node;
  }

  function api(payload) {
    if (!window.AuthEngine || typeof window.AuthEngine.adminCall !== "function") {
      return Promise.reject(new Error("This page needs the newest assets/auth.js \u2014 run \u201cSync site assets\u201d in the Quiz Maker."));
    }
    return window.AuthEngine.adminCall(STATE.session, payload);
  }

  // ---- words -----------------------------------------------------------------------------------

  function pretty(path) {
    var last = String(path || "").split("/").pop() || String(path || "");
    var s = last.replace(/[-_]+/g, " ").trim();
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : path;
  }
  function scopeInfo(scope) {
    if (scope === "*") return { title: "Every lesson on the site", sub: "*" };
    if (/\/\*$/.test(scope)) return { title: "All lessons in \u201c" + pretty(scope.slice(0, -2)) + "\u201d", sub: scope };
    return { title: pretty(scope), sub: scope };
  }
  function scopeCovers(scope, lesson) {
    if (!scope) return false;
    if (scope === "*" || scope === lesson) return true;
    return scope.slice(-2) === "/*" && lesson.indexOf(scope.slice(0, -1)) === 0;
  }
  function parentOf(path) {
    var i = String(path).lastIndexOf("/");
    return i > 0 ? path.slice(0, i) : "";
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function addDays(ymd, n) {
    var p = ymd.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2);
  }
  function dash(v) { return v === "" || v === null || v === undefined ? "\u2014" : v; }

  function untilText(a) {
    if (a.state === "invalid") return { main: "Unreadable end date", sub: "\u201c" + a.expires_at + "\u201d \u2014 this row gives no access until the date is fixed" };
    if (a.expires_at === "") return { main: "Never expires", sub: "no end date" };
    if (a.days_left === null) return { main: a.expires_at, sub: "" };
    if (a.days_left > 0) return { main: a.expires_at, sub: plural(a.days_left, "day") + " left" };
    if (a.days_left === 0) return { main: a.expires_at, sub: "last day is today" };
    return { main: a.expires_at, sub: "ended " + plural(-a.days_left, "day") + " ago" };
  }
  function accessBadge(a) {
    if (a.state === "cancelled") return { text: "Cancelled", cls: "is-bad" };
    if (a.state === "invalid") return { text: "Fix date", cls: "is-warn" };
    if (a.state === "expired") return { text: "Expired", cls: "" };
    if (a.days_left !== null && a.days_left <= 7) return { text: "Ends soon", cls: "is-warn" };
    return { text: "Active", cls: "is-good" };
  }
  function payBadge(status) {
    if (status === "pending") return { text: "Waiting", cls: "is-warn" };
    if (status === "approved") return { text: "Approved", cls: "is-good" };
    if (status === "rejected") return { text: "Rejected", cls: "is-bad" };
    if (status === "revoked") return { text: "Revoked", cls: "is-bad" };
    return { text: status || "?", cls: "" };
  }
  function badge(b) { return el("span", { class: "ac-badge " + b.cls }, [b.text]); }

  function whoBlock(name, phone, known) {
    return el("div", { class: "ac-who" }, [
      el("b", {}, [name || "Unknown student"]),
      el("span", {}, [phone + (known === false ? "  \u00b7  no account with this number yet" : "")]),
    ]);
  }
  function field(label, main, sub) {
    return el("dl", { class: "ac-field" }, [el("dt", {}, [label]), el("dd", {}, [main, sub ? el("small", {}, [sub]) : null])]);
  }

  // ---- talking to the server -------------------------------------------------------------------

  function setToast(ok, text) { STATE.toast = { ok: ok, text: text }; }

  // Puts the current message (or none) at the top without rebuilding the page, so a form the
  // teacher is filling in keeps what they chose when something fails.
  function refreshToast() {
    var old = document.querySelector("#dashboard .ac-toast");
    if (old) old.remove();
    var t = toastNode();
    var head = document.querySelector("#dashboard .dash-head");
    if (t && head) head.insertAdjacentElement("afterend", t);
  }

  function run(payload, okText, btn) {
    STATE.toast = null;
    refreshToast();
    return api(payload).then(
      function (res) {
        setToast(true, typeof okText === "function" ? okText(res) : okText);
        STATE.open = null;
        return load(true);
      },
      function (err) {
        setToast(false, (err && err.message) || "That didn't work.");
        refreshToast();
        if (btn) btn.disabled = false;
      }
    );
  }

  function load(quiet) {
    if (!quiet) renderLoading();
    return api({ action: "admin_access_overview" }).then(
      function (data) {
        STATE.data = data;
        if (!STATE.tab) STATE.tab = data.counts.pending > 0 ? "requests" : "access";
        render();
      },
      function (err) {
        var msg = (err && err.message) || "Couldn't load the access dashboard. Try refreshing.";
        if (msg === "Not authorized.") msg = "This account is signed in, but doesn't have admin access. Set is_admin = TRUE on this row in the Students sheet to use this dashboard.";
        renderError(msg);
      }
    );
  }

  // ---- shared pieces -----------------------------------------------------------------------------

  function termControls(idPrefix, onChange, defaultTerm) {
    var select = el("select", { class: "ac-input", id: idPrefix + "-term", "aria-label": "How long" },
      TERMS.map(function (t) { return el("option", { value: t[0] }, [t[1]]); }));
    select.value = defaultTerm || "30";
    var until = el("input", { class: "ac-input", type: "date", id: idPrefix + "-until", "aria-label": "End date" });
    var untilLabel = el("label", { hidden: "" }, ["End date", until]);
    function sync() { untilLabel.hidden = select.value !== "until"; onChange(); }
    select.addEventListener("change", sync);
    until.addEventListener("input", onChange);
    return {
      node: el("div", { class: "ac-row" }, [el("label", {}, ["Access lasts", select]), untilLabel]),
      term: function () {
        if (select.value === "never") return { never: true };
        if (select.value === "until") return until.value ? { expires_at: until.value } : null;
        return { days: Number(select.value) };
      },
      describe: function (today, base) {
        if (select.value === "never") return "with no end date";
        if (select.value === "until") return until.value ? "until " + until.value : "(pick an end date)";
        var start = base && base > today ? base : today;
        return "until " + addDays(start, Number(select.value)) + (base && base > today ? " (added to the end date they already have)" : "");
      },
    };
  }

  function toastNode() {
    if (!STATE.toast) return null;
    return el("div", { class: "ac-toast " + (STATE.toast.ok ? "is-ok" : "is-err"), role: "status", "aria-live": "polite" }, [STATE.toast.text]);
  }

  function statCard(n, label) { return el("div", { class: "dash-stat" }, [el("b", {}, [n]), el("span", {}, [label])]); }

  function helpBlock() {
    return el("details", { class: "ac-help" }, [
      el("summary", {}, ["How this works"]),
      el("ul", {}, [
        el("li", {}, [el("b", {}, ["A student presses \u201cI paid\u201d"]), " on a locked video \u2192 it appears under Requests. Nothing is unlocked until you approve it \u2014 check your wallet or bank app first, then match the reference."]),
        el("li", {}, [el("b", {}, ["Approving"]), " unlocks that lesson's three videos (lesson, quiz solution, assignment solution), or a whole folder / everything if you choose that."]),
        el("li", {}, [el("b", {}, ["Access ends by itself"]), " on its end date. ", el("b", {}, ["Revoke"]), " ends it right now: the video closes the next time they load the page (or press \u201cCheck again\u201d)."]),
        el("li", {}, ["Changing a payment's status in the Google Sheet to anything but \u201capproved\u201d also switches its access off. Deleting the payment row does not."]),
        el("li", {}, [el("b", {}, ["Open"]), " a video (Videos tab) and everyone can watch it without paying; ", el("b", {}, ["Locked"]), " means only you and students with access."]),
        el("li", {}, ["Revoking stops new views. Someone who already saved the video's link could still use it \u2014 that can't be taken back."]),
      ]),
    ]);
  }

  // ---- the tabs -------------------------------------------------------------------------------------

  function tabsNode(d) {
    var c = d.counts;
    var list = [
      ["requests", "Requests", c.pending],
      ["access", "Who has access", c.active + c.expired + c.cancelled + c.invalid],
      ["history", "Payment history", d.payments.length],
      ["videos", "Videos", d.videos.length],
      ["grant", "Give access", null],
    ];
    return el("div", { class: "dash-tabs ac-tabs", role: "group", "aria-label": "Sections" }, list.map(function (t) {
      var b = el("button", { class: "dash-tab" + (STATE.tab === t[0] ? " is-active" : ""), type: "button", "data-tab": t[0], "aria-pressed": String(STATE.tab === t[0]) },
        [t[1], t[2] === null ? null : el("small", {}, [t[2]])]);
      b.addEventListener("click", function () { STATE.tab = t[0]; STATE.open = null; STATE.toast = null; render(); });
      return b;
    }));
  }

  function cancelBtn() {
    var b = el("button", { class: "ac-btn", type: "button" }, ["Cancel"]);
    b.addEventListener("click", function () { STATE.open = null; render(); });
    return b;
  }
  function openPanel(key) { STATE.open = key; render(); }

  // ---- REQUESTS --------------------------------------------------------------------------------------

  function activeAccessFor(d, phone, lesson) {
    var key = phone.replace(/\D/g, "").slice(-10);
    return d.access.filter(function (a) {
      return a.state === "active" && a.phone.replace(/\D/g, "").slice(-10) === key && scopeCovers(a.scope, lesson);
    }).sort(function (x, y) { return (x.expires_at === "" ? "9999" : x.expires_at) < (y.expires_at === "" ? "9999" : y.expires_at) ? 1 : -1; })[0];
  }

  function approvePanel(d, p) {
    var cover = "this";
    var parent = parentOf(p.scope);
    var preview = el("div", { class: "ac-preview", "aria-live": "polite" });
    var term;
    function scopeNow() { return cover === "this" ? p.scope : cover === "folder" ? parent + "/*" : "*"; }
    function update() {
      var t = term.term();
      var existing = d.access.filter(function (a) { return a.phone.replace(/\D/g, "").slice(-10) === p.phone.replace(/\D/g, "").slice(-10) && a.scope === scopeNow() && a.state === "active" && a.expires_at; })[0];
      preview.textContent = (p.name || p.phone) + " will be able to watch " + scopeInfo(scopeNow()).title + " " + term.describe(d.today, existing && existing.expires_at) + ".";
      go.disabled = !t;
    }
    function radio(value, title, sub) {
      var input = el("input", { type: "radio", name: "cover-" + p.payment_id, value: value, checked: value === cover });
      input.addEventListener("change", function () { cover = value; update(); });
      return el("label", { class: "ac-radio" }, [input, el("span", {}, [title, el("small", {}, [sub])])]);
    }
    term = termControls("ap-" + p.payment_id, update, "30");
    var go = el("button", { class: "ac-btn primary", type: "button", "data-do": "approve" }, ["Approve & unlock"]);
    go.addEventListener("click", function () {
      var t = term.term();
      if (!t) return;
      go.disabled = true;
      var payload = Object.assign({ action: "admin_decide_payment", payment_id: p.payment_id, decision: "approve" }, t);
      if (cover !== "this") payload.scope = scopeNow();
      run(payload, function (r) { return "Approved " + (p.name || p.phone) + " \u2014 " + scopeInfo(r.scope).title + (r.expires_at ? " until " + r.expires_at : ", no end date") + "."; }, go);
    });
    var radios = [radio("this", "Just this lesson", p.scope)];
    if (parent) radios.push(radio("folder", "Every lesson in \u201c" + pretty(parent) + "\u201d", parent + "/*"));
    radios.push(radio("all", "Every lesson on the site", "*"));
    var panel = el("div", { class: "ac-panel", "data-panel": "approve" }, [
      el("p", {}, [el("b", {}, ["Approve this payment."]), " Choose what it unlocks and for how long."]),
      el("div", {}, radios),
      term.node, preview,
      el("div", { class: "ac-actions" }, [go, cancelBtn()]),
    ]);
    update();
    return panel;
  }

  function rejectPanel(p) {
    var yes = el("button", { class: "ac-btn danger solid", type: "button", "data-do": "reject" }, ["Yes, reject it"]);
    yes.addEventListener("click", function () {
      yes.disabled = true;
      run({ action: "admin_decide_payment", payment_id: p.payment_id, decision: "reject" }, "Rejected " + (p.name || p.phone) + "'s request. They can send a new one.", yes);
    });
    return el("div", { class: "ac-panel", "data-panel": "reject" }, [
      el("p", {}, [el("b", {}, ["Reject this request?"]), " The student will see that it wasn't approved and can send a new payment note."]),
      el("div", { class: "ac-actions" }, [yes, cancelBtn()]),
    ]);
  }

  function requestsPanel(d) {
    var pending = d.payments.filter(function (p) { return p.status === "pending"; });
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Payment requests waiting for you", el("span", { class: "ac-count" }, [String(pending.length)])]),
      el("p", { class: "dash-section-note" }, ["Newest first. Nothing is unlocked until you approve."]),
    ]);
    if (!pending.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No requests waiting. A new one appears here when a student presses \u201cI paid\u201d on a locked video."]));
      return section;
    }
    pending.forEach(function (p) {
      var have = activeAccessFor(d, p.phone, p.scope);
      var si = scopeInfo(p.scope);
      var card = el("div", { class: "ac-card", "data-payment": p.payment_id }, [
        el("div", { class: "ac-top" }, [whoBlock(p.name, p.phone, p.known_student), badge(payBadge("pending"))]),
        el("div", { class: "ac-fields" }, [
          field("Wants to watch", si.title, si.sub),
          field("Payment reference", dash(p.reference)),
          p.note ? field("Note from the student", p.note) : null,
          field("Asked", dash(p.created_at)),
          field("Access right now", have ? "Already has access (renewal)" : "None", have ? (have.expires_at ? "until " + have.expires_at : "never expires") : "this would be their first"),
          field("Request id", p.payment_id),
        ]),
      ]);
      var key = "req:" + p.payment_id;
      var approve = el("button", { class: "ac-btn primary", type: "button", "data-open": "approve" }, ["Approve\u2026"]);
      var reject = el("button", { class: "ac-btn danger", type: "button", "data-open": "reject" }, ["Reject\u2026"]);
      approve.addEventListener("click", function () { openPanel(key + ":approve"); });
      reject.addEventListener("click", function () { openPanel(key + ":reject"); });
      if (STATE.open === key + ":approve") card.appendChild(approvePanel(d, p));
      else if (STATE.open === key + ":reject") card.appendChild(rejectPanel(p));
      else card.appendChild(el("div", { class: "ac-actions" }, [approve, reject]));
      section.appendChild(card);
    });
    return section;
  }

  // ---- WHO HAS ACCESS --------------------------------------------------------------------------------

  function filtersNode(which, statusOptions, placeholder) {
    var f = STATE.filters[which];
    var search = el("input", { class: "dash-search", type: "search", placeholder: placeholder, "aria-label": "Search", "data-search": which, value: f.q });
    var select = el("select", { class: "dash-select", "aria-label": "Status", "data-status": which },
      statusOptions.map(function (o) { return el("option", { value: o[0] }, [o[1]]); }));
    select.value = f.status;
    search.addEventListener("input", function () {
      f.q = search.value;
      var pos = search.selectionStart;
      render();
      var again = document.querySelector('[data-search="' + which + '"]');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    });
    select.addEventListener("change", function () { f.status = select.value; render(); });
    return el("div", { class: "dash-filters" }, [el("label", {}, ["Search", search]), el("label", {}, ["Show", select])]);
  }
  function matches(q, parts) {
    q = q.trim().toLowerCase();
    if (!q) return true;
    return parts.join(" ").toLowerCase().indexOf(q) !== -1;
  }

  function revokePanel(a) {
    var si = scopeInfo(a.scope);
    var yes = el("button", { class: "ac-btn danger solid", type: "button", "data-do": "revoke" }, [a.state === "cancelled" ? "Yes, remove this row" : "Yes, revoke access"]);
    yes.addEventListener("click", function () {
      yes.disabled = true;
      run({ action: "admin_revoke_access", phone: a.phone, scope: a.scope },
        function (r) { return (a.state === "cancelled" ? "Removed " : "Revoked ") + (a.name || a.phone) + "'s access to " + si.title + "." + (r.payments_revoked && r.payments_revoked.length ? " Payment " + r.payments_revoked.join(", ") + " is now marked revoked." : ""); }, yes);
    });
    var text = a.state === "cancelled"
      ? [el("b", {}, ["Remove this row?"]), " It already gives no access (its payment is \u201c" + a.payment_status + "\u201d). This just tidies the list; the payment keeps its status."]
      : [el("b", {}, ["Revoke " + (a.name || a.phone) + "'s access to " + si.title + "?"]),
         " Their videos close the next time they load the page (or press \u201cCheck again\u201d). " +
         (a.payment_id ? "The payment behind it is marked revoked in the history. " : "") +
         "If they hold another grant that also covers these lessons, that one keeps working. Anyone who already saved the video link can still use it."];
    return el("div", { class: "ac-panel", "data-panel": "revoke" }, [el("p", {}, text), el("div", { class: "ac-actions" }, [yes, cancelBtn()])]);
  }

  function renewPanel(d, a) {
    var preview = el("div", { class: "ac-preview", "aria-live": "polite" });
    var term;
    function update() {
      var t = term.term();
      preview.textContent = (a.name || a.phone) + " will be able to watch " + scopeInfo(a.scope).title + " " +
        term.describe(d.today, (a.state === "active" || a.state === "cancelled") && a.expires_at ? a.expires_at : "") + ".";
      go.disabled = !t;
    }
    term = termControls("rn-" + a.phone + "-" + a.scope, update, "30");
    var go = el("button", { class: "ac-btn primary", type: "button", "data-do": "renew" }, [a.state === "cancelled" ? "Switch back on" : "Extend access"]);
    go.addEventListener("click", function () {
      var t = term.term();
      if (!t) return;
      go.disabled = true;
      run(Object.assign({ action: "admin_grant_access", phone: a.phone, scope: a.scope }, t),
        function (r) { return (a.name || a.phone) + " now has " + scopeInfo(r.scope).title + (r.expires_at ? " until " + r.expires_at : " with no end date") + "."; }, go);
    });
    update();
    return el("div", { class: "ac-panel", "data-panel": "renew" }, [
      el("p", {}, a.state === "cancelled"
        ? [el("b", {}, ["Switch this access back on."]), " It becomes a manual grant, no longer tied to the cancelled payment."]
        : [el("b", {}, [a.state === "expired" ? "Renew this access." : "Extend this access."]), " Renewing adds to the end date they already have; it never shortens it."]),
      term.node, preview, el("div", { class: "ac-actions" }, [go, cancelBtn()]),
    ]);
  }

  function accessCard(d, a) {
    var si = scopeInfo(a.scope), u = untilText(a), key = "acc:" + a.phone + "|" + a.scope;
    var how, howSub;
    if (a.payment_id) {
      var p = d.payments.filter(function (x) { return x.payment_id === a.payment_id; })[0];
      how = "Payment " + a.payment_id + " (" + (a.payment_status || "no longer in the Payments sheet") + ")";
      howSub = p ? "reference: " + dash(p.reference) : "";
    } else {
      how = a.source === "manual" ? "Added by hand (no payment)" : dash(a.source);
      howSub = "";
    }
    var card = el("div", { class: "ac-card", "data-access": a.phone + "|" + a.scope }, [
      el("div", { class: "ac-top" }, [whoBlock(a.name, a.phone, a.known_student), badge(accessBadge(a))]),
      el("div", { class: "ac-fields" }, [
        field("Can watch", si.title, si.sub),
        field("Until", u.main, u.sub),
        field("Given", dash(a.granted_at)),
        field("How", how, howSub),
      ]),
    ]);
    if (a.state === "cancelled") card.appendChild(el("div", { class: "ac-note" }, ["This access is switched off because payment " + a.payment_id + " is now \u201c" + a.payment_status + "\u201d. The student cannot watch. You can leave the row or remove it."]));
    if (a.state === "invalid") card.appendChild(el("div", { class: "ac-note" }, ["The end date in the Entitlements sheet can't be read, so this row gives no access. Fix the date there, or extend it here."]));
    var renew = el("button", { class: "ac-btn primary", type: "button", "data-open": "renew" }, [a.state === "expired" ? "Renew\u2026" : a.state === "cancelled" ? "Grant again\u2026" : "Extend\u2026"]);
    var revoke = el("button", { class: "ac-btn danger", type: "button", "data-open": "revoke" }, [a.state === "cancelled" ? "Remove row\u2026" : "Revoke\u2026"]);
    renew.addEventListener("click", function () { openPanel(key + ":renew"); });
    revoke.addEventListener("click", function () { openPanel(key + ":revoke"); });
    if (STATE.open === key + ":renew") card.appendChild(renewPanel(d, a));
    else if (STATE.open === key + ":revoke") card.appendChild(revokePanel(a));
    else card.appendChild(el("div", { class: "ac-actions" }, a.state === "cancelled" ? [revoke, renew] : [renew, revoke]));
    return card;
  }

  function accessPanel(d) {
    var f = STATE.filters.access;
    var wrap = el("div", {});
    wrap.appendChild(filtersNode("access", [["active", "Active now"], ["ending", "Ending within 7 days"], ["expired", "Expired"], ["problem", "Cancelled / needs fixing"], ["all", "Everything"]], "Name, phone or lesson"));
    var list = d.access.filter(function (a) {
      var ok = f.status === "all" ||
        (f.status === "active" && a.state === "active") ||
        (f.status === "ending" && a.state === "active" && a.days_left !== null && a.days_left <= 7) ||
        (f.status === "expired" && a.state === "expired") ||
        (f.status === "problem" && (a.state === "cancelled" || a.state === "invalid"));
      return ok && matches(f.q, [a.name, a.phone, a.scope, a.payment_id, a.source]);
    });
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Who can watch what", el("span", { class: "ac-count" }, [String(list.length) + " of " + d.access.length])]),
      el("p", { class: "dash-section-note" }, ["Every grant, with its end date and where it came from. Newest first."]),
    ]);
    if (!list.length) section.appendChild(el("div", { class: "dash-empty" }, [d.access.length ? "Nothing matches this filter." : "Nobody has been given access yet."]));
    list.forEach(function (a) { section.appendChild(accessCard(d, a)); });
    wrap.appendChild(section);
    return wrap;
  }

  // ---- HISTORY ----------------------------------------------------------------------------------------

  function historyPanel(d) {
    var f = STATE.filters.history;
    var wrap = el("div", {});
    wrap.appendChild(filtersNode("history", [["all", "All requests"], ["pending", "Waiting"], ["approved", "Approved"], ["rejected", "Rejected"], ["revoked", "Revoked"]], "Name, phone, reference or lesson"));
    var list = d.payments.filter(function (p) {
      return (f.status === "all" || p.status === f.status) && matches(f.q, [p.name, p.phone, p.reference, p.scope, p.payment_id, p.note]);
    });
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Every payment request", el("span", { class: "ac-count" }, [String(list.length) + " of " + d.payments.length])]),
      el("p", { class: "dash-section-note" }, ["The full record: who asked, what they wrote, what you decided and when."]),
    ]);
    if (!list.length) section.appendChild(el("div", { class: "dash-empty" }, [d.payments.length ? "Nothing matches this filter." : "No payment requests yet."]));
    list.forEach(function (p) {
      var si = scopeInfo(p.scope), key = "pay:" + p.payment_id;
      var accessText = null, accessSub = "";
      if (p.status === "approved" || p.status === "revoked" || p.access_state) {
        if (p.access_until) { accessText = p.access_until === "never" ? "Never expires" : "until " + p.access_until; accessSub = p.access_state === "active" ? "currently active" : p.access_state === "expired" ? "expired" : p.access_state; }
        else accessText = p.status === "revoked" ? "Access removed" : "No access row found";
      }
      var card = el("div", { class: "ac-card", "data-history": p.payment_id }, [
        el("div", { class: "ac-top" }, [whoBlock(p.name, p.phone, p.known_student), badge(payBadge(p.status))]),
        el("div", { class: "ac-fields" }, [
          field("Asked for", si.title, si.sub),
          field("Payment reference", dash(p.reference)),
          p.note ? field("Note from the student", p.note) : null,
          field("Asked", dash(p.created_at)),
          field("Decided", p.status === "pending" ? "Not yet" : dash(p.decided_at)),
          accessText ? field("Access it gave", accessText, accessSub) : null,
          field("Request id", p.payment_id),
        ]),
      ]);
      if (p.status === "approved" && p.access_state === "active") {
        var rv = el("button", { class: "ac-btn danger", type: "button", "data-open": "revoke-pay" }, ["Revoke this access\u2026"]);
        rv.addEventListener("click", function () { openPanel(key + ":revoke"); });
        if (STATE.open === key + ":revoke") {
          var yes = el("button", { class: "ac-btn danger solid", type: "button", "data-do": "revoke" }, ["Yes, revoke access"]);
          yes.addEventListener("click", function () {
            yes.disabled = true;
            run({ action: "admin_revoke_access", payment_id: p.payment_id }, "Revoked the access from payment " + p.payment_id + " (" + (p.name || p.phone) + ").", yes);
          });
          card.appendChild(el("div", { class: "ac-panel", "data-panel": "revoke" }, [
            el("p", {}, [el("b", {}, ["Revoke the access this payment gave?"]), " " + (p.name || p.phone) + " loses it on their next page load. The request stays here, marked revoked."]),
            el("div", { class: "ac-actions" }, [yes, cancelBtn()]),
          ]));
        } else card.appendChild(el("div", { class: "ac-actions" }, [rv]));
      } else if (p.status === "pending") {
        card.appendChild(el("div", { class: "ac-note" }, ["Waiting for you \u2014 decide it under Requests."]));
      }
      section.appendChild(card);
    });
    wrap.appendChild(section);
    return wrap;
  }

  // ---- VIDEOS -----------------------------------------------------------------------------------------

  function videosPanel(d) {
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Videos", el("span", { class: "ac-count" }, [d.counts.videos_locked + " locked \u00b7 " + d.counts.videos_open + " open"])]),
      el("p", { class: "dash-section-note" }, ["Locked = only you and students with access can watch. Open = anyone who visits the page."]),
    ]);
    if (!d.videos.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No videos are set up yet. They are added from the Quiz Maker."]));
      return section;
    }
    var sorted = d.videos.slice().sort(function (a, b) { return (a.lesson + a.slot) < (b.lesson + b.slot) ? -1 : 1; });
    sorted.forEach(function (v) {
      var key = "vid:" + v.lesson + "|" + v.slot;
      var watchers = new Set();
      if (v.locked) d.access.forEach(function (a) { if (a.state === "active" && scopeCovers(a.scope, v.lesson)) watchers.add(a.phone.replace(/\D/g, "").slice(-10)); });
      var idMatch = /embed\/([A-Za-z0-9_-]+)/.exec(v.embed_url) || /video\/(\d+)/.exec(v.embed_url);
      var card = el("div", { class: "ac-card", "data-video": v.lesson + "|" + v.slot }, [
        el("div", { class: "ac-top" }, [
          el("div", { class: "ac-who" }, [el("b", {}, [pretty(v.lesson) + " \u2014 " + (SLOT_LABEL[v.slot] || v.slot)]), el("span", {}, [v.lesson])]),
          badge(v.locked ? { text: "Locked", cls: "is-good" } : { text: "Open to everyone", cls: "is-warn" }),
        ]),
        el("div", { class: "ac-fields" }, [
          field("Who can watch", v.locked ? "You + " + plural(watchers.size, "student") : "Everyone", v.locked ? "students with active access to this lesson" : "no payment needed"),
          field("Video", idMatch ? idMatch[1] : "\u2014", v.embed_url),
          field("Last changed", dash(v.updated_at)),
        ]),
      ]);
      var toggle = el("button", { class: "ac-btn " + (v.locked ? "" : "primary"), type: "button", "data-open": "lock" }, [v.locked ? "Open to everyone\u2026" : "Lock it"]);
      function doToggle(btn) {
        btn.disabled = true;
        run({ action: "admin_set_video", lesson: v.lesson, slot: v.slot, locked: !v.locked },
          (SLOT_LABEL[v.slot] || v.slot) + " of \u201c" + pretty(v.lesson) + "\u201d is now " + (v.locked ? "open to everyone." : "locked."), btn);
      }
      if (v.locked) {
        toggle.addEventListener("click", function () { openPanel(key + ":open"); });
        if (STATE.open === key + ":open") {
          var yes = el("button", { class: "ac-btn primary", type: "button", "data-do": "open" }, ["Yes, open it to everyone"]);
          yes.addEventListener("click", function () { doToggle(yes); });
          card.appendChild(el("div", { class: "ac-panel", "data-panel": "open" }, [
            el("p", {}, [el("b", {}, ["Open this video to everyone?"]), " Anyone who visits the page can watch it without paying, and anyone who sees the link can keep it. You can lock it again later, but not take back what people already saw."]),
            el("div", { class: "ac-actions" }, [yes, cancelBtn()]),
          ]));
        } else card.appendChild(el("div", { class: "ac-actions" }, [toggle]));
      } else {
        toggle.addEventListener("click", function () { doToggle(toggle); });
        card.appendChild(el("div", { class: "ac-actions" }, [toggle]));
      }
      section.appendChild(card);
    });
    return section;
  }

  // ---- GIVE ACCESS ------------------------------------------------------------------------------------

  function grantPanel(d) {
    var lessons = {}, folders = {};
    d.videos.forEach(function (v) { lessons[v.lesson] = 1; var p = parentOf(v.lesson); if (p) folders[p] = 1; });
    var phone = el("input", { class: "ac-input", type: "tel", id: "gr-phone", placeholder: "01xxxxxxxxx", "aria-label": "Student phone", autocomplete: "off" });
    var scopeSel = el("select", { class: "ac-input", id: "gr-scope", "aria-label": "What it covers" }, [
      el("option", { value: "" }, ["Choose\u2026"]),
      el("optgroup", { label: "One lesson" }, Object.keys(lessons).sort().map(function (l) { return el("option", { value: l }, [pretty(l) + "  (" + l + ")"]); })),
      el("optgroup", { label: "A whole folder" }, Object.keys(folders).sort().map(function (f) { return el("option", { value: f + "/*" }, ["All lessons in " + pretty(f) + "  (" + f + "/*)"]); })),
      el("optgroup", { label: "Everything" }, [el("option", { value: "*" }, ["Every lesson on the site"])]),
      el("optgroup", { label: "Other" }, [el("option", { value: "__custom" }, ["Type a path\u2026"])]),
    ]);
    var custom = el("input", { class: "ac-input", type: "text", id: "gr-custom", placeholder: "programming/other/some-lesson", "aria-label": "Lesson path", hidden: "" });
    var preview = el("div", { class: "ac-preview", "aria-live": "polite" });
    var term;
    function scopeValue() { return scopeSel.value === "__custom" ? custom.value.trim() : scopeSel.value; }
    function update() {
      custom.hidden = scopeSel.value !== "__custom";
      var t = term.term(), s = scopeValue();
      preview.textContent = phone.value.trim() && s ? phone.value.trim() + " will be able to watch " + scopeInfo(s).title + " " + term.describe(d.today, "") + "." : "Fill in the phone number and what it covers.";
      go.disabled = !(phone.value.trim() && s && t);
    }
    term = termControls("gr", update, "30");
    var go = el("button", { class: "ac-btn primary", type: "button", "data-do": "grant" }, ["Give access"]);
    go.addEventListener("click", function () {
      var t = term.term();
      if (!t) return;
      go.disabled = true;
      STATE.toast = null;
      refreshToast();
      api(Object.assign({ action: "admin_grant_access", phone: phone.value.trim(), scope: scopeValue() }, t)).then(
        function (r) {
          setToast(true, (r.known_student ? r.name + " (" + r.phone + ")" : r.phone + " \u2014 no account with this number yet; it will apply when they register") +
            " now has " + scopeInfo(r.scope).title + (r.expires_at ? " until " + r.expires_at : " with no end date") + ".");
          return load(true);
        },
        function (err) { setToast(false, (err && err.message) || "That didn't work."); refreshToast(); go.disabled = false; }
      );
    });
    [phone, scopeSel, custom].forEach(function (n) { n.addEventListener("input", update); n.addEventListener("change", update); });
    update();
    return el("div", { class: "dash-section" }, [
      el("h2", {}, ["Give access by hand"]),
      el("p", { class: "dash-section-note" }, ["For a cash payment, a scholarship, or fixing a mistake \u2014 no request needed. Works for a number that hasn't registered yet."]),
      el("div", { class: "ac-row" }, [el("label", {}, ["Student's phone", phone]), el("label", {}, ["What it covers", scopeSel, custom])]),
      term.node, preview, el("div", { class: "ac-actions" }, [go]),
    ]);
  }

  // ---- page ------------------------------------------------------------------------------------------

  function render() {
    var root = document.getElementById("dashboard");
    var y = window.scrollY;
    var d = STATE.data;
    root.innerHTML = "";
    root.hidden = false;
    var c = d.counts;
    var people = {};
    d.access.forEach(function (a) { if (a.state === "active") people[a.phone.replace(/\D/g, "").slice(-10)] = 1; });
    root.appendChild(el("div", { class: "dash-head" }, [el("div", {}, [
      el("h1", {}, ["Video access"]),
      el("p", {}, ["Who can watch which videos, the payments behind it, and how to take access away. Today is " + d.today + " (Cairo)."]),
    ])]));
    var t = toastNode();
    if (t) root.appendChild(t);
    root.appendChild(helpBlock());
    root.appendChild(el("div", { class: "dash-stats" }, [
      statCard(c.pending, "requests waiting for you"),
      statCard(Object.keys(people).length, "students with active access"),
      statCard(c.ending_soon, "ending within 7 days"),
      statCard(c.videos_locked + " / " + c.videos_open, "videos locked / open"),
    ]));
    root.appendChild(tabsNode(d));
    var panel = STATE.tab === "requests" ? requestsPanel(d)
      : STATE.tab === "access" ? accessPanel(d)
      : STATE.tab === "history" ? historyPanel(d)
      : STATE.tab === "videos" ? videosPanel(d)
      : grantPanel(d);
    root.appendChild(panel);
    window.scrollTo(0, y);
  }

  function renderError(message) {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-err" }, [message]));
  }

  function renderNeedsRelogin() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    var btn = el("button", { class: "qz-next", type: "button" }, ["Log out & sign in again \u2192"]);
    btn.addEventListener("click", function () { window.AuthEngine.clearSession(); location.reload(); });
    root.appendChild(el("div", { class: "dash-err" }, ["Your saved sign-in is missing a session token. Log in again to refresh it (phone and password stay the same)."]));
    root.appendChild(btn);
  }

  function renderLoading() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-loading-state", role: "status", "aria-live": "polite" }, [
      el("div", { class: "dash-loading-card" }, [
        el("div", { class: "dash-loading-art", "aria-hidden": "true" }, [el("span", { class: "dash-loading-ring" }), el("span", { class: "dash-loading-core" })]),
        el("div", { class: "dash-loading-copy" }, [
          el("h1", { class: "dash-loading-title" }, ["Loading video access"]),
          el("p", { class: "dash-loading-note" }, ["Reading payments, access and videos", el("span", { class: "dash-loading-dots", "aria-hidden": "true" }, [el("i"), el("i"), el("i")])]),
        ]),
      ]),
    ]));
  }

  window.AuthEngine.mount("#authgate", function (session) {
    document.getElementById("authgate").remove();
    if (!session.session_token) { renderNeedsRelogin(); return; }
    // Convenience only: the server re-checks is_admin on every call.
    if (session.is_admin === false) { location.href = "student.html"; return; }
    STATE.session = session;
    load(false);
  });
})();
</script>

</body>
</html>
