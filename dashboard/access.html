  .ac-badge { flex-shrink: 0; padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-dim); background: var(--surface-soft); font: 700 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .ac-badge.is-good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line-strong)); }
  .ac-badge.is-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line-strong)); }
  .ac-badge.is-bad  { color: var(--low);  border-color: color-mix(in srgb, var(--low) 45%, var(--line-strong)); }

  .ac-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 20px; margin: 14px 0 0; }
  .ac-field { margin: 0; }
  .ac-field dt { color: var(--ink-dim); font: 600 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  .ac-field dd { margin: 4px 0 0; color: var(--ink); font: 600 13px/1.45 var(--sans); overflow-wrap: anywhere; }
  .ac-field dd small { display: block; margin-top: 2px; color: var(--ink-dim); font: 400 11px/1.5 var(--mono); }
  .ac-note { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--warn); border-radius: 6px; color: var(--ink); background: var(--surface-soft); font: 12px/1.6 var(--sans); }

  .ac-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .ac-btn { border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 13px; color: var(--ink); background: var(--surface-soft); font: 700 11px var(--mono); cursor: pointer; }
  .ac-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ac-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .ac-btn.primary:hover { color: #fff; filter: brightness(1.08); }
  html[data-theme="dark"] .ac-btn.primary, html[data-theme="dark"] .ac-btn.primary:hover { color: #0d1120; }
  .ac-btn.danger { color: var(--low); border-color: color-mix(in srgb, var(--low) 45%, var(--line-strong)); }
  .ac-btn.danger.solid { color: #fff; background: var(--low); border-color: var(--low); }
  html[data-theme="dark"] .ac-btn.danger.solid { color: #1a0d10; }
  .ac-btn[disabled] { opacity: .55; cursor: default; }

  .ac-panel { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface-soft); }
  .ac-panel > p { margin: 0 0 10px; color: var(--ink-dim); font: 12px/1.65 var(--sans); }
  .ac-panel > p b { color: var(--ink); }
  .ac-check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .ac-check input { margin-top: 3px; }
  .ac-radio { display: flex; align-items: flex-start; gap: 9px; margin: 8px 0; color: var(--ink); font: 600 13px/1.4 var(--sans); cursor: pointer; }
  .ac-radio input { margin-top: 3px; accent-color: var(--accent); }
  .ac-radio small { display: block; margin-top: 2px; color: var(--ink-dim); font: 400 11px var(--mono); }
  .ac-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin: 12px 0; }
  .ac-row label { display: flex; flex-direction: column; gap: 5px; color: var(--ink-dim); font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .ac-input { min-width: 170px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 10px; color: var(--ink); background: var(--surface-strong); font: 13px var(--sans); text-transform: none; letter-spacing: 0; }
  .ac-input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; }
  .ac-preview { margin: 12px 0 2px; padding: 10px 12px; border-radius: 10px; color: var(--ink); background: var(--accent-soft); font: 600 12px/1.55 var(--sans); }

  .ac-pickwrap { display: flex; flex-direction: column; gap: 5px; color: var(--ink-dim); font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .ac-pick { position: relative; }
  .ac-pick > summary { list-style: none; cursor: pointer; min-width: 240px; }
  .ac-pick > summary::-webkit-details-marker { display: none; }
  .ac-pick > summary::after { content: "\25BE"; float: right; margin-left: 10px; color: var(--ink-dim); }
  .ac-pick[open] > summary::after { content: "\25B4"; }
  .ac-pickpanel { position: absolute; z-index: 20; left: 0; top: calc(100% + 4px); width: min(440px, 88vw); padding: 10px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface-strong); box-shadow: 0 12px 32px rgba(0,0,0,.22); text-transform: none; letter-spacing: 0; }
  .ac-pickpanel .ac-input { width: 100%; min-width: 0; box-sizing: border-box; }
  .ac-picktools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 4px; }
  .ac-picktools span { margin-left: auto; color: var(--ink-dim); font: 600 11px var(--mono); }
  .ac-picklist { max-height: 260px; overflow: auto; margin-top: 4px; border-top: 1px solid var(--line); }
  .ac-pickitem { display: flex; gap: 9px; align-items: flex-start; padding: 7px 4px; border-bottom: 1px solid var(--line); color: var(--ink); font: 600 13px/1.35 var(--sans); cursor: pointer; }
  .ac-pickitem input { margin-top: 3px; accent-color: var(--accent); }
  .ac-pickitem small { display: block; color: var(--ink-dim); font: 400 11px var(--mono); }
  .ac-pickitem[hidden] { display: none; }
  .ac-pickpanel .ac-input + .ac-input { margin-top: 6px; }
  .ac-group-h { display: flex; align-items: center; gap: 10px; margin: 26px 0 2px; padding: 9px 12px; border-radius: 10px; color: var(--accent); background: var(--accent-soft); font: 800 13px var(--sans); letter-spacing: -.01em; }
  .ac-gives { margin: 0 0 10px; padding-left: 18px; color: var(--ink); font: 600 13px/1.7 var(--sans); }
  .ac-group-h:first-of-type { margin-top: 10px; }
  .ac-group-h .ac-count { margin-left: auto; }

  .ac-count { margin-left: 8px; color: var(--ink-dim); font: 600 11px var(--mono); }
  .ac-hint { margin: 0; padding: 8px 0; color: var(--ink-dim); font: 12px var(--sans); }
  .ac-mono { font-family: var(--mono); }
  @media (max-width: 640px) { .ac-fields { grid-template-columns: 1fr; } .ac-input { min-width: 0; width: 100%; } .ac-row label { width: 100%; } }
</style>

<body>

<div class="dash-shell">
  <div class="dash-topbar">
    <a class="dash-back" href="master.html">&larr; Master dashboard</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span>
    </button>
  </div>

  <div id="authgate" style="margin-top:20px;"></div>
  <div id="dashboard" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var key = "master-dashboard-theme";
  var root = document.documentElement;
  var button = document.getElementById("themeToggle");
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  var theme = saved === "dark" || saved === "light" ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function apply(next) {
    theme = next;
    root.setAttribute("data-theme", next);
    if (!button) return;
    var dark = next === "dark";
    button.setAttribute("aria-pressed", String(dark));
    button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    button.querySelector(".theme-toggle-icon").textContent = dark ? "☀" : "☾";
    button.querySelector(".theme-toggle-label").textContent = dark ? "Light mode" : "Dark mode";
  }
  apply(theme);
  if (button) button.addEventListener("click", function () {
    var next = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(key, next); } catch (e) {}
    apply(next);
  });
})();
</script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  "use strict";

  var SLOT_LABEL = { lesson: "Lesson video", quiz: "Quiz solution video", assignment: "Assignment solution video" };
  var TERMS = [["30", "30 days"], ["60", "60 days"], ["90", "90 days"], ["120", "120 days"], ["180", "180 days"], ["365", "365 days"], ["until", "Until a date\u2026"], ["never", "Never expires"]];

  var STATE = {
    session: null,
    data: null,
    tab: null,
    open: null,                 // which inline panel is open: "<kind>:<id>"
    toast: null,                // { ok: true|false, text }
    filters: { access: { q: "", status: "active" }, history: { q: "", status: "all" }, quizAdd: { track: "", q: "", year: "" }, lessons: { track: "", q: "", year: "" }, grant: { year: "" }, groupScope: { year: "" } },
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "value") node.value = attrs[k];
      else if (k === "checked") node.checked = !!attrs[k];
      else if (k === "disabled") node.disabled = !!attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "object" && typeof c.nodeType === "number" ? c : document.createTextNode(String(c)));
    });
    return node;
  }

  function api(payload) {
    if (!window.AuthEngine || typeof window.AuthEngine.adminCall !== "function") {
      return Promise.reject(new Error("This page needs the newest assets/auth.js \u2014 run \u201cSync site assets\u201d in the Quiz Maker."));
    }
    return window.AuthEngine.adminCall(STATE.session, payload);
  }

  // ---- words -----------------------------------------------------------------------------------

  function pretty(path) {
    var last = String(path || "").split("/").pop() || String(path || "");
    var s = last.replace(/[-_]+/g, " ").trim();
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : path;
  }
  // Grade subscriptions: "<grade folder>#ch3" (chapter 3) / "#t1" (term 1), see subscription-plan.md.
  var SUB_SCOPE_RE = /^programming\/baccalaureate\/grade-(\d+)-secondary#(ch|t)(\d+)$/;
  function subScope(scope) {
    var m = SUB_SCOPE_RE.exec(String(scope || ""));
    return m ? { grade: m[1], kind: m[2], n: m[3], base: String(scope).slice(0, String(scope).indexOf("#")) } : null;
  }
  function scopeInfo(scope) {
    var sub = subScope(scope);
    if (sub) return { title: "Grade " + sub.grade + " - " + (sub.kind === "ch" ? "Chapter " : "Term ") + sub.n, sub: scope };
    if (scope === "*") return { title: "Every lesson on the site", sub: "*" };
    if (/\/\*$/.test(scope)) return { title: "All lessons in \u201c" + pretty(scope.slice(0, -2)) + "\u201d", sub: scope };
    return { title: pretty(scope), sub: scope };
  }
  function scopeCovers(scope, lesson) {
    if (!scope) return false;
    if (scope === "*" || scope === lesson) return true;
    // "#ch"/"#t" subscription scopes are decided server-side from the lesson tags; this copy only
    // feeds the "already has access" hint, so it deliberately treats them as not covering.
    return scope.slice(-2) === "/*" && lesson.indexOf(scope.slice(0, -1)) === 0;
  }
  function parentOf(path) {
    var i = String(path).lastIndexOf("/");
    return i > 0 ? path.slice(0, i) : "";
  }

  // ---- year (Senior 1 / Senior 2) -------------------------------------------------------------
  // A lesson belongs to a year when it sits under a ".../grade-N-secondary/..." folder (the same
  // rule the master dashboard uses). Anything else (English, Math, "other") is not year-specific.
  var YEAR_LABELS = { "1": "Senior 1", "2": "Senior 2" };
  function yearOf(path) {
    var m = /(?:^|\/)grade-(\d+)-secondary(?:\/|#|$)/.exec(String(path || ""));
    return m ? (YEAR_LABELS[m[1]] || "Grade " + m[1]) : "";
  }
  function orderedYears(years) {
    return years.slice().sort(function (a, b) {
      if (a === b) return 0;
      if (!a) return 1;
      if (!b) return -1;
      return a < b ? -1 : 1;
    });
  }
  // filter: "" = all years | "Senior 1" | "Senior 2" | "__none__" = lessons not tied to a year
  function yearPass(filter, path) {
    if (!filter) return true;
    var y = yearOf(path);
    return filter === "__none__" ? !y : y === filter;
  }
  function lessonYearSelect(current) {
    var s = el("select", { class: "ac-input", "aria-label": "Filter by year", "data-year-filter": "" }, [
      el("option", { value: "" }, ["All years"]),
      el("option", { value: "Senior 1" }, ["Senior 1"]),
      el("option", { value: "Senior 2" }, ["Senior 2"]),
      el("option", { value: "__none__" }, ["Not year-specific"]),
    ]);
    s.value = current || "";
    return s;
  }
  function sortLessonsByYear(list) {
    var seen = {};
    list.forEach(function (l) { seen[yearOf(l.lesson)] = 1; });
    return orderedYears(Object.keys(seen)).reduce(function (acc, y) {
      return acc.concat(list.filter(function (l) { return yearOf(l.lesson) === y; }));
    }, []);
  }
  // <optgroup>s of lesson <option>s, one group per year.
  function lessonOptionGroups(list) {
    var by = {};
    list.forEach(function (l) { var y = yearOf(l.lesson); (by[y] = by[y] || []).push(l); });
    return orderedYears(Object.keys(by)).map(function (y) {
      return el("optgroup", { label: (y || "Other lessons") + " (" + by[y].length + ")" }, by[y].map(function (l) {
        return el("option", { value: l.lesson }, [pretty(l.lesson) + "  (" + l.lesson + ")"]);
      }));
    });
  }
  // Everything a "what does this cover" dropdown offers, narrowed to one year if asked.
  // opts: { lessonsOnly, custom, placeholder }
  function scopeOptionNodes(d, yearFilter, opts) {
    opts = opts || {};
    var all = allLessonsList(d);
    var nodes = [el("option", { value: "" }, [opts.placeholder || "Choose\u2026"])];
    lessonOptionGroups(all.filter(function (l) { return yearPass(yearFilter, l.lesson); })).forEach(function (g) { nodes.push(g); });
    if (!opts.lessonsOnly) {
      var folders = {};
      all.forEach(function (l) { var p = parentOf(l.lesson); if (p && yearPass(yearFilter, p)) folders[p] = 1; });
      var fk = Object.keys(folders).sort();
      if (fk.length) nodes.push(el("optgroup", { label: "A whole folder" }, fk.map(function (f) {
        return el("option", { value: f + "/*" }, ["All lessons in " + pretty(f) + (yearOf(f) ? " \u00b7 " + yearOf(f) : "") + "  (" + f + "/*)"]);
      })));
      if (!yearFilter) nodes.push(el("optgroup", { label: "Everything" }, [el("option", { value: "*" }, ["Every lesson on the site"])]));
    }
    if (opts.custom) nodes.push(el("optgroup", { label: "Other" }, [el("option", { value: "__custom" }, ["Type a path\u2026"])]));
    return nodes;
  }
  // Swap a <select>'s options in place (keeps the rest of the form as the teacher left it).
  function refillSelect(sel, nodes) {
    var keep = sel.value;
    sel.innerHTML = "";
    nodes.forEach(function (n) { sel.appendChild(n); });
    sel.value = keep;
    if (sel.value !== keep) sel.value = "";
  }

  // The real "every lesson on the site" list (from GitHub), falling back to whatever
  // the Videos/Quizzes sheets happen to know about if GITHUB_REPO isn't set yet or the
  // GitHub read failed for this load — so the dashboard degrades instead of breaking.
  function allLessonsList(d) {
    if (d.all_lessons && d.all_lessons.length) return d.all_lessons;
    var seen = {}, out = [];
    (d.videos || []).forEach(function (v) { if (!seen[v.lesson]) { seen[v.lesson] = 1; out.push({ lesson: v.lesson, track: v.lesson.split("/")[0] }); } });
    (d.quizzes || []).forEach(function (q) { if (!seen[q.lesson]) { seen[q.lesson] = 1; out.push({ lesson: q.lesson, track: q.lesson.split("/")[0] }); } });
    return out.sort(function (a, b) { return a.lesson < b.lesson ? -1 : 1; });
  }
  function allTracksList(d) {
    if (d.tracks && d.tracks.length) return d.tracks;
    var seen = {};
    allLessonsList(d).forEach(function (l) { seen[l.track] = 1; });
    return Object.keys(seen).sort();
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function addDays(ymd, n) {
    var p = ymd.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2);
  }
  function dash(v) { return v === "" || v === null || v === undefined ? "\u2014" : v; }

  function untilText(a) {
    if (a.state === "invalid") return { main: "Unreadable end date", sub: "\u201c" + a.expires_at + "\u201d \u2014 this row gives no access until the date is fixed" };
    if (a.expires_at === "") return { main: "Never expires", sub: "no end date" };
    if (a.days_left === null) return { main: a.expires_at, sub: "" };
    if (a.days_left > 0) return { main: a.expires_at, sub: plural(a.days_left, "day") + " left" };
    if (a.days_left === 0) return { main: a.expires_at, sub: "last day is today" };
    return { main: a.expires_at, sub: "ended " + plural(-a.days_left, "day") + " ago" };
  }
  function accessBadge(a) {
    if (a.state === "cancelled") return { text: "Cancelled", cls: "is-bad" };
    if (a.state === "invalid") return { text: "Fix date", cls: "is-warn" };
    if (a.state === "expired") return { text: "Expired", cls: "" };
    if (a.days_left !== null && a.days_left <= 7) return { text: "Ends soon", cls: "is-warn" };
    return { text: "Active", cls: "is-good" };
  }
  function payBadge(status) {
    if (status === "pending") return { text: "Waiting", cls: "is-warn" };
    if (status === "approved") return { text: "Approved", cls: "is-good" };
    if (status === "rejected") return { text: "Rejected", cls: "is-bad" };
    if (status === "revoked") return { text: "Revoked", cls: "is-bad" };
    return { text: status || "?", cls: "" };
  }
  function badge(b) { return el("span", { class: "ac-badge " + b.cls }, [b.text]); }

  function whoBlock(name, phone, known) {
    return el("div", { class: "ac-who" }, [
      el("b", {}, [name || "Unknown student"]),
      el("span", {}, [phone + (known === false ? "  \u00b7  no account with this number yet" : "")]),
    ]);
  }
  function field(label, main, sub) {
    return el("dl", { class: "ac-field" }, [el("dt", {}, [label]), el("dd", {}, [main, sub ? el("small", {}, [sub]) : null])]);
  }

  // ---- talking to the server -------------------------------------------------------------------

  function setToast(ok, text) { STATE.toast = { ok: ok, text: text }; }

  // Puts the current message (or none) at the top without rebuilding the page, so a form the
  // teacher is filling in keeps what they chose when something fails.
  function refreshToast() {
    var old = document.querySelector("#dashboard .ac-toast");
    if (old) old.remove();
    var t = toastNode();
    var head = document.querySelector("#dashboard .dash-head");
    if (t && head) head.insertAdjacentElement("afterend", t);
  }

  function run(payload, okText, btn) {
    STATE.toast = null;
    refreshToast();
    return api(payload).then(
      function (res) {
        setToast(true, typeof okText === "function" ? okText(res) : okText);
        STATE.open = null;
        return load(true);
      },
      function (err) {
        setToast(false, (err && err.message) || "That didn't work.");
        refreshToast();
        if (btn) btn.disabled = false;
      }
    );
  }

  // Same as run(), for an action that needs several calls (e.g. open a lesson AND the videos
  // that were locked on their own). Stops at the first failure; whatever already went through
  // stays done, and the refresh below shows the real state.
  function runMany(payloads, okText, btn) {
    STATE.toast = null;
    refreshToast();
    return payloads.reduce(function (chain, p) {
      return chain.then(function () { return api(p); });
    }, Promise.resolve()).then(
      function () {
        setToast(true, okText);
        STATE.open = null;
        return load(true);
      },
      function (err) {
        setToast(false, (err && err.message) || "That didn't work.");
        refreshToast();
        if (btn) btn.disabled = false;
        return load(true);
      }
    );
  }

  function load(quiet) {
    if (!quiet) renderLoading();
    return api({ action: "admin_access_overview" }).then(
      function (data) {
        STATE.data = data;
        if (!STATE.tab) STATE.tab = data.counts.pending > 0 ? "requests" : "access";
        render();
      },
      function (err) {
        var msg = (err && err.message) || "Couldn't load the access dashboard. Try refreshing.";
        if (msg === "Not authorized.") msg = "This account is signed in, but doesn't have admin access. Set is_admin = TRUE on this row in the Students sheet to use this dashboard.";
        renderError(msg);
      }
    );
  }

  // ---- shared pieces -----------------------------------------------------------------------------

  function termControls(idPrefix, onChange, defaultTerm) {
    var select = el("select", { class: "ac-input", id: idPrefix + "-term", "aria-label": "How long" },
      TERMS.map(function (t) { return el("option", { value: t[0] }, [t[1]]); }));
    select.value = defaultTerm || "30";
    var until = el("input", { class: "ac-input", type: "date", id: idPrefix + "-until", "aria-label": "End date" });
    var untilLabel = el("label", { hidden: "" }, ["End date", until]);
    function sync() { untilLabel.hidden = select.value !== "until"; onChange(); }
    select.addEventListener("change", sync);
    until.addEventListener("input", onChange);
    return {
      node: el("div", { class: "ac-row" }, [el("label", {}, ["Access lasts", select]), untilLabel]),
      term: function () {
        if (select.value === "never") return { never: true };
        if (select.value === "until") return until.value ? { expires_at: until.value } : null;
        return { days: Number(select.value) };
      },
      describe: function (today, base) {
        if (select.value === "never") return "with no end date";
        if (select.value === "until") return until.value ? "until " + until.value : "(pick an end date)";
        var start = base && base > today ? base : today;
        return "until " + addDays(start, Number(select.value)) + (base && base > today ? " (added to the end date they already have)" : "");
      },
    };
  }

  function toastNode() {
    if (!STATE.toast) return null;
    return el("div", { class: "ac-toast " + (STATE.toast.ok ? "is-ok" : "is-err"), role: "status", "aria-live": "polite" }, [STATE.toast.text]);
  }

      var calls = [{ action: "admin_set_lesson_lock", lesson: lesson, locked: locked }];
      var alsoVideos = !locked && alsoBox && alsoBox.checked;
      if (alsoVideos) ownLocked.forEach(function (v) { calls.push({ action: "admin_set_video", lesson: lesson, slot: v.slot, locked: false }); });
      runMany(calls, pretty(lesson) + " is now " + (locked ? "locked." : "open.") + (alsoVideos ? " Its videos are open too." : ""), btn);
    }
    goLock.addEventListener("click", function () { fire(true, goLock); });
    goOpen.addEventListener("click", function () { fire(false, goOpen); });
    box.appendChild(el("p", {}, [note]));
    if (alsoRow) box.appendChild(el("p", {}, [alsoRow]));
    box.appendChild(el("div", { class: "ac-actions" }, isNew ? [goOpen, goLock, cancelBtn()] : [goLock, goOpen, cancelBtn()]));
    return box;
  }

  // One video's own lock (the Videos row's "locked" cell). This is the switch that was missing:
  // videos are born locked, and the lesson-level switch above can never open one of them.
  function videoLockPanel(lesson, v, lessonLocked) {
    var label = SLOT_LABEL[v.slot] || v.slot;
    var box = el("div", { class: "ac-panel", "data-panel": "video-lock" });
    var note = v.locked
      ? "Opening the " + label.toLowerCase() + " lets everyone watch it." + (lessonLocked ? " The lesson itself is still locked, so it stays closed until you open the lesson too." : "")
      : "Locking the " + label.toLowerCase() + " closes just this video. Students need approved access to watch it.";
    var go = el("button", { class: "ac-btn " + (v.locked ? "primary" : "danger solid"), type: "button" }, [v.locked ? "Open it" : "Lock it"]);
    go.addEventListener("click", function () {
      go.disabled = true;
      run({ action: "admin_set_video", lesson: lesson, slot: v.slot, locked: !v.locked },
        "The " + label.toLowerCase() + " for " + pretty(lesson) + " is now " + (v.locked ? "open." : "locked."), go);
    });
    box.appendChild(el("p", {}, [note]));
    box.appendChild(el("div", { class: "ac-actions" }, [go, cancelBtn()]));
    return box;
  }

  function lessonsPanel(d) {
    var lockByLesson = {};
    (d.lesson_locks || []).forEach(function (l) { lockByLesson[l.lesson] = l; });
    var quizByLesson = {};
    d.quizzes.forEach(function (q) { quizByLesson[q.lesson] = q; });
    var videosByLesson = {};
    d.videos.forEach(function (v) { (videosByLesson[v.lesson] = videosByLesson[v.lesson] || []).push(v); });

    var f = STATE.filters.lessons;
    var all0 = allLessonsList(d);
    var tracks = allTracksList(d);
    var trackSel = el("select", { class: "ac-input", "aria-label": "Filter by track" },
      [el("option", { value: "" }, ["All tracks"])].concat(tracks.map(function (t) { return el("option", { value: t }, [pretty(t)]); })));
    trackSel.value = f.track;
    var search = el("input", { class: "ac-input", type: "text", placeholder: "Filter by name or path\u2026", "aria-label": "Filter lessons", "data-search": "lessons", value: f.q });
    var yearSel = lessonYearSelect(f.year);
    trackSel.addEventListener("change", function () { f.track = trackSel.value; render(); });
    yearSel.addEventListener("change", function () { f.year = yearSel.value; render(); });
    search.addEventListener("input", function () {
      f.q = search.value;
      var pos = search.selectionStart;
      render();
      var again = document.querySelector('[data-search="lessons"]');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    });

    var all = sortLessonsByYear(all0.filter(function (l) {
      if (f.track && l.track !== f.track) return false;
      if (!yearPass(f.year, l.lesson)) return false;
      var q = f.q.trim().toLowerCase();
      if (q && l.lesson.indexOf(q) === -1 && pretty(l.lesson).toLowerCase().indexOf(q) === -1) return false;
      return true;
    }));

    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Lessons", el("span", { class: "ac-count" }, [String(d.counts.lessons_locked) + " locked of " + all0.length])]),
      el("p", { class: "dash-section-note" }, [d.lessons_error
        ? "Couldn't read the full lesson list from GitHub (" + d.lessons_error + ") \u2014 showing only lessons already known here."
        : "Locking a lesson closes every video in it, whether or not a video exists yet. The quiz gate on each card is separate and overrides this \u2014 a quiz can stay locked while its lesson is open, or open while its lesson is locked."]),
      el("div", { class: "ac-row" }, [el("label", {}, ["Track", trackSel]), el("label", {}, ["Year", yearSel]), el("label", {}, ["Search", search])]),
    ]);

    if (!all.length) {
      section.appendChild(el("div", { class: "dash-empty" }, [all0.length ? "Nothing matches this filter." : "No lessons found."]));
      return section;
    }

    // With more than one year on screen, split the list under Senior 1 / Senior 2 / Other headings.
    var yearCounts = {}, lastYear = null;
    all.forEach(function (l) { var y = yearOf(l.lesson); yearCounts[y] = (yearCounts[y] || 0) + 1; });
    var showGroups = Object.keys(yearCounts).length > 1;

    all.forEach(function (l) {
      var ly = yearOf(l.lesson);
      if (showGroups && ly !== lastYear) {
        section.appendChild(el("h3", { class: "ac-group-h", "data-year-group": ly || "other" }, [ly || "Other lessons (not tied to a year)", el("span", { class: "ac-count" }, [plural(yearCounts[ly], "lesson")])]));
      }
      lastYear = ly;
      var lock = lockByLesson[l.lesson];
      var locked = !!(lock && lock.locked);
      var quiz = quizByLesson[l.lesson];
      var quizLocked = !!(quiz && quiz.locked);
      var vids = (videosByLesson[l.lesson] || []).slice().sort(function (a, b) { return a.slot < b.slot ? -1 : 1; });
      var key = "lsn:" + l.lesson;
      var qkey = "qz:" + l.lesson;

      var card = el("div", { class: "ac-card", "data-lesson": l.lesson }, [
        el("div", { class: "ac-top" }, [
          el("div", { class: "ac-who" }, [el("b", {}, [pretty(l.lesson)]), el("span", {}, [l.lesson])]),
          badge(locked ? { text: "Lesson locked", cls: "is-good" } : { text: "Lesson open", cls: "is-warn" }),
        ]),
      ]);

      var fields = vids.length
        ? vids.map(function (v) {
            var effLocked = v.locked || locked;
            var why = v.locked ? (locked ? "" : " (locked on its own \u2014 the lesson being open doesn't open it)") : (locked ? " (via lesson lock)" : "");
            return field(SLOT_LABEL[v.slot] || v.slot, effLocked ? "Locked" + why : "Open to everyone");
          })
        : [field("Videos", "None yet", "added from the Quiz Maker \u2014 locking the lesson now means one added later starts locked too")];
      fields.push(field("Quiz gate", quiz ? (quizLocked ? "Locked" : "Open") : "No gate (open)", "separate \u2014 overrides the lesson lock for the quiz itself"));
      card.appendChild(el("div", { class: "ac-fields" }, fields));

      var lockToggle = el("button", { class: "ac-btn " + (locked ? "" : "primary"), type: "button" }, [lock ? (locked ? "Open it\u2026" : "Lock it\u2026") : "Lock this lesson\u2026"]);
      lockToggle.addEventListener("click", function () { openPanel(key); });
      var quizToggle = el("button", { class: "ac-btn " + (quizLocked ? "" : "danger"), type: "button" }, [quiz ? (quizLocked ? "Open the quiz\u2026" : "Lock the quiz\u2026") : "Gate this quiz\u2026"]);
      quizToggle.addEventListener("click", function () { openPanel(qkey); });

      var ownLocked = vids.filter(function (v) { return v.locked; });
      var videoToggles = vids.map(function (v) {
        var b = el("button", { class: "ac-btn " + (v.locked ? "primary" : ""), type: "button", "data-video-toggle": v.slot }, [(v.locked ? "Open " : "Lock ") + (SLOT_LABEL[v.slot] || v.slot).toLowerCase() + "\u2026"]);
        b.addEventListener("click", function () { openPanel("vid:" + l.lesson + ":" + v.slot); });
        return b;
      });
      var openVideo = vids.filter(function (v) { return STATE.open === "vid:" + l.lesson + ":" + v.slot; })[0];

      if (STATE.open === key) card.appendChild(lessonLockPanel(l.lesson, !lock, ownLocked));
      else if (STATE.open === qkey) card.appendChild(quizLockPanel(l.lesson, !quiz));
      else if (openVideo) card.appendChild(videoLockPanel(l.lesson, openVideo, locked));
      else card.appendChild(el("div", { class: "ac-actions" }, [lockToggle, quizToggle].concat(videoToggles)));

      section.appendChild(card);
    });
    return section;
  }

  // ---- GIVE ACCESS ------------------------------------------------------------------------------------

  function grantPanel(d) {
    var gy = STATE.filters.grant;
    var grantOpts = { custom: true };
    var phone = el("input", { class: "ac-input", type: "tel", id: "gr-phone", placeholder: "01xxxxxxxxx", "aria-label": "Student phone", autocomplete: "off" });
    var scopeSel = el("select", { class: "ac-input", id: "gr-scope", "aria-label": "What it covers" }, scopeOptionNodes(d, gy.year, grantOpts));
    var yearSel = lessonYearSelect(gy.year);
    yearSel.id = "gr-year";
    yearSel.addEventListener("change", function () {
      gy.year = yearSel.value;
      refillSelect(scopeSel, scopeOptionNodes(d, gy.year, grantOpts));
      update();
    });
    var custom = el("input", { class: "ac-input", type: "text", id: "gr-custom", placeholder: "programming/other/some-lesson", "aria-label": "Lesson path", hidden: "" });
    var preview = el("div", { class: "ac-preview", "aria-live": "polite" });
    var term;
    function scopeValue() { return scopeSel.value === "__custom" ? custom.value.trim() : scopeSel.value; }
    function update() {
      custom.hidden = scopeSel.value !== "__custom";
      var t = term.term(), s = scopeValue();
      preview.textContent = phone.value.trim() && s ? phone.value.trim() + " will be able to watch " + scopeInfo(s).title + " " + term.describe(d.today, "") + "." : "Fill in the phone number and what it covers.";
      go.disabled = !(phone.value.trim() && s && t);
    }
    term = termControls("gr", update, "30");
    var go = el("button", { class: "ac-btn primary", type: "button", "data-do": "grant" }, ["Give access"]);
    go.addEventListener("click", function () {
      var t = term.term();
      if (!t) return;
      go.disabled = true;
      STATE.toast = null;
      refreshToast();
      api(Object.assign({ action: "admin_grant_access", phone: phone.value.trim(), scope: scopeValue() }, t)).then(
        function (r) {
          setToast(true, (r.known_student ? r.name + " (" + r.phone + ")" : r.phone + " \u2014 no account with this number yet; it will apply when they register") +
            " now has " + scopeInfo(r.scope).title + (r.expires_at ? " until " + r.expires_at : " with no end date") + ".");
          return load(true);
        },
        function (err) { setToast(false, (err && err.message) || "That didn't work."); refreshToast(); go.disabled = false; }
      );
    });
    [phone, scopeSel, custom].forEach(function (n) { n.addEventListener("input", update); n.addEventListener("change", update); });
    update();
    return el("div", { class: "dash-section" }, [
      el("h2", {}, ["Give access by hand"]),
      el("p", { class: "dash-section-note" }, ["For a cash payment, a scholarship, or fixing a mistake \u2014 no request needed. Works for a number that hasn't registered yet."]),
      el("div", { class: "ac-row" }, [el("label", {}, ["Student's phone", phone]), el("label", {}, ["Year", yearSel]), el("label", {}, ["What it covers", scopeSel, custom])]),
      term.node, preview, el("div", { class: "ac-actions" }, [go]),
    ]);
  }

  // ---- page ------------------------------------------------------------------------------------------

  function render() {
    var root = document.getElementById("dashboard");
    var y = window.scrollY;
    var d = STATE.data;
    root.innerHTML = "";
    root.hidden = false;
    var c = d.counts;
    var people = {};
    d.access.forEach(function (a) { if (a.state === "active") people[a.phone.replace(/\D/g, "").slice(-10)] = 1; });
    root.appendChild(el("div", { class: "dash-head" }, [el("div", {}, [
      el("h1", {}, ["Lesson access"]),
      el("p", {}, ["Who can get into which lessons, the payments behind it, and how to take access away. Today is " + d.today + " (Cairo)."]),
    ])]));
    var t = toastNode();
    if (t) root.appendChild(t);
    root.appendChild(helpBlock());
    root.appendChild(el("div", { class: "dash-stats" }, [
      statCard(c.pending, "requests waiting for you"),
      statCard(Object.keys(people).length, "students with active access"),
      statCard(c.ending_soon, "ending within 7 days"),
      statCard(c.lessons_locked, "lessons locked"),
      statCard(c.videos_locked + " / " + c.videos_open, "videos locked / open"),
      statCard(c.quizzes_locked, "quizzes currently locked"),
      statCard(c.groups, "groups"),
    ]));
    root.appendChild(tabsNode(d));
    var panel = STATE.tab === "requests" ? requestsPanel(d)
      : STATE.tab === "access" ? accessPanel(d)
      : STATE.tab === "history" ? historyPanel(d)
      : STATE.tab === "lessons" ? lessonsPanel(d)
      : STATE.tab === "quizzes" ? quizzesPanel(d)
      : STATE.tab === "groups" ? groupsPanel(d)
      : grantPanel(d);
    root.appendChild(panel);
    window.scrollTo(0, y);
  }

  function renderError(message) {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-err" }, [message]));
  }

  function renderNeedsRelogin() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    var btn = el("button", { class: "qz-next", type: "button" }, ["Log out & sign in again \u2192"]);
    btn.addEventListener("click", function () { window.AuthEngine.clearSession(); location.reload(); });
    root.appendChild(el("div", { class: "dash-err" }, ["Your saved sign-in is missing a session token. Log in again to refresh it (phone and password stay the same)."]));
    root.appendChild(btn);
  }

  function renderLoading() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-loading-state", role: "status", "aria-live": "polite" }, [
      el("div", { class: "dash-loading-card" }, [
        el("div", { class: "dash-loading-art", "aria-hidden": "true" }, [el("span", { class: "dash-loading-ring" }), el("span", { class: "dash-loading-core" })]),
        el("div", { class: "dash-loading-copy" }, [
          el("h1", { class: "dash-loading-title" }, ["Loading lesson access"]),
          el("p", { class: "dash-loading-note" }, ["Reading payments, access and lessons", el("span", { class: "dash-loading-dots", "aria-hidden": "true" }, [el("i"), el("i"), el("i")])]),
        ]),
      ]),
    ]));
  }

  window.AuthEngine.mount("#authgate", function (session) {
    document.getElementById("authgate").remove();
    if (!session.session_token) { renderNeedsRelogin(); return; }
    // Convenience only: the server re-checks is_admin on every call.
    if (session.is_admin === false) { location.href = "student.html"; return; }
    STATE.session = session;
    load(false);
  });
})();
</script>

</body>
</html>
