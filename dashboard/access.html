   ========================================================================== */
html[data-theme] {
  --mx-bg: #f5f4f0;
  --mx-surface: #ffffff;
  --mx-surface-2: #faf9f6;
  --mx-line: #e7e4dc;
  --mx-line-strong: #d6d2c7;
  --mx-ink: #15171c;
  --mx-ink-2: #3b3f47;
  --mx-muted: #737781;
  --mx-accent: #2b54e0;
  --mx-accent-soft: #e9eefe;
  --mx-accent-ink: #ffffff;
  --mx-good: #17804f;
  --mx-good-soft: #e5f4ec;
  --mx-mid: #a3670d;
  --mx-mid-soft: #fbf1df;
  --mx-low: #c03a17;
  --mx-low-soft: #fceae4;
  --mx-shadow: 0 1px 2px rgba(20, 22, 28, .04), 0 2px 8px rgba(20, 22, 28, .04);
  --mx-shadow-lg: 0 10px 30px -12px rgba(20, 22, 28, .18);
  --mx-r: 14px;
  --mx-r-sm: 10px;
  --mx-font: "Manrope", "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mx-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
html[data-theme="dark"] {
  --mx-bg: #0d0f12;
  --mx-surface: #15181d;
  --mx-surface-2: #1a1e24;
  --mx-line: #252a32;
  --mx-line-strong: #323844;
  --mx-ink: #eceef1;
  --mx-ink-2: #c4c8cf;
  --mx-muted: #8b919c;
  --mx-accent: #7d9bff;
  --mx-accent-soft: rgba(125, 155, 255, .14);
  --mx-accent-ink: #0d0f12;
  --mx-good: #4fcf8e;
  --mx-good-soft: rgba(79, 207, 142, .13);
  --mx-mid: #f0b44c;
  --mx-mid-soft: rgba(240, 180, 76, .13);
  --mx-low: #ff7a59;
  --mx-low-soft: rgba(255, 122, 89, .13);
  --mx-shadow: 0 1px 0 rgba(255, 255, 255, .02) inset, 0 1px 2px rgba(0, 0, 0, .3);
  --mx-shadow-lg: 0 16px 40px -16px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

html[data-theme] body {
  background: var(--mx-bg);
  color: var(--mx-ink);
  font-family: var(--mx-font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
html[data-theme] ::selection { background: var(--mx-accent-soft); color: var(--mx-ink); }
html[data-theme] :focus-visible {
  outline: 2px solid var(--mx-accent);
  outline-offset: 2px;
  border-radius: 8px;
}

/* ---- Top bar -------------------------------------------------------------- */
html[data-theme] .d-bar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--mx-bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--mx-line);
  box-shadow: none;
}
html[data-theme] .d-bar-in {
  max-width: var(--d-w); margin: 0 auto;
  display: flex; align-items: center; gap: 20px;
  padding: 12px 24px; min-height: 60px;
}
html[data-theme] .d-brand {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--mx-ink); text-decoration: none;
  font-weight: 800; font-size: 15px; letter-spacing: -.01em; white-space: nowrap;
}
html[data-theme] .d-brand-mark {
  display: inline-grid; place-items: center;
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--mx-ink); color: var(--mx-bg);
  box-shadow: none;
}
html[data-theme] .d-brand-mark svg { width: 18px; height: 18px; }
html[data-theme] .d-brand small {
  font-family: var(--mx-mono); font-size: 10.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--mx-muted);
  border: 1px solid var(--mx-line-strong); border-radius: 999px;
  padding: 2px 8px; margin-left: 2px;
  background: transparent;
}
html[data-theme] .d-nav {
  display: flex; align-items: center; gap: 2px;
  padding: 4px; border-radius: 12px;
  background: var(--mx-surface); border: 1px solid var(--mx-line);
  overflow-x: auto; scrollbar-width: none;
}
html[data-theme] .d-nav::-webkit-scrollbar { display: none; }
html[data-theme] .d-nav a {
  color: var(--mx-muted); text-decoration: none;
  font-size: 13.5px; font-weight: 600; white-space: nowrap;
  padding: 7px 12px; border-radius: 8px;
  transition: color .15s, background-color .15s;
  background: transparent; border: 0;
}
html[data-theme] .d-nav a:hover { color: var(--mx-ink); background: var(--mx-surface-2); }
html[data-theme] .d-nav a[aria-current="page"] {
  color: var(--mx-ink); background: var(--mx-bg);
  box-shadow: inset 0 0 0 1px var(--mx-line-strong);
}
html[data-theme] .d-nav a[lang="ar"] { font-family: "Cairo", var(--mx-font); }
html[data-theme] .d-spacer { flex: 1 1 auto; }
html[data-theme] .theme-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: 10px;
  background: var(--mx-surface); color: var(--mx-ink-2);
  border: 1px solid var(--mx-line); box-shadow: none;
  font: 600 13px/1 var(--mx-font); cursor: pointer;
  transition: border-color .15s, color .15s;
}
html[data-theme] .theme-toggle:hover { border-color: var(--mx-line-strong); color: var(--mx-ink); }
html[data-theme] .theme-toggle-icon { display: inline-flex; }

/* ---- Shell & header ------------------------------------------------------- */
html[data-theme] .dash-shell {
  max-width: var(--d-w); margin: 0 auto;
  padding: 36px 24px 96px;
}
html[data-theme] .dash-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  margin: 0 0 24px; padding: 0 0 24px;
  border-bottom: 1px solid var(--mx-line);
}
html[data-theme] .dash-head h1 {
  margin: 0; color: var(--mx-ink);
  font-family: var(--mx-font); font-weight: 800;
  font-size: clamp(28px, 4vw, 40px); line-height: 1.05; letter-spacing: -.03em;
}
html[data-theme] .dash-head p {
  margin: 10px 0 0; color: var(--mx-muted);
  font-size: 15px; line-height: 1.55; max-width: 60ch;
}

/* ---- Year tabs (segmented control) --------------------------------------- */
html[data-theme] .dash-tabs {
  display: inline-flex; flex-wrap: wrap; gap: 4px;
  padding: 4px; margin: 0 0 20px;
  background: var(--mx-surface); border: 1px solid var(--mx-line);
  border-radius: 12px; box-shadow: var(--mx-shadow);
}
html[data-theme] .dash-tab {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 8px; border: 0;
  background: transparent; color: var(--mx-muted);
  font: 600 13.5px/1 var(--mx-font); cursor: pointer;
  transition: background-color .15s, color .15s;
}
html[data-theme] .dash-tab:hover { color: var(--mx-ink); background: var(--mx-surface-2); }
html[data-theme] .dash-tab small {
  font-family: var(--mx-mono); font-size: 11px; font-weight: 500;
  min-width: 22px; padding: 3px 6px; border-radius: 6px; text-align: center;
  background: var(--mx-surface-2); color: var(--mx-muted);
  border: 1px solid var(--mx-line);
}
html[data-theme] .dash-tab.is-active { background: var(--mx-ink); color: var(--mx-bg); }
html[data-theme] .dash-tab.is-active small {
  background: color-mix(in srgb, var(--mx-bg) 16%, transparent);
  border-color: transparent; color: var(--mx-bg);
}

/* ---- KPI stats ------------------------------------------------------------ */
html[data-theme] .dash-stats {
  display: grid; gap: 0;
  grid-template-columns: repeat(var(--d-kpis), minmax(0, 1fr));
  background: var(--mx-surface); border: 1px solid var(--mx-line);
  border-radius: var(--mx-r); box-shadow: var(--mx-shadow);
  overflow: hidden; margin: 0 0 16px;
}
html[data-theme] .dash-stat {
  display: flex; flex-direction: column; gap: 6px;
  padding: 20px 22px; background: transparent; border: 0; border-radius: 0;
  box-shadow: none; min-width: 0;
}
html[data-theme] .dash-stat + .dash-stat { border-left: 1px solid var(--mx-line); }
html[data-theme] .dash-stat span {
  font-family: var(--mx-mono); font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em; color: var(--mx-muted);
}
html[data-theme] .dash-stat b {
  font-family: var(--mx-font); font-weight: 800; color: var(--mx-ink);
  font-size: clamp(26px, 3.2vw, 34px); line-height: 1.05; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
html[data-theme] .dash-stat b.is-good { color: var(--mx-good); }
html[data-theme] .dash-stat b.is-low { color: var(--mx-low); }
html[data-theme] .dash-stat em { font-style: normal; font-size: 12.5px; color: var(--mx-muted); }
@media (max-width: 760px) {
  html[data-theme] .dash-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  html[data-theme] .dash-stat + .dash-stat { border-left: 0; }
  html[data-theme] .dash-stat:nth-child(even) { border-left: 1px solid var(--mx-line); }
  html[data-theme] .dash-stat:nth-child(n+3) { border-top: 1px solid var(--mx-line); }
}

/* ---- Notes / errors / empty ---------------------------------------------- */
html[data-theme] .dash-note {
  margin: 0 0 20px; padding: 12px 16px 12px 40px; position: relative;
  border-radius: var(--mx-r-sm); font-size: 13px; line-height: 1.55;
  background: var(--mx-mid-soft); color: var(--mx-ink-2);
  border: 1px solid color-mix(in srgb, var(--mx-mid) 28%, transparent);
}
html[data-theme] .dash-note::before {
  content: ""; position: absolute; left: 16px; top: 16px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--mx-mid);
}
html[data-theme] .dash-err {
  margin: 0 0 16px; padding: 16px 18px; border-radius: var(--mx-r);
  background: var(--mx-low-soft); color: var(--mx-ink);
  border: 1px solid color-mix(in srgb, var(--mx-low) 30%, transparent);
  font-size: 14px; line-height: 1.6;
}
html[data-theme] .dash-empty {
  padding: 28px 20px; text-align: center;
  border: 1px dashed var(--mx-line-strong); border-radius: var(--mx-r-sm);
  color: var(--mx-muted); font-size: 14px; background: var(--mx-surface-2);
}

/* ---- Sections ------------------------------------------------------------- */
html[data-theme] .dash-section {
  margin: 0 0 20px; padding: 22px;
  background: var(--mx-surface); border: 1px solid var(--mx-line);
  border-radius: var(--mx-r); box-shadow: var(--mx-shadow);
  scroll-margin-top: 130px;
}
html[data-theme] .d-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; }
html[data-theme] .d-sec-head h2 {
  display: inline-flex; align-items: center; gap: 10px; margin: 0;
  font-family: var(--mx-font); font-weight: 800; color: var(--mx-ink);
  font-size: 18px; letter-spacing: -.02em; line-height: 1.2;
}
html[data-theme] .d-count {
  font-family: var(--mx-mono); font-size: 11.5px; font-weight: 500;
  padding: 3px 8px; border-radius: 999px;
  background: var(--mx-surface-2); color: var(--mx-muted);
  border: 1px solid var(--mx-line);
}
html[data-theme] .dash-section-note {
  margin: 6px 0 16px; color: var(--mx-muted); font-size: 13.5px; line-height: 1.55; max-width: 72ch;
}

/* Roster is a <details> */
html[data-theme] details.rv-roster > summary {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  list-style: none; cursor: pointer; margin: -4px; padding: 4px; border-radius: 10px;
}
html[data-theme] details.rv-roster > summary::-webkit-details-marker { display: none; }
html[data-theme] details.rv-roster > summary::marker { content: ""; }
html[data-theme] .rv-caret {
  width: 30px; height: 30px; flex: none; border-radius: 8px;
  border: 1px solid var(--mx-line); background: var(--mx-surface-2);
  display: inline-grid; place-items: center; position: relative;
}
html[data-theme] .rv-caret::before {
  content: ""; width: 7px; height: 7px;
  border-right: 2px solid var(--mx-muted); border-bottom: 2px solid var(--mx-muted);
  transform: translateY(-2px) rotate(45deg); transition: transform .2s;
}
html[data-theme] details.rv-roster[open] .rv-caret::before { transform: translateY(2px) rotate(-135deg); }
html[data-theme] details.rv-roster:not([open]) .dash-section-note { display: none; }
html[data-theme] details.rv-roster[open] > summary { margin-bottom: 0; }

/* ---- Filters -------------------------------------------------------------- */
html[data-theme] .dash-filters {
  display: grid; gap: 12px; align-items: end;
  grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.6fr) auto;
  margin: 0 0 20px; padding: 16px;
  background: var(--mx-surface); border: 1px solid var(--mx-line);
  border-radius: var(--mx-r); box-shadow: var(--mx-shadow);
}
html[data-theme] .dash-filters label {
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  font-family: var(--mx-mono); font-size: 10.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em; color: var(--mx-muted);
}
html[data-theme] .dash-select,
html[data-theme] .dash-search {
  width: 100%; height: 40px; padding: 0 12px; box-sizing: border-box;
  background: var(--mx-surface-2); color: var(--mx-ink);
  border: 1px solid var(--mx-line); border-radius: 10px;
  font: 500 14px/1 var(--mx-font); text-transform: none; letter-spacing: 0;
  box-shadow: none; transition: border-color .15s, box-shadow .15s, background-color .15s;
}
html[data-theme] .dash-select {
  -webkit-appearance: none; appearance: none; padding-right: 34px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--mx-muted) 50%), linear-gradient(135deg, var(--mx-muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
html[data-theme] .dash-search::placeholder { color: var(--mx-muted); opacity: .8; }
html[data-theme] .dash-select:hover,
html[data-theme] .dash-search:hover { border-color: var(--mx-line-strong); }
html[data-theme] .dash-select:focus,
html[data-theme] .dash-search:focus {
  outline: none; border-color: var(--mx-accent); background-color: var(--mx-surface);
  box-shadow: 0 0 0 3px var(--mx-accent-soft);
}
html[data-theme] .dash-clear {
  height: 40px; padding: 0 16px; border-radius: 10px; cursor: pointer; white-space: nowrap;
  background: transparent; color: var(--mx-ink-2);
  border: 1px solid var(--mx-line-strong); font: 600 13.5px/1 var(--mx-font);
  transition: background-color .15s, color .15s, border-color .15s;
}
html[data-theme] .dash-clear:hover { background: var(--mx-ink); color: var(--mx-bg); border-color: var(--mx-ink); }
@media (max-width: 900px) {
  html[data-theme] .dash-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  html[data-theme] .dash-filters label:nth-of-type(4) { grid-column: 1 / -1; }
  html[data-theme] .dash-clear { grid-column: 1 / -1; }
}

/* ---- Sticky jump nav ------------------------------------------------------ */
html[data-theme] .d-tabs-wrap {
  position: sticky; top: 61px; z-index: 30;
  margin: 0 -24px 20px; padding: 10px 24px;
  background: color-mix(in srgb, var(--mx-bg) 86%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--mx-line);
}
html[data-theme] .d-tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
}
html[data-theme] .d-tabs::-webkit-scrollbar { display: none; }
html[data-theme] .d-tabs a {
  flex: none; padding: 7px 12px; border-radius: 999px;
  color: var(--mx-muted); text-decoration: none; white-space: nowrap;
  font-size: 13px; font-weight: 600;
  border: 1px solid transparent; background: transparent;
  transition: color .15s, background-color .15s, border-color .15s;
}
html[data-theme] .d-tabs a:hover { color: var(--mx-ink); background: var(--mx-surface); border-color: var(--mx-line); }
html[data-theme] .d-tabs a.is-on {
  color: var(--mx-accent); background: var(--mx-accent-soft);
  border-color: color-mix(in srgb, var(--mx-accent) 25%, transparent);
}

/* ---- Lists & rows --------------------------------------------------------- */
html[data-theme] .d-list {
  display: flex; flex-direction: column; gap: 0;
  border: 1px solid var(--mx-line); border-radius: var(--mx-r-sm);
  overflow: hidden; background: var(--mx-surface);
}
html[data-theme] .d-scroll { max-height: 420px; overflow-y: auto; scrollbar-width: thin; }
html[data-theme] .d-list > * + * { border-top: 1px solid var(--mx-line); }
html[data-theme] .dash-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 16px; margin: 0;
  background: transparent; border: 0; border-radius: 0; box-shadow: none;
  transition: background-color .12s;
}
html[data-theme] .dash-row.is-clickable { cursor: pointer; }
html[data-theme] .dash-row.is-clickable:hover { background: var(--mx-surface-2); }
html[data-theme] .dash-row.is-selected {
  background: var(--mx-accent-soft);
  box-shadow: inset 3px 0 0 var(--mx-accent);
}
html[data-theme] .dash-row-main { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
html[data-theme] .dash-row-title {
  color: var(--mx-ink); font-weight: 700; font-size: 14.5px; line-height: 1.35;
  overflow-wrap: anywhere;
}
html[data-theme] .dash-row-sub { color: var(--mx-muted); font-size: 12.5px; line-height: 1.45; }
html[data-theme] .at-title { display: flex; align-items: center; gap: 8px; min-width: 0; }

html[data-theme] .at-trail {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
  color: var(--mx-muted); font-size: 12.5px; line-height: 1.4;
}
html[data-theme] .at-trail > i {
  width: 3px; height: 3px; border-radius: 50%; background: var(--mx-line-strong);
  display: inline-block; font-style: normal;
}

html[data-theme] .dash-badge {
  flex: none; display: inline-flex; align-items: center;
  height: 26px; padding: 0 10px; border-radius: 999px;
  font-family: var(--mx-mono); font-size: 11.5px; font-weight: 500; white-space: nowrap;
  color: var(--mx-ink-2); background: var(--mx-surface-2);
  border: 1px solid var(--mx-line);
}

html[data-theme] .dash-score {
  flex: none; display: inline-flex; flex-direction: column; align-items: flex-end; justify-content: center;
  min-width: 64px; padding: 6px 10px; border-radius: 10px;
  font-family: var(--mx-mono); font-weight: 600; font-size: 14px; line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--mx-ink); background: var(--mx-surface-2); border: 1px solid var(--mx-line);
}
html[data-theme] .dash-score small { font-size: 10.5px; font-weight: 500; opacity: .75; margin-top: 2px; }
html[data-theme] .dash-score.is-good { color: var(--mx-good); background: var(--mx-good-soft); border-color: transparent; }
html[data-theme] .dash-score.is-mid  { color: var(--mx-mid);  background: var(--mx-mid-soft);  border-color: transparent; }
html[data-theme] .dash-score.is-low  { color: var(--mx-low);  background: var(--mx-low-soft);  border-color: transparent; }

html[data-theme] .dash-rank {
  flex: none; width: 28px; height: 28px; border-radius: 8px;
  display: inline-grid; place-items: center;
  font-family: var(--mx-mono); font-size: 12px; font-weight: 600;
  color: var(--mx-muted); background: var(--mx-surface-2); border: 1px solid var(--mx-line);
}
html[data-theme] .d-list > .dash-row:nth-child(-n+3) .dash-rank {
  color: var(--mx-low); background: var(--mx-low-soft); border-color: transparent;
}
html[data-theme] .dash-missed-q { color: var(--mx-ink); font-weight: 600; font-size: 14px; line-height: 1.45; }

html[data-theme] .dash-sub-text {
  margin-top: 6px; padding: 10px 12px; border-radius: 8px;
  background: var(--mx-surface-2); border: 1px solid var(--mx-line);
  color: var(--mx-ink-2); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap;
}
html[data-theme] .dash-link {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px; border-radius: 8px;
  color: var(--mx-accent); background: var(--mx-accent-soft);
  font-size: 12.5px; font-weight: 700; text-decoration: none;
  transition: filter .15s;
}
html[data-theme] .dash-link::after { content: "\2197"; font-weight: 600; }
html[data-theme] .dash-link:hover { filter: brightness(.95); }

/* Expand toggle on attempt rows */
html[data-theme] .dash-toggle {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 600; color: var(--mx-muted); white-space: nowrap;
}
html[data-theme] .dash-toggle::after {
  content: ""; width: 6px; height: 6px;
  border-right: 1.75px solid currentColor; border-bottom: 1.75px solid currentColor;
  transform: translateY(-2px) rotate(45deg); transition: transform .2s;
}
html[data-theme] .dash-toggle.is-open { color: var(--mx-accent); }
html[data-theme] .dash-toggle.is-open::after { transform: translateY(1px) rotate(-135deg); }
html[data-theme] .dash-attempt { background: transparent; }
html[data-theme] .dash-row[aria-expanded="true"] { background: var(--mx-surface-2); }

/* Attempt detail */
html[data-theme] .dash-detail {
  padding: 4px 16px 16px; background: var(--mx-surface-2);
  border-top: 1px dashed var(--mx-line); display: flex; flex-direction: column; gap: 8px;
}
html[data-theme] .dash-detail-h {
  padding-top: 12px; font-family: var(--mx-mono); font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em; color: var(--mx-muted);
}
html[data-theme] .dash-q-group {
  margin-top: 6px; color: var(--mx-ink-2); font-size: 13px; font-weight: 700;
}
html[data-theme] .dash-ok-list { margin-top: 4px; }
html[data-theme] .dash-ok-list > summary {
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  color: var(--mx-good); font-size: 13px; font-weight: 700; padding: 6px 0;
}
html[data-theme] .dash-ok-list[open] > summary { margin-bottom: 6px; }

/* Bars (assignment completion) */
html[data-theme] .dash-chapter { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; }
html[data-theme] .dash-chapter-top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  color: var(--mx-muted); font-family: var(--mx-mono); font-size: 12px;
}
html[data-theme] .dash-chapter-top b {
  font-family: var(--mx-font); font-size: 14.5px; font-weight: 700; color: var(--mx-ink);
}
html[data-theme] .dash-bar {
  height: 6px; border-radius: 999px; overflow: hidden;
  background: var(--mx-line); border: 0;
}
html[data-theme] .dash-bar-fill {
  height: 100%; border-radius: inherit; background: var(--mx-mid);
  transition: width .5s cubic-bezier(.2, .7, .2, 1);
}
html[data-theme] .dash-bar-fill.is-good { background: var(--mx-good); }
html[data-theme] .dash-bar-fill.is-low { background: var(--mx-low); }

/* Pager */
html[data-theme] .dash-more {
  display: block; width: 100%; margin-top: 12px; height: 42px; cursor: pointer;
  border-radius: 10px; border: 1px dashed var(--mx-line-strong);
  background: transparent; color: var(--mx-ink-2);
  font: 600 13.5px/1 var(--mx-font);
  transition: background-color .15s, border-color .15s, color .15s;
}
html[data-theme] .dash-more:hover { background: var(--mx-surface-2); border-style: solid; color: var(--mx-ink); }
html[data-theme] .dash-more[hidden] { display: none; }

/* Primary button used by the re-login state */
html[data-theme] .qz-next {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 20px; border-radius: 10px; border: 0; cursor: pointer;
  background: var(--mx-ink); color: var(--mx-bg);
  font: 700 14px/1 var(--mx-font); box-shadow: var(--mx-shadow-lg);
  transition: transform .15s, filter .15s;
}
html[data-theme] .qz-next:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* ---- Loading state -------------------------------------------------------- */
html[data-theme] .dash-loading-state {
  min-height: 62vh; display: grid; place-items: center; padding: 24px 0;
}
html[data-theme] .dash-loading-card {
  width: min(100%, 440px); padding: 32px;
  display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;
  background: var(--mx-surface); border: 1px solid var(--mx-line);
  border-radius: 18px; box-shadow: var(--mx-shadow-lg);
}
html[data-theme] .dash-loading-art { position: relative; width: 56px; height: 56px; }
html[data-theme] .dash-loading-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 3px solid var(--mx-line); border-top-color: var(--mx-accent);
  animation: mx-spin 0.9s linear infinite;
}
html[data-theme] .dash-loading-core {
  position: absolute; inset: 18px; border-radius: 50%; background: var(--mx-accent);
  animation: mx-pulse 1.4s ease-in-out infinite;
}
html[data-theme] .dash-loading-copy { display: flex; flex-direction: column; gap: 6px; }
html[data-theme] .dash-loading-title {
  margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; color: var(--mx-ink);
}
html[data-theme] .dash-loading-note { margin: 0; font-size: 13.5px; color: var(--mx-muted); }
html[data-theme] .dash-loading-dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
html[data-theme] .dash-loading-dots i {
  width: 4px; height: 4px; border-radius: 50%; background: currentColor;
  animation: mx-dot 1.2s ease-in-out infinite;
}
html[data-theme] .dash-loading-dots i:nth-child(2) { animation-delay: .15s; }
html[data-theme] .dash-loading-dots i:nth-child(3) { animation-delay: .3s; }
html[data-theme] .dash-loading-meter { width: 100%; display: flex; flex-direction: column; gap: 8px; }
html[data-theme] .dash-loading-meter-label {
  display: flex; justify-content: space-between;
  font-family: var(--mx-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--mx-muted);
}
html[data-theme] .dash-loadbar { height: 4px; border-radius: 999px; overflow: hidden; background: var(--mx-line); }
html[data-theme] .dash-loadbar-fill {
  height: 100%; width: 40%; border-radius: inherit; background: var(--mx-accent);
  animation: mx-slide 1.4s cubic-bezier(.4, 0, .2, 1) infinite;
}
@keyframes mx-spin { to { transform: rotate(360deg); } }
@keyframes mx-pulse { 0%, 100% { transform: scale(.85); opacity: .7; } 50% { transform: scale(1); opacity: 1; } }
@keyframes mx-dot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes mx-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---- Small screens -------------------------------------------------------- */
@media (max-width: 640px) {
  html[data-theme] .d-bar-in { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
  html[data-theme] .d-nav { order: 3; width: 100%; }
  html[data-theme] .d-spacer { display: none; }
  html[data-theme] .theme-toggle { margin-left: auto; }
  html[data-theme] .theme-toggle-label { display: none; }
  html[data-theme] .theme-toggle { width: 36px; padding: 0; justify-content: center; }
  html[data-theme] .dash-shell { padding: 24px 16px 72px; }
  html[data-theme] .dash-section { padding: 16px; }
  html[data-theme] .d-tabs-wrap { top: 106px; margin: 0 -16px 16px; padding: 8px 16px; }
  html[data-theme] .dash-filters { grid-template-columns: 1fr; }
  html[data-theme] .dash-filters label:nth-of-type(4) { grid-column: auto; }
  html[data-theme] .dash-row { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  html[data-theme] *, html[data-theme] *::before, html[data-theme] *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important;
  }
}

/* ==========================================================================
   Video access page: re-map the page's own tokens onto the shared palette so
   every existing .ac-* rule picks up the new look, then refine components.
   ========================================================================== */
html[data-theme] {
  --surface: var(--mx-surface);
  --surface-strong: var(--mx-surface);
  --surface-soft: var(--mx-surface-2);
  --ink: var(--mx-ink);
  --ink-dim: var(--mx-muted);
  --line: var(--mx-line);
  --line-strong: var(--mx-line-strong);
  --accent: var(--mx-accent);
  --accent-2: var(--mx-accent);
  --accent-soft: var(--mx-accent-soft);
  --good: var(--mx-good);
  --low: var(--mx-low);
  --warn: var(--mx-mid);
  --shadow-soft: var(--mx-shadow);
  --sans: var(--mx-font);
  --mono: var(--mx-mono);
}

/* Stats: 6 KPIs -> 3 columns on mid widths */
@media (min-width: 761px) and (max-width: 1040px) {
  html[data-theme] .dash-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  html[data-theme] .dash-stat + .dash-stat { border-left: 0; }
  html[data-theme] .dash-stat:not(:nth-child(3n+1)) { border-left: 1px solid var(--mx-line); }
  html[data-theme] .dash-stat:nth-child(n+4) { border-top: 1px solid var(--mx-line); }
}

/* Sections: padding lives on the card now, so drop the per-child gutters */
html[data-theme] #dashboard .dash-section { padding: 22px; }
html[data-theme] #dashboard .dash-section > *:not(h2):not(.dash-section-note):not(.dash-empty) { margin-left: 0; margin-right: 0; }
html[data-theme] #dashboard .dash-section > h2 {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 0 4px; padding: 0; border: 0; background: transparent;
  font: 800 18px/1.25 var(--mx-font); letter-spacing: -.02em; color: var(--mx-ink);
}
html[data-theme] .ac-count {
  display: inline-flex; align-items: center; margin-left: 0;
  padding: 3px 8px; border-radius: 999px;
  background: var(--mx-surface-2); color: var(--mx-muted);
  border: 1px solid var(--mx-line);
  font: 500 11.5px/1.2 var(--mx-mono); letter-spacing: 0;
}
html[data-theme] #dashboard .dash-section-note { margin: 4px 0 18px; }
html[data-theme] #dashboard .dash-section > .dash-empty { margin: 8px 0 0; }

/* Section tabs */
html[data-theme] .ac-tabs { margin-bottom: 20px; max-width: 100%; }

/* Filters bar */
html[data-theme] .dash-filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px;
  grid-template-columns: none; padding: 14px;
  background: var(--mx-surface-2); box-shadow: none; margin: 0 0 18px;
}
html[data-theme] .dash-filters > label { flex: 1 1 200px; }
html[data-theme] .dash-filters > label:first-child { flex: 2 1 260px; }
html[data-theme] .dash-filters .dash-select,
html[data-theme] .dash-filters .dash-search { background-color: var(--mx-surface); }
html[data-theme] .ac-fgroup {
  font: 500 10.5px var(--mx-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--mx-muted);
}

/* Segmented controls (year bar, group-by) */
html[data-theme] .ac-seg {
  gap: 4px; padding: 4px; border-radius: 12px;
  background: var(--mx-surface); border: 1px solid var(--mx-line); box-shadow: var(--mx-shadow);
}
html[data-theme] .dash-filters .ac-seg { box-shadow: none; padding: 3px; }
html[data-theme] .ac-seg-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px; padding: 8px 14px;
  color: var(--mx-muted); font: 600 13px/1 var(--mx-font);
  transition: background-color .15s, color .15s;
}
html[data-theme] .dash-filters .ac-seg-btn { padding: 7px 12px; font-size: 12.5px; }
html[data-theme] .ac-seg-btn:hover { color: var(--mx-ink); background: var(--mx-surface-2); }
html[data-theme] .ac-seg-btn.is-active { color: var(--mx-bg); background: var(--mx-ink); box-shadow: none; }
html[data-theme] .ac-seg-btn small { font: 500 10.5px var(--mx-mono); padding: 2px 6px; }
html[data-theme] .ac-yearbar { margin: 0 0 18px; }

/* Help disclosure */
html[data-theme] .ac-help {
  margin: 0 0 20px; padding: 0 18px;
  border: 1px solid var(--mx-line); border-radius: var(--mx-r);
  background: var(--mx-surface); box-shadow: var(--mx-shadow);
}
html[data-theme] .ac-help summary {
  display: flex; align-items: center; gap: 10px; padding: 14px 0;
  list-style: none; font: 700 13.5px var(--mx-font); color: var(--mx-ink);
}
html[data-theme] .ac-help summary::-webkit-details-marker { display: none; }
html[data-theme] .ac-help summary::before {
  content: "?"; display: inline-grid; place-items: center; flex: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--mx-accent-soft); color: var(--mx-accent);
  font: 700 12px/1 var(--mx-mono);
}
html[data-theme] .ac-help ul { margin: 0 0 16px; padding-left: 20px; font: 13px/1.75 var(--mx-font); color: var(--mx-ink-2); }
html[data-theme] .ac-help li::marker { color: var(--mx-line-strong); }

/* Toast */
html[data-theme] .ac-toast {
  top: 72px; z-index: 35; display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--mx-line); background: var(--mx-surface); color: var(--mx-ink);
  box-shadow: var(--mx-shadow-lg); font: 600 13px/1.5 var(--mx-font);
}
html[data-theme] .ac-toast::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mx-muted); }
html[data-theme] .ac-toast.is-ok { color: var(--mx-ink); border-color: color-mix(in srgb, var(--mx-good) 35%, transparent); background: var(--mx-good-soft); }
html[data-theme] .ac-toast.is-ok::before { background: var(--mx-good); }
html[data-theme] .ac-toast.is-err { color: var(--mx-ink); border-color: color-mix(in srgb, var(--mx-low) 35%, transparent); background: var(--mx-low-soft); }
html[data-theme] .ac-toast.is-err::before { background: var(--mx-low); }

/* Badges and chips */
html[data-theme] .ac-badge,
html[data-theme] .ac-chip {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px; border: 1px solid var(--mx-line);
  background: var(--mx-surface-2); color: var(--mx-ink-2);
  font: 500 11px/1.2 var(--mx-mono); letter-spacing: .02em;
}
html[data-theme] .ac-badge { padding: 5px 10px; text-transform: uppercase; }
html[data-theme] .ac-chip { padding: 6px 11px; }
html[data-theme] .ac-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; }
html[data-theme] .ac-badge.is-good, html[data-theme] .ac-chip.is-good { color: var(--mx-good); background: var(--mx-good-soft); border-color: transparent; }
html[data-theme] .ac-badge.is-warn, html[data-theme] .ac-chip.is-warn { color: var(--mx-mid);  background: var(--mx-mid-soft);  border-color: transparent; }
html[data-theme] .ac-badge.is-bad,  html[data-theme] .ac-chip.is-bad  { color: var(--mx-low);  background: var(--mx-low-soft);  border-color: transparent; }
html[data-theme] .ac-badge.is-good::before, html[data-theme] .ac-badge.is-warn::before, html[data-theme] .ac-badge.is-bad::before { opacity: 1; }

/* Cards */
html[data-theme] .ac-card {
  margin: 0 0 12px; padding: 18px 20px;
  border: 1px solid var(--mx-line); border-radius: var(--mx-r);
  background: var(--mx-surface); transition: border-color .15s;
}
html[data-theme] .ac-card:hover { border-color: var(--mx-line-strong); }
html[data-theme] .ac-who b { font: 800 15px/1.3 var(--mx-font); letter-spacing: -.01em; color: var(--mx-ink); }
html[data-theme] .ac-who span { margin-top: 4px; font: 400 11.5px var(--mx-mono); color: var(--mx-muted); }
html[data-theme] .ac-fields { gap: 14px 22px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--mx-line); }
html[data-theme] .ac-field dt { font: 500 10.5px var(--mx-mono); letter-spacing: .08em; color: var(--mx-muted); }
html[data-theme] .ac-field dd { margin-top: 5px; font: 600 13.5px/1.45 var(--mx-font); color: var(--mx-ink); }
html[data-theme] .ac-field dd small { font: 400 11.5px/1.5 var(--mx-mono); color: var(--mx-muted); }
html[data-theme] .ac-note {
  padding: 11px 14px; border: 1px solid color-mix(in srgb, var(--mx-mid) 28%, transparent);
  border-left: 3px solid var(--mx-mid); border-radius: 10px;
  background: var(--mx-mid-soft); color: var(--mx-ink-2); font: 13px/1.6 var(--mx-font);
}

/* Buttons */
html[data-theme] .ac-actions { gap: 8px; margin-top: 16px; }
html[data-theme] .ac-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 0 14px; border-radius: 9px;
  border: 1px solid var(--mx-line-strong); background: var(--mx-surface); color: var(--mx-ink-2);
  font: 600 12.5px/1 var(--mx-font); white-space: nowrap; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s, filter .15s;
}
html[data-theme] .ac-btn:hover { border-color: var(--mx-ink); color: var(--mx-ink); background: var(--mx-surface-2); }
html[data-theme] .ac-btn.primary,
html[data-theme] .ac-btn.primary:hover { color: var(--mx-bg); background: var(--mx-ink); border-color: var(--mx-ink); }
html[data-theme] .ac-btn.primary:hover { filter: brightness(1.15); }
html[data-theme] .ac-btn.danger { color: var(--mx-low); border-color: color-mix(in srgb, var(--mx-low) 40%, var(--mx-line)); background: transparent; }
html[data-theme] .ac-btn.danger:hover { background: var(--mx-low-soft); border-color: var(--mx-low); }
html[data-theme] .ac-btn.danger.solid,
html[data-theme] .ac-btn.danger.solid:hover { color: #fff; background: var(--mx-low); border-color: var(--mx-low); }
html[data-theme="dark"] .ac-btn.danger.solid,
html[data-theme="dark"] .ac-btn.danger.solid:hover { color: var(--mx-bg); }
html[data-theme] .ac-btn[disabled],
html[data-theme] .ac-btn[disabled]:hover { opacity: .5; cursor: not-allowed; filter: none; }
html[data-theme] .ac-line-actions .ac-btn { min-height: 30px; padding: 0 11px; font-size: 12px; }

/* Inline panels and form controls */
html[data-theme] .ac-panel {
  margin-top: 16px; padding: 16px 18px;
  border: 1px solid var(--mx-line); border-radius: 12px; background: var(--mx-surface-2);
}
html[data-theme] .ac-panel > p { font: 13px/1.65 var(--mx-font); color: var(--mx-ink-2); }
html[data-theme] .ac-row label,
html[data-theme] .ac-form-row label,
html[data-theme] .ac-pickwrap,
html[data-theme] .ac-mh {
  font: 500 10.5px var(--mx-mono); letter-spacing: .08em; color: var(--mx-muted);
}
html[data-theme] .ac-input {
  min-height: 38px; padding: 8px 12px; box-sizing: border-box;
  border: 1px solid var(--mx-line); border-radius: 10px;
  background: var(--mx-surface); color: var(--mx-ink);
  font: 500 13.5px/1.35 var(--mx-font);
  transition: border-color .15s, box-shadow .15s;
}
html[data-theme] .ac-input:hover { border-color: var(--mx-line-strong); }
html[data-theme] .ac-input:focus { outline: none; border-color: var(--mx-accent); box-shadow: 0 0 0 3px var(--mx-accent-soft); }
html[data-theme] .ac-input::placeholder { color: var(--mx-muted); opacity: .8; }
html[data-theme] .ac-radio { padding: 10px 12px; margin: 6px 0; border: 1px solid var(--mx-line); border-radius: 10px; background: var(--mx-surface); font: 600 13.5px/1.4 var(--mx-font); transition: border-color .15s, background-color .15s; }
html[data-theme] .ac-radio:hover { border-color: var(--mx-line-strong); }
html[data-theme] .ac-radio:has(input:checked) { border-color: var(--mx-accent); background: var(--mx-accent-soft); }
html[data-theme] .ac-radio small { font: 400 11.5px var(--mx-mono); color: var(--mx-muted); }
html[data-theme] .ac-check { font: 500 13px/1.5 var(--mx-font); color: var(--mx-ink-2); }
html[data-theme] .ac-check input, html[data-theme] .ac-pickitem input { accent-color: var(--mx-accent); }
html[data-theme] .ac-preview {
  padding: 11px 14px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--mx-accent) 25%, transparent);
  background: var(--mx-accent-soft); color: var(--mx-ink); font: 600 13px/1.55 var(--mx-font);
}
html[data-theme] .ac-hint { font: 13px/1.5 var(--mx-font); color: var(--mx-muted); }

/* Multi-select picker */
html[data-theme] .ac-pick > summary.ac-input { display: flex; align-items: center; justify-content: space-between; }
html[data-theme] .ac-pick > summary::after { float: none; color: var(--mx-muted); font-size: 11px; }
html[data-theme] .ac-pickpanel {
  padding: 12px; border: 1px solid var(--mx-line); border-radius: 12px;
  background: var(--mx-surface); box-shadow: var(--mx-shadow-lg);
}
@media (max-width: 560px) {   /* the panel is anchored to its picker, which sits ~50px in from the edge: leave room so the page never scrolls sideways */
  html[data-theme] .ac-pickpanel { width: min(440px, calc(100vw - 72px)); }
}
html[data-theme] .ac-picktools span { font: 500 11px var(--mx-mono); color: var(--mx-muted); }
html[data-theme] .ac-picklist { border-top: 1px solid var(--mx-line); scrollbar-width: thin; }
html[data-theme] .ac-pickitem { padding: 9px 6px; border-radius: 6px; border-bottom: 1px solid var(--mx-line); font: 600 13px/1.35 var(--mx-font); transition: background-color .12s; }
html[data-theme] .ac-pickitem:hover { background: var(--mx-surface-2); }
html[data-theme] .ac-pickitem small { font: 400 11px var(--mx-mono); color: var(--mx-muted); }

/* Group headers */
html[data-theme] .ac-group-h {
  margin: 26px 0 10px; padding: 10px 14px; border-radius: 10px;
  background: var(--mx-accent-soft); color: var(--mx-accent); font: 800 13.5px var(--mx-font);
}
html[data-theme] .ac-group-h:first-of-type { margin-top: 8px; }
html[data-theme] .ac-sec-h {
  margin: 28px 0 12px; padding: 11px 16px; border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--sc) 22%, var(--mx-line));
  border-left: 4px solid var(--sc);
  background: color-mix(in srgb, var(--sc) 8%, var(--mx-surface));
  font: 800 14.5px var(--mx-font); letter-spacing: -.01em; color: var(--mx-ink);
}
html[data-theme] .ac-sec-h:first-of-type { margin-top: 8px; }
html[data-theme] .ac-sec-h em { font: 400 11.5px var(--mx-mono); font-style: normal; color: var(--mx-muted); }
html[data-theme] .ac-sec-h .ac-count, html[data-theme] .ac-group-h .ac-count { margin-left: auto; }
html[data-theme] .ac-gives { font: 600 13.5px/1.75 var(--mx-font); color: var(--mx-ink-2); }

/* Collapsible groups */
html[data-theme] .ac-grp {
  margin: 0 0 10px; border: 1px solid var(--mx-line); border-radius: var(--mx-r);
  background: var(--mx-surface); transition: border-color .15s;

<script>
(function () {
  "use strict";
  var key = "master-dashboard-theme";
  var ICON_MOON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.4A8.5 8.5 0 1 1 9.6 3.5a7 7 0 0 0 10.9 10.9Z"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>';
  var root = document.documentElement;
  var button = document.getElementById("themeToggle");
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  var theme = saved === "dark" || saved === "light" ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function apply(next) {
    theme = next;
    root.setAttribute("data-theme", next);
    if (!button) return;
    var dark = next === "dark";
    button.setAttribute("aria-pressed", String(dark));
    button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    button.querySelector(".theme-toggle-icon").innerHTML = dark ? ICON_SUN : ICON_MOON;
    button.querySelector(".theme-toggle-label").textContent = dark ? "Light mode" : "Dark mode";
  }
  apply(theme);
  if (button) button.addEventListener("click", function () {
    var next = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(key, next); } catch (e) {}
    apply(next);
  });
})();

<script src="/assets/auth.js"></script>
<script>
(function () {
  "use strict";

  var SLOT_LABEL = { lesson: "Lesson video", quiz: "Quiz solution video", assignment: "Assignment solution video" };
  var TERMS = [["30", "30 days"], ["60", "60 days"], ["90", "90 days"], ["120", "120 days"], ["180", "180 days"], ["365", "365 days"], ["until", "Until a date\u2026"], ["never", "Never expires"]];

  var STATE = {
    session: null,
    data: null,
    tab: null,
    year: "",                   // Senior 1 / Senior 2 filter shared by every tab: "" all | "Senior 1" | "Senior 2" | "__none__"
    view: { access: "lesson" }, // Who-has-access grouping: "lesson" | "person"
    collapsed: {},              // folded groups, by key
    open: null,                 // which inline panel is open: "<kind>:<id>"
    toast: null,                // { ok: true|false, text }
    filters: { access: { q: "", status: "active" }, history: { q: "", status: "all" }, quizAdd: { track: "", q: "", year: "" }, lessons: { track: "", q: "", year: "" }, grant: { year: "" }, groupScope: { year: "" } },
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "value") node.value = attrs[k];
      else if (k === "checked") node.checked = !!attrs[k];
      else if (k === "disabled") node.disabled = !!attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "object" && typeof c.nodeType === "number" ? c : document.createTextNode(String(c)));
    });
    return node;
  }

  function api(payload) {
    if (!window.AuthEngine || typeof window.AuthEngine.adminCall !== "function") {
      return Promise.reject(new Error("This page needs the newest assets/auth.js \u2014 run \u201cSync site assets\u201d in the Quiz Maker."));
    }
    return window.AuthEngine.adminCall(STATE.session, payload);
  }

  // ---- words -----------------------------------------------------------------------------------

  // Lesson folders come in three shapes: chapter-N-lesson-M-name, lesson-M-name and a bare name (the
  // site also has one "chaper-" typo). Every lesson is shown as "Chapter N · Lesson M — Name"; a numbered
  // lesson with no chapter in its folder takes the chapter of the nearest higher-numbered sibling.
  // Pin one by hand here if that guess is ever wrong: { "<full lesson path>": "2" }
  var CHAPTER_OVERRIDES = {};
  var LESSON_RE = /^(?:chap(?:t)?er-(\d+)-)?(?:lesson-(\d+)-)?(.+)$/i;
  function slugOf(p) { return String(p || "").split("/").pop(); }
  function sentence(t) { t = String(t).replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim(); t = t.replace(/\bai\b/gi, "AI"); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function lessonParts(path) {
    var m = LESSON_RE.exec(slugOf(path));
    var o = { chapter: (m && m[1]) || CHAPTER_OVERRIDES[path] || "", num: (m && m[2]) || "", name: sentence(m ? m[3] : slugOf(path)) };
    if (!o.chapter && o.num && STATE.data) {
      var parent = parentOf(path), best = null;
      allLessonsList(STATE.data).forEach(function (l) {
        if (parentOf(l.lesson) !== parent) return;
        var q = LESSON_RE.exec(slugOf(l.lesson));
        if (q && q[1] && q[2] && +q[2] > +o.num && (!best || +q[2] < best.n)) best = { n: +q[2], c: q[1] };
      });
      if (best) o.chapter = best.c;
    }
    return o;
  }
  function lessonShort(path) { var p = lessonParts(path); return (p.num ? "Lesson " + p.num + " \u2014 " : "") + p.name; }
  function pretty(path) { var p = lessonParts(path); return (p.chapter ? "Chapter " + p.chapter + " \u00b7 " : "") + (p.num ? "Lesson " + p.num + " \u2014 " : "") + p.name; }
  function cmpLessons(a, b) {
    var pa = lessonParts(a), pb = lessonParts(b), n = function (v) { return v === "" ? 1e9 : +v; };
    return (parentOf(a) < parentOf(b) ? -1 : parentOf(a) > parentOf(b) ? 1 : 0) || n(pa.chapter) - n(pb.chapter) || n(pa.num) - n(pb.num) || (pa.name < pb.name ? -1 : 1);
  }
  function byChapter(items, pathOf) {
    var m = {}, out = [];
    items.slice().sort(function (a, b) { return cmpLessons(pathOf(a), pathOf(b)); }).forEach(function (x) {
      var k = lessonParts(pathOf(x)).chapter;
      if (!m[k]) { m[k] = { title: k ? "Chapter " + k : "Standalone lessons", items: [] }; out.push(m[k]); }
      m[k].items.push(x);
    });
    return out;
  }
  function chapterHead(title, note) { return el("div", { class: "ac-ch" }, [el("b", {}, [title]), el("span", {}, [note])]); }
  // Grade subscriptions: "<grade folder>#ch3" (chapter 3) / "#t1" (term 1), see subscription-plan.md.
  var SUB_SCOPE_RE = /^programming\/baccalaureate\/grade-(\d+)-secondary#(ch|t)(\d+)$/;
  function subScope(scope) {
    var m = SUB_SCOPE_RE.exec(String(scope || ""));
    return m ? { grade: m[1], kind: m[2], n: m[3], base: String(scope).slice(0, String(scope).indexOf("#")) } : null;
  }
  function scopeInfo(scope) {
    var sub = subScope(scope);
    if (sub) return { title: "Grade " + sub.grade + " - " + (sub.kind === "ch" ? "Chapter " : "Term ") + sub.n, sub: scope };
    if (scope === "*") return { title: "Every lesson on the site", sub: "*" };
    if (/\/\*$/.test(scope)) return { title: "All lessons in \u201c" + pretty(scope.slice(0, -2)) + "\u201d", sub: scope };
    return { title: pretty(scope), sub: scope };
  }
  function scopeCovers(scope, lesson) {
    if (!scope) return false;
    if (scope === "*" || scope === lesson) return true;
    // "#ch"/"#t" subscription scopes are decided server-side from the lesson tags; this copy only
    // feeds the "already has access" hint, so it deliberately treats them as not covering.
    return scope.slice(-2) === "/*" && lesson.indexOf(scope.slice(0, -1)) === 0;
  }
  function parentOf(path) {
    var i = String(path).lastIndexOf("/");
    return i > 0 ? path.slice(0, i) : "";
  }

  // ---- year (Senior 1 / Senior 2) -------------------------------------------------------------
  // A lesson belongs to a year when it sits under a ".../grade-N-secondary/..." folder (the same
  // rule the master dashboard uses). Anything else (English, Math, "other") is not year-specific.
  var YEAR_LABELS = { "1": "Senior 1", "2": "Senior 2" };
  function yearOf(path) {
    var m = /(?:^|\/)grade-(\d+)-secondary(?:\/|#|$)/.exec(String(path || ""));
    return m ? (YEAR_LABELS[m[1]] || "Grade " + m[1]) : "";
  }
  function orderedYears(years) {
    return years.slice().sort(function (a, b) {
      if (a === b) return 0;
      if (!a) return 1;
      if (!b) return -1;
      return a < b ? -1 : 1;
    });
  }
  // filter: "" = all years | "Senior 1" | "Senior 2" | "__none__" = lessons not tied to a year
  function yearPass(filter, path) {
    if (!filter) return true;
    var y = yearOf(path);
    return filter === "__none__" ? !y : y === filter;
  }
  function lessonYearSelect(current) {
    var s = el("select", { class: "ac-input", "aria-label": "Filter by year", "data-year-filter": "" }, [
      el("option", { value: "" }, ["All years"]),
      el("option", { value: "Senior 1" }, ["Senior 1"]),
      el("option", { value: "Senior 2" }, ["Senior 2"]),
      el("option", { value: "__none__" }, ["Not year-specific"]),
    ]);
    s.value = current || "";
    return s;
  }
  function sortLessonsByYear(list) {
    var seen = {};
    list.forEach(function (l) { seen[yearOf(l.lesson)] = 1; });
    return orderedYears(Object.keys(seen)).reduce(function (acc, y) {
      return acc.concat(list.filter(function (l) { return yearOf(l.lesson) === y; }).sort(function (x, z) { return cmpLessons(x.lesson, z.lesson); }));
    }, []);
  }
  // <optgroup>s of lesson <option>s, one group per year.
  function lessonOptionGroups(list) {
    var by = {};
    list.forEach(function (l) { var y = yearOf(l.lesson); (by[y] = by[y] || []).push(l); });
    return orderedYears(Object.keys(by)).map(function (y) {
      by[y].sort(function (x, z) { return cmpLessons(x.lesson, z.lesson); });
      return el("optgroup", { label: (y || "Other lessons") + " (" + by[y].length + ")" }, by[y].map(function (l) {
        return el("option", { value: l.lesson }, [pretty(l.lesson) + "  (" + l.lesson + ")"]);
      }));
    });
  }
  // Everything a "what does this cover" dropdown offers, narrowed to one year if asked.
  // opts: { lessonsOnly, custom, placeholder }
  function scopeOptionNodes(d, yearFilter, opts) {
    opts = opts || {};
    var all = allLessonsList(d);
    var nodes = [el("option", { value: "" }, [opts.placeholder || "Choose\u2026"])];
    lessonOptionGroups(all.filter(function (l) { return yearPass(yearFilter, l.lesson); })).forEach(function (g) { nodes.push(g); });
    if (!opts.lessonsOnly) {
      var folders = {};
      all.forEach(function (l) { var p = parentOf(l.lesson); if (p && yearPass(yearFilter, p)) folders[p] = 1; });
      var fk = Object.keys(folders).sort();
      if (fk.length) nodes.push(el("optgroup", { label: "A whole folder" }, fk.map(function (f) {
        return el("option", { value: f + "/*" }, ["All lessons in " + pretty(f) + (yearOf(f) ? " \u00b7 " + yearOf(f) : "") + "  (" + f + "/*)"]);
      })));
      if (!yearFilter) nodes.push(el("optgroup", { label: "Everything" }, [el("option", { value: "*" }, ["Every lesson on the site"])]));
    }
    if (opts.custom) nodes.push(el("optgroup", { label: "Other" }, [el("option", { value: "__custom" }, ["Type a path\u2026"])]));
    return nodes;
  }
  // Swap a <select>'s options in place (keeps the rest of the form as the teacher left it).
  function refillSelect(sel, nodes) {
    var keep = sel.value;
    sel.innerHTML = "";
    nodes.forEach(function (n) { sel.appendChild(n); });
    sel.value = keep;
    if (sel.value !== keep) sel.value = "";
  }

  // The real "every lesson on the site" list (from GitHub), falling back to whatever
  // the Videos/Quizzes sheets happen to know about if GITHUB_REPO isn't set yet or the
  // GitHub read failed for this load — so the dashboard degrades instead of breaking.
  function allLessonsList(d) {
    if (d.all_lessons && d.all_lessons.length) return d.all_lessons;
    var seen = {}, out = [];
    (d.videos || []).forEach(function (v) { if (!seen[v.lesson]) { seen[v.lesson] = 1; out.push({ lesson: v.lesson, track: v.lesson.split("/")[0] }); } });
    (d.quizzes || []).forEach(function (q) { if (!seen[q.lesson]) { seen[q.lesson] = 1; out.push({ lesson: q.lesson, track: q.lesson.split("/")[0] }); } });
    return out.sort(function (a, b) { return cmpLessons(a.lesson, b.lesson); });
  }
  function allTracksList(d) {
    if (d.tracks && d.tracks.length) return d.tracks;
    var seen = {};
    allLessonsList(d).forEach(function (l) { seen[l.track] = 1; });
    return Object.keys(seen).sort();
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function addDays(ymd, n) {
    var p = ymd.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2);
  }
  function dash(v) { return v === "" || v === null || v === undefined ? "\u2014" : v; }

  function untilText(a) {
    if (a.state === "invalid") return { main: "Unreadable end date", sub: "\u201c" + a.expires_at + "\u201d \u2014 this row gives no access until the date is fixed" };
    if (a.expires_at === "") return { main: "Never expires", sub: "no end date" };
    if (a.days_left === null) return { main: a.expires_at, sub: "" };
    if (a.days_left > 0) return { main: a.expires_at, sub: plural(a.days_left, "day") + " left" };
    if (a.days_left === 0) return { main: a.expires_at, sub: "last day is today" };
    return { main: a.expires_at, sub: "ended " + plural(-a.days_left, "day") + " ago" };
  }
  function accessBadge(a) {
    if (a.state === "cancelled") return { text: "Cancelled", cls: "is-bad" };
    if (a.state === "invalid") return { text: "Fix date", cls: "is-warn" };
    if (a.state === "expired") return { text: "Expired", cls: "" };
    if (a.days_left !== null && a.days_left <= 7) return { text: "Ends soon", cls: "is-warn" };
    return { text: "Active", cls: "is-good" };
  }
  function payBadge(status) {
    if (status === "pending") return { text: "Waiting", cls: "is-warn" };
    if (status === "approved") return { text: "Approved", cls: "is-good" };
    if (status === "rejected") return { text: "Rejected", cls: "is-bad" };
    if (status === "revoked") return { text: "Revoked", cls: "is-bad" };
    return { text: status || "?", cls: "" };
  }
  function badge(b) { return el("span", { class: "ac-badge " + b.cls }, [b.text]); }

  function whoBlock(name, phone, known) {
    return el("div", { class: "ac-who" }, [
      el("b", {}, [name || "Unknown student"]),
      el("span", {}, [phone + (known === false ? "  \u00b7  no account with this number yet" : "")]),
    ]);
  }
  function field(label, main, sub) {
    return el("dl", { class: "ac-field" }, [el("dt", {}, [label]), el("dd", {}, [main, sub ? el("small", {}, [sub]) : null])]);
  }

  // ---- sections: Senior 1 / Senior 2 / wide access / other -----------------------------------------
  var SECTION_ORDER = ["Senior 1", "Senior 2", "Wide access", "Other lessons"];
  var SECTION_NOTE = { "Wide access": "a whole folder or the whole site, so it covers several years", "Other lessons": "not tied to Senior 1 or Senior 2" };
  function isWide(scope) { return scope === "*" || /\/\*$/.test(String(scope || "")); }
  function sectionOf(path) { return yearOf(path) || (isWide(path) ? "Wide access" : "Other lessons"); }
  // Which sections a wide scope actually reaches (so a "*" grant shows up under Senior 1 AND Senior 2 when filtering).
  function coveredSections(d, scope) {

    opts = opts || {};

        [box, el("span", {}, [o.name || "No name", el("small", {}, [o.phone + (o.sub ? "  \u00b7  " + o.sub : "")])])]);
      box.addEventListener("change", function () { if (box.checked) chosen[o.phone] = 1; else delete chosen[o.phone]; refresh(); });
      return { row: row, box: box, phone: o.phone, year: o.year || "" };

    function refresh() {

    var yearKeys = Object.keys(yc).sort();

    none.addEventListener("click", function () { rows.forEach(function (r) { r.box.checked = false; }); chosen = {}; refresh(); });

      : [el("p", { class: "ac-hint" }, [opts.empty || "No students to show."])]);

  function lessonLockPanel(lesson, isNew, ownLocked) {
    ownLocked = ownLocked || [];
    var box = el("div", { class: "ac-panel", "data-panel": "lesson-lock" });
    var note = isNew
      ? "This lesson has no lock yet. Locking it closes every video in it \u2014 existing, or added later from the Quiz Maker \u2014 until you open it. The quiz gate is separate and untouched either way."
      : "Locking closes every video in this lesson at once, including ones you never toggled on their own (those stay closed regardless). Opening lets everyone in, unless a video was locked on its own \u2014 that one stays locked. The quiz gate below is separate and untouched either way.";
    var goLock = el("button", { class: "ac-btn danger solid", type: "button" }, [isNew ? "Add lock, start closed" : "Lock it"]);
    var goOpen = el("button", { class: "ac-btn primary", type: "button" }, [isNew ? "Add row, start open" : "Open it"]);
    // A video can be locked on its own, and opening the lesson does NOT open it. Say so here and
    // let the teacher open those videos in the same click (ticked by default: that is what
    // "open this lesson" almost always means).
    var alsoBox = null, alsoRow = null;
    if (ownLocked.length) {
      alsoBox = el("input", { type: "checkbox", id: "lsn-also-open" });
      alsoBox.checked = true;   // el() drops empty attributes, so set the property
      alsoRow = el("label", { class: "ac-check", for: "lsn-also-open" }, [alsoBox, el("span", {}, ["Also open the " + (ownLocked.length === 1 ? "video" : ownLocked.length + " videos") + " locked on their own: " + ownLocked.map(function (v) { return (SLOT_LABEL[v.slot] || v.slot).toLowerCase(); }).join(", ")])]);
    }
    function fire(locked, btn) {
      btn.disabled = true;
      var calls = [{ action: "admin_set_lesson_lock", lesson: lesson, locked: locked }];
      var alsoVideos = !locked && alsoBox && alsoBox.checked;
      if (alsoVideos) ownLocked.forEach(function (v) { calls.push({ action: "admin_set_video", lesson: lesson, slot: v.slot, locked: false }); });
      runMany(calls, pretty(lesson) + " is now " + (locked ? "locked." : "open.") + (alsoVideos ? " Its videos are open too." : ""), btn);

  function bulkResultNode() {
    var b = BULK.result;
    if (!b) return null;
    var r = b.res, bad = r.failed || [], grantLike = b.mode === "grant";
    var kids = [el("b", {}, [(grantLike ? "Last grant: " : "Last revoke: ") + r.applied + " applied, " + r.skipped + " skipped" + (bad.length ? ", " + bad.length + " failed" : "") + "."])];
    if (bad.length) kids.push(el("ul", { class: "bad" }, bad.map(function (f) { return el("li", {}, [f.target + (f.lesson ? " · " + f.lesson : "") + " — " + f.error]); })));
    if (!grantLike && r.revoked && r.revoked.length) {
      kids.push(el("p", { style: "margin:8px 0 2px" }, ["Taken away (" + r.revoked.length + "):"]));
      kids.push(el("ul", {}, r.revoked.slice(0, 200).map(function (x) { return el("li", {}, [x.phone + " · " + pretty(x.lesson) + (x.expires_at ? " (was until " + x.expires_at + ")" : " (had no end date)")]); })));
      var undo = el("button", { class: "ac-btn", type: "button", "data-bulk": "undo" }, ["Give these back"]);
      undo.addEventListener("click", function () {
        undo.disabled = true;
        // One call per (lesson, old end date) so every pair gets back exactly what it had. Group rules are not restored.
        var buckets = {};
        r.revoked.forEach(function (x) { var k = x.lesson + "|" + x.expires_at; (buckets[k] = buckets[k] || { lesson: x.lesson, exp: x.expires_at, phones: [] }).phones.push(x.phone); });
        var jobs = Object.keys(buckets).map(function (k) { return buckets[k]; });
        var done = 0, problems = 0;
        (function next() {
          if (!jobs.length) { setToast(problems === 0, "Gave back " + done + " " + (done === 1 ? "entry" : "entries") + (problems ? "; " + problems + " call(s) failed" : "") + ". Group rules were not restored."); BULK.result = null; return load(true); }
          var j = jobs.shift();
          var p = { action: "p3_admin_bulk_grant", kind: b.kind, lessons: [j.lesson], members: j.phones };
          if (j.exp) p.expires_at = j.exp; else p.never = true;
          return api(p).then(function (g) { done += g.applied; next(); }, function () { problems++; next(); });
        })();
      });
      kids.push(el("div", { class: "ac-actions" }, [undo]));
    }
    return el("div", { class: "bk-result", "data-bulk": "result" }, kids);
  }

  // ---- page ------------------------------------------------------------------------------------------

  function render() {
    var root = document.getElementById("dashboard");
    var y = window.scrollY;
    var d = STATE.data;
    root.innerHTML = "";
    root.hidden = false;
    var c = d.counts;
    var people = {};
    d.access.forEach(function (a) { if (a.state === "active") people[a.phone.replace(/\D/g, "").slice(-10)] = 1; });
    root.appendChild(el("div", { class: "dash-head" }, [el("div", {}, [
      el("h1", {}, ["Lesson access"]),
      el("p", {}, ["Who can get into which lessons, the payments behind it, and how to take access away. Today is " + d.today + " (Cairo)."]),
    ])]));
    var t = toastNode();
    if (t) root.appendChild(t);
    if (d.lessons_error) root.appendChild(el("div", { class: "ac-note", style: "margin:0 0 16px" }, [el("b", {}, ["The full lesson list didn\u2019t load, so dropdowns only show lessons already known here. "]), d.lessons_error]));
    root.appendChild(helpBlock());
    var perYear = function (fn) { return "S1: " + fn("Senior 1") + "  \u00b7  S2: " + fn("Senior 2"); };
    var pendingBy = function (y) { return d.payments.filter(function (p) { return p.status === "pending" && sectionPass(d, y, p.scope); }).length; };
    var peopleBy = function (y) { var s = {}; d.access.forEach(function (a) { if (a.state === "active" && sectionPass(d, y, a.scope)) s[keyOf(a.phone)] = 1; }); return Object.keys(s).length; };
    var soonBy = function (y) { return d.access.filter(function (a) { return a.state === "active" && a.days_left !== null && a.days_left <= 7 && sectionPass(d, y, a.scope); }).length; };
    var lessonsLockedBy = function (y) { return (d.lesson_locks || []).filter(function (l) { return l.locked && yearPass(y, l.lesson); }).length; };
    var quizzesLockedBy = function (y) { return d.quizzes.filter(function (q) { return q.locked && yearPass(q.lesson ? y : "", q.lesson); }).length; };
    root.appendChild(el("div", { class: "dash-stats" }, [
      statCard(c.pending, "requests waiting for you", perYear(pendingBy)),
      statCard(Object.keys(people).length, "students with active access", perYear(peopleBy)),
      statCard(c.ending_soon, "ending within 7 days", perYear(soonBy)),
      statCard(c.lessons_locked, "lessons locked", perYear(lessonsLockedBy)),
      statCard(c.videos_locked + " / " + c.videos_open, "videos locked / open"),
      statCard(c.quizzes_locked, "quizzes currently locked", perYear(quizzesLockedBy)),
    ]));
    root.appendChild(tabsNode(d));
    var panel = STATE.tab === "requests" ? requestsPanel(d)
      : STATE.tab === "access" ? accessPanel(d)
      : STATE.tab === "history" ? historyPanel(d)
      : STATE.tab === "lessons" ? lessonsPanel(d)
      : STATE.tab === "quizzes" ? quizzesPanel(d)
      : STATE.tab === "groups" ? groupsPanel(d)
      : STATE.tab === "bulk" ? bulkPanel(d)
      : grantPanel(d);
    root.appendChild(panel);
    window.scrollTo(0, y);
  }

  function renderError(message) {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-err" }, [message]));
  }

  function renderNeedsRelogin() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    var btn = el("button", { class: "qz-next", type: "button" }, ["Log out & sign in again \u2192"]);
    btn.addEventListener("click", function () { window.AuthEngine.clearSession(); location.reload(); });
    root.appendChild(el("div", { class: "dash-err" }, ["Your saved sign-in is missing a session token. Log in again to refresh it (phone and password stay the same)."]));
    root.appendChild(btn);
  }

  function renderLoading() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-loading-state", role: "status", "aria-live": "polite" }, [
      el("div", { class: "dash-loading-card" }, [
        el("div", { class: "dash-loading-art", "aria-hidden": "true" }, [el("span", { class: "dash-loading-ring" }), el("span", { class: "dash-loading-core" })]),
        el("div", { class: "dash-loading-copy" }, [
          el("h1", { class: "dash-loading-title" }, ["Loading lesson access"]),
          el("p", { class: "dash-loading-note" }, ["Reading payments, access and lessons", el("span", { class: "dash-loading-dots", "aria-hidden": "true" }, [el("i"), el("i"), el("i")])]),
        ]),
      ]),
    ]));
  }

  window.AuthEngine.mount("#authgate", function (session) {
    document.getElementById("authgate").remove();
    if (!session.session_token) { renderNeedsRelogin(); return; }
    // Convenience only: the server re-checks is_admin on every call.
    if (session.is_admin === false) { location.href = "student.html"; return; }
    STATE.session = session;
    load(false);
  });
})();
</script>

</body>
</html>
