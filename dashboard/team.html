<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team — Ezz Nasr : Teaching</title>
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/forms.css">
<style>
  main{ padding:20px 0 64px; }
  .titlebar{ flex-wrap:wrap; row-gap:6px; } .titlebar nav{ flex-wrap:wrap; }
  .t-root{ font-family:"Cairo","Manrope",var(--sans),sans-serif; max-width:760px; }
  .t-card{ border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--shadow); padding:16px 18px; margin:0 0 16px; }
  .t-card h2{ margin:0 0 4px; font-size:17px; }
  .t-hint{ margin:0 0 12px; font-size:13.5px; color:var(--ink-dim); line-height:1.7; }
  .t-add{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .t-add input{ flex:1 1 200px; min-width:0; font:15px var(--mono); direction:ltr; text-align:start; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink); }
  .t-btn{ font:600 13.5px "Cairo",var(--mono),sans-serif; padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  .t-btn.primary{ background:var(--ink); color:var(--bg,#fff); border-color:var(--ink); }
  .t-btn.danger{ color:var(--status-fail); }
  .t-btn:disabled{ opacity:.5; cursor:default; }
  .t-msg{ margin-top:10px; font-size:13.5px; min-height:1.2em; }
  .t-msg.ok{ color:var(--status-shipped); } .t-msg.err{ color:var(--status-fail); }
  .t-list{ list-style:none; margin:0; padding:0; }
  .t-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .t-row:last-child{ border-bottom:0; }
  .t-name{ font-weight:700; flex:1 1 140px; min-width:0; }
  .t-phone{ font:13px var(--mono); color:var(--ink-dim); direction:ltr; unicode-bidi:isolate; }
  .t-badge{ font:600 11.5px var(--mono); padding:3px 9px; border-radius:999px; border:1px solid var(--line); }
  .t-badge.assistant{ background:color-mix(in srgb, var(--ink) 9%, transparent); }
  .t-empty,.t-state{ font-size:14px; color:var(--ink-dim); padding:10px 0; }
  .t-state.err{ color:var(--status-fail); }
  .t-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .t-cols h3{ margin:0 0 6px; font-size:14px; }
  .t-cols ul{ margin:0; padding-inline-start:18px; font-size:13.5px; line-height:1.9; }
  .t-warn{ font-size:13px; color:var(--ink-dim); border-inline-start:3px solid var(--line); padding:2px 10px; margin-top:12px; line-height:1.7; }
  @media (max-width:560px){ .t-cols{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <a href="/" class="mark"><span class="dot"></span> EZZ NASR <span aria-hidden="true">&middot;</span> TEACHING</a>
    <nav>
      <a href="master.html">Results</a>
      <a href="access.html">Video access</a>
      <a href="followup.html" lang="ar">متابعة</a>
      <a href="grading.html">Grading</a>
      <a href="team.html" aria-current="page">Team</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap page-head">
    <h1>Team</h1>
    <p class="lede">Assistants can use the follow-up pages and grading only.</p>
  </div>
  <div class="wrap">
    <div id="authgate"></div>
    <div id="t-root" class="t-root" lang="ar" dir="rtl" aria-live="polite"></div>
  </div>
</main>

<footer><div class="wrap"><p class="footer-note">teaching.ezznasr.dev/dashboard/team</p></div></footer>

<script src="/assets/staff-guard.js"></script>
<script>
(function () {
  "use strict";
  var MOCK = /[?&]mock=1\b/.test(location.search);
  var root = document.getElementById("t-root");
  var S = { session: null, staff: [], allow: [], busy: false };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag); attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
      else if (k in n && k !== "list") n[k] = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

  // What each allow-listed action means, in plain Arabic. Anything not listed here is shown by its raw name.
  var LABEL = {
    admin_followup_overview: "شاشة المتابعة (الحضور والواجبات والكويزات)",
    admin_followup_set_attendance: "تسجيل الحضور",
    admin_followup_save_group: "تعديل إعدادات الجروب (المواعيد والدروس)",
    admin_followup_save_templates: "تعديل رسائل أولياء الأمور",
    admin_student_summary: "ملخص الطالب",
    admin_monthly_review: "التقرير الشهري",
    admin_set_requirement: "تحديد الواجب/الكويز مطلوب ولا لأ",
    admin_log_parent_notification: "تسجيل إن ولي الأمر اتكلّم معاه",
    admin_list_parent_notifications: "سجل التواصل مع أولياء الأمور",
    admin_grading_queue: "صفحة تصحيح الحلول المكتوبة",
    admin_grade_written: "وضع درجات الحلول المكتوبة",
    admin_get_written_models: "الإجابات النموذجية للمكتوب",
    get_written_image: "صور حلول الطلاب"
  };
  var CANNOT = ["الدفع والاشتراكات وفتح/قفل الوصول للدروس والكويزات", "الفيديوهات وأقفال الدروس", "إنشاء الجروبات أو إضافة طلاب ليها", "نتائج كل الطلاب (الصفحة الرئيسية) والأسئلة الغلط", "إدارة الفريق"];

  // ---------- API (real: AuthEngine.adminCall; mock: in-memory) ----------
  var MOCK_STAFF = [{ phone: "01000000001", name: "Teacher", role: "admin", year: "" }, { phone: "01000000002", name: "Sara Mahmoud", role: "assistant", year: "Senior 2" }];
  var MOCK_ALLOW = Object.keys(LABEL);
  function api(payload) {
    var call;
    if (MOCK) call = mockApi(payload);
    else if (!window.AuthEngine) call = Promise.reject(new Error("auth.js didn't load."));
    else call = window.AuthEngine.adminCall(S.session, payload).then(function (r) {
      if (!r || r.ok === false) throw new Error((r && r.error) || "Request failed.");
      return r;
    });
    return call.catch(function (e) { throw new Error(friendly(e && e.message)); });
  }
  function friendly(m) {
    m = String(m || "");
    if (m === "Not authorized.") return "الحساب ده مش أدمن. إدارة الفريق للأدمن بس.";
    if (m === "Unknown action: p3_admin_list_staff" || /Not implemented yet/.test(m)) return "السيرفر لسه ما اتحدّثش بصلاحيات المساعد (Phase3_Roles.gs).";
    if (/No student account/.test(m)) return "مفيش حساب طالب بالرقم ده. لازم المساعد يسجّل حساب الأول.";
    if (/admin/i.test(m) && /can't be changed|by hand/.test(m)) return "الحساب ده أدمن. بيتعدّل من شيت Students بس.";
    if (/Missing phone/.test(m)) return "اكتب رقم الموبايل.";
    return m;
  }
  function mockApi(p) {
    return new Promise(function (res, rej) {
      setTimeout(function () {
        if (p.action === "p3_admin_list_staff") return res({ ok: true, staff: JSON.parse(JSON.stringify(MOCK_STAFF)), allow: MOCK_ALLOW.slice() });
        if (p.action === "p3_admin_set_role") {
          var ph = String(p.phone || "").replace(/\D/g, "");
          if (!ph) return rej(new Error("Missing phone number."));
          if (ph.slice(-10) === "1000000001") return rej(new Error("This account is an admin; its role can't be changed here."));
          var ex = MOCK_STAFF.filter(function (s) { return s.phone.slice(-10) === ph.slice(-10); })[0];
          if (p.role === "assistant") {
            if (!ex) { if (ph.slice(-10) === "9999999999") return rej(new Error("No student account with that phone number.")); MOCK_STAFF.push({ phone: "0" + ph.slice(-10), name: "Student " + ph.slice(-4), role: "assistant", year: "Senior 2" }); ex = MOCK_STAFF[MOCK_STAFF.length - 1]; }
            return res({ ok: true, phone: ex.phone, name: ex.name, role: "assistant", changed: true });
          }
          if (ex) MOCK_STAFF.splice(MOCK_STAFF.indexOf(ex), 1);
          return res({ ok: true, phone: ph, name: ex ? ex.name : "", role: "student", changed: !!ex });
        }
        rej(new Error("mock: unknown action"));
      }, 30);
    });
  }

  // ---------- view ----------
  var msgBox = null;
  function say(text, kind) { if (msgBox) { msgBox.textContent = text || ""; msgBox.className = "t-msg" + (kind ? " " + kind : ""); } }

  function addCard() {
    var input = el("input", { type: "tel", inputMode: "numeric", placeholder: "01XXXXXXXXX", autocomplete: "off", "aria-label": "رقم موبايل المساعد" });
    var btn = el("button", { class: "t-btn primary", type: "button", text: "ضيف مساعد" });
    msgBox = el("div", { class: "t-msg", role: "status" });
    function submit() {
      var phone = input.value.trim();
      if (!phone) { say("اكتب رقم الموبايل.", "err"); input.focus(); return; }
      setRole(phone, "assistant", btn).then(function (r) { if (r) { input.value = ""; say(r.changed ? "تمت إضافة " + (r.name || r.phone) + " كمساعد." : (r.name || r.phone) + " مساعد بالفعل.", "ok"); } });
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    return el("section", { class: "t-card" }, [
      el("h2", { text: "إضافة مساعد" }),
      el("p", { class: "t-hint", text: "اكتب رقم موبايل حساب طالب مسجّل بالفعل. المساعد بيدخل بنفس الرقم والباسورد بتوعه، وبيفتح صفحات المتابعة والتصحيح بس." }),
      el("div", { class: "t-add" }, [input, btn]),
      msgBox
    ]);
  }

  function setRole(phone, role, btn) {
    if (S.busy) return Promise.resolve(null);
    S.busy = true; if (btn) btn.disabled = true; say("");
    return api({ action: "p3_admin_set_role", phone: phone, role: role }).then(function (r) {
      S.busy = false; if (btn) btn.disabled = false;
      return reload().then(function () { return r; });
    }, function (e) { S.busy = false; if (btn) btn.disabled = false; say(e.message, "err"); return null; });
  }

  function staffCard() {
    var list = el("ul", { class: "t-list" });
    S.staff.forEach(function (s) {
      var isAdmin = s.role === "admin";
      var row = el("li", { class: "t-row" }, [
        el("span", { class: "t-name", text: s.name || s.phone }),
        el("span", { class: "t-phone", text: s.phone }),
        el("span", { class: "t-badge " + s.role, text: isAdmin ? "أدمن" : "مساعد" })
      ]);
      if (isAdmin) row.appendChild(el("span", { class: "t-hint", style: "margin:0", text: "من شيت Students" }));
      else row.appendChild(el("button", { class: "t-btn danger", type: "button", text: "شيل الصلاحية", on: { click: function () {
        if (window.confirm("تشيل صلاحية المساعد من " + (s.name || s.phone) + "؟ هتتقفل عليه من أول طلب.")) setRole(s.phone, "", null).then(function (r) { if (r) say("اتشالت الصلاحية من " + (r.name || r.phone) + ".", "ok"); });
      } } }));
      list.appendChild(row);
    });
    var assistants = S.staff.filter(function (s) { return s.role === "assistant"; }).length;
    return el("section", { class: "t-card" }, [
      el("h2", { text: "الفريق" }),
      assistants ? null : el("p", { class: "t-empty", text: "لسه مفيش مساعدين." }),
      list
    ]);
  }

  function powersCard() {
    var can = el("ul"), cannot = el("ul");
    S.allow.forEach(function (a) { can.appendChild(el("li", { text: LABEL[a] || a })); });
    CANNOT.forEach(function (c) { cannot.appendChild(el("li", { text: c })); });
    return el("section", { class: "t-card" }, [
      el("h2", { text: "المساعد يقدر يعمل إيه؟" }),
      el("div", { class: "t-cols" }, [
        el("div", {}, [el("h3", { text: "يقدر" }), can]),
        el("div", {}, [el("h3", { text: "ما يقدرش" }), cannot])
      ]),
      el("p", { class: "t-warn", text: "تنبيه: المساعد بيشوف أرقام الطلاب وأولياء الأمور في صفحة المتابعة. ضيف بس حد بتثق فيه." })
    ]);
  }

  function render() {
    clear(root);
    root.appendChild(addCard()); root.appendChild(staffCard()); root.appendChild(powersCard());
  }
  function reload() {
    return api({ action: "p3_admin_list_staff" }).then(function (r) { S.staff = r.staff || []; S.allow = r.allow || []; render(); },
      function (e) { clear(root).appendChild(el("div", { class: "t-state err", text: e.message })); });
  }

  // ---------- boot ----------
  function start(session) {
    S.session = session;
    clear(root).appendChild(el("div", { class: "t-state", text: "جاري التحميل…" }));
    reload();
  }
  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("Couldn't load " + src)); }; document.head.appendChild(s); }); }
  function boot() {
    if (MOCK) { var g = document.getElementById("authgate"); if (g) g.remove(); start(null); return; }
    loadScript("/assets/auth.js").then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
        if (!session.session_token) { clear(root).appendChild(el("div", { class: "t-state err", text: "تسجيل الدخول المحفوظ ناقصه رمز الجلسة. اخرج وادخل تاني." })); return; }
        // Convenience only: the server re-checks the role on every call. Admin-only page.
        window.StaffGuard.require(["admin"], session).then(function (role) { if (role) start(session); });
      });
    }, function (e) { clear(root).appendChild(el("div", { class: "t-state err", text: e.message })); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
