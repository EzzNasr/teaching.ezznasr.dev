<script>
(function () {

  // Arabic / English (assets/i18n.js). Plain text is translated where it is written; text that mixes words and data is built with t().
  var I = window.I18n || { t: function (s) { return s; }, lang: function () { return "ar"; }, onChange: function () {} };

  // ---------- words ----------
  var SUBJECT = { math: "رياضة", english: "إنجليزي", programming: "برمجة" };

  }
  // What each assistant permission means, in plain Arabic. Anything not listed gets a readable fallback, never its code name.

    grade_written: "صحّح إجابة مكتوبة", set_requirement: "غيّر المطلوب في درس",
    log_parent_notification: "سجّل تواصل مع ولي أمر", parent_notification: "سجّل تواصل مع ولي أمر", monthly_review: "علّم التقرير الشهري",
    save_group: "غيّر إعدادات جروب", save_templates: "عدّل رسائل أولياء الأمور",
    req_save_global: "غيّر مطلوب لكل الجروبات", req_save_group: "غيّر مطلوب لجروب واحد", req_check: "علّم بند في التقرير الشهري",
    notify_settings: "غيّر إعدادات التذكير", teacher_set_assistant: "ضاف مساعد", teacher_revoke_assistant: "شال مساعد",
    group_move: "نقل طالب لجروب تاني", mark_done: "علّم خطوة متابعة إنها خلصت",
    set_video: "غيّر فيديو", grant_access: "فتح درس لطالب", revoke_access: "قفل درس على طالب",
    set_quiz_lock: "قفل أو فتح كويز", group_grant_access: "فتح درس لجروب", group_revoke_access: "قفل درس على جروب",
    grant_quiz_access: "فتح كويز لطالب", revoke_quiz_access: "قفل كويز على طالب", group_grant_quiz_access: "فتح كويز لجروب", group_revoke_quiz_access: "قفل كويز على جروب"
  };
  function logWhat(f) {
    var k = String(f || "").replace(/^(admin_|p[0-9]_|fu2_|followup_)+/, "");
    return LOG_WHAT[f] || LOG_WHAT[k] || "تعديل تاني";
  }
  var MODE_WORD = { center: "في السنتر", online: "أونلاين", absent: "غياب" };
  var KEY_WORD = { lesson: "الدرس", phone: "الرقم", mode: "الحضور", group: "الجروب", quiz_required: "الكويز مطلوب", homework_required: "الواجب مطلوب", awarded: "الدرجة", month: "الشهر" };
  function logValue(v) {
    v = String(v == null ? "" : v);
    if (!/^[\[{]/.test(v)) return v;
    try {
      var o = JSON.parse(v);
      if (Array.isArray(o)) return o.join("، ");
      return Object.keys(o).filter(function (k) { return o[k] !== "" && o[k] != null; }).map(function (k) {
        var x = o[k]; if (x === true) x = t("أيوه"); else if (x === false) x = t("لأ"); else if (typeof x === "object") x = JSON.stringify(x);
        else if (k === "mode" && MODE_WORD[x]) x = t(MODE_WORD[x]);

  }

  // ---------- API (real: AuthEngine.adminCall; mock: in memory) ----------
  function api(payload) {
    var call;
    if (MOCK) call = mockApi(payload);
    else if (!window.AuthEngine) call = Promise.reject(new Error("صفحة الدخول ما اتحمّلتش. اعمل تحديث للصفحة."));

    return call.then(function (r) { if (!r || r.ok === false) throw new Error((r && r.error) || "Request failed."); return r; })
      .catch(function (e) { throw new Error(friendly(e && e.message)); });
  }
  function friendly(m) {
    m = String(m || "");
    if (m === "Not authorized.") return "الصفحة دي لصاحب الموقع بس.";
    if (/Unknown action|Not implemented yet/.test(m)) return "السيرفر لسه ما اتحدّثش. محتاج تنزّل نسخة جديدة من السكريبت.";
    if (/No student account/.test(m)) return "مفيش حساب طالب بالرقم ده. لازم الشخص يسجّل حساب على الموقع الأول.";
    if (/admin/i.test(m) && /can't be changed|by hand/.test(m)) return "ده حساب صاحب الموقع، وصلاحيته مش بتتغيّر من هنا.";
    if (/Missing phone/.test(m)) return "اكتب رقم الموبايل.";
    if (m === "Request failed.") return "حصلت مشكلة. جرّب تاني.";
    return m;
  }
  var MOCK_DB = {
    staff: [{ phone: "01000000001", name: "م. عز نصر", role: "admin" }, { phone: "01000000002", name: "سارة محمود", role: "assistant" }],
    teachers: [{ phone: "01000000009", name: "منى (رياضة)", scope: "math", telegram: true, assistants: [{ phone: "01000000010", name: "عمر" }] }],
    tokens: [{ name: "mona-laptop", scope: "math", created: "2026-10-30" }]
  };
  function mockApi(p) {
    return new Promise(function (res) {
      setTimeout(function () {
        var D = MOCK_DB, ph = String(p.phone || "").replace(/\D/g, "").slice(-10);
        if (p.action === "p3_admin_list_staff") return res({ ok: true, staff: JSON.parse(JSON.stringify(D.staff)), allow: Object.keys(LABEL).filter(function (a) { return !/payment|access_overview|list_groups/.test(a); }) });
        if (p.action === "p4_admin_list_teachers") return res({ ok: true, teachers: JSON.parse(JSON.stringify(D.teachers)), tokens: D.tokens.slice() });
        if (p.action === "p3_admin_set_role") {
          if (!ph) return res({ ok: false, error: "Missing phone number." });
          if (ph === "1000000001") return res({ ok: false, error: "This account is an admin; its role can't be changed here." });

          if (ex) D.staff.splice(D.staff.indexOf(ex), 1);

        }

          D.teachers = D.teachers.filter(function (t) { return t.phone.slice(-10) !== ph; });

          return res({ ok: true, phone: p.phone, role: p.scope ? "teacher" : "student", scope: p.scope || "" });
        }
        if (p.action === "p4_admin_tg_unlink") { D.teachers.forEach(function (t) { if (t.phone.slice(-10) === ph) t.telegram = false; }); return res({ ok: true }); }
        if (p.action === "p4_admin_list_edit_log") return res({ ok: true, rows: [
          { ts: "2026-10-31 09:15:00", actor_kind: "assistant", actor_id: "01000000010", actor_name: "عمر", student_old: "01000000002", student_new: "01000000002", field: "attendance_center", old_value: '{"lesson":"math/l1","mode":""}', new_value: '{"lesson":"math/l1","mode":"center"}' },
          { ts: "2026-10-30 10:00:00", actor_kind: "teacher", actor_id: "01000000009", actor_name: "منى (رياضة)", student_old: "01000000002", student_new: "01000000002", field: "name", old_value: "سارة", new_value: "سارة م." }] });
        res({ ok: false, error: "mock: unknown action" });

  // ---------- main card: everyone with staff access ----------

    say("");

    } } }));

  function assistantRow(s) {
    var name = s.name || s.phone;
    return el("li", { class: "t-row", "data-role": "assistant" }, [who(name, s.phone, [el("span", { class: "t-chip", text: "مساعد ليك" })]),
      el("button", { class: "t-btn danger", type: "button", "data-act": "rm-assistant", text: "شيل الصلاحية", on: { click: function (e) {
        act(e.currentTarget, "تشيل صلاحية المساعد من " + name + "؟ هتتقفل عليه من أول طلب.", { action: "p3_admin_set_role", phone: s.phone, role: "" }, function (r) { return "اتشالت الصلاحية من " + (r.name || name) + "."; });
      } } })]);
  }
  function addPanel() {
    var box = el("div", { class: "t-add", id: "t-add" });
    if (!S.adding) box.hidden = true;
    var seg = el("div", { class: "fu-seg", role: "radiogroup", "aria-label": "تضيف مين؟" });
    [["assistant", "مساعد ليك"], ["teacher", "مدرّس"]].forEach(function (k) {
      seg.appendChild(el("button", { type: "button", role: "radio", "data-kind": k[0], "aria-checked": String(S.addKind === k[0]), text: k[1], on: { click: function () { S.addKind = k[0]; render(); var i = document.getElementById("t-phone"); if (i) i.focus(); } } }));
    });
    var phone = el("input", { type: "tel", inputmode: "numeric", autocomplete: "off", placeholder: "01XXXXXXXXX", id: "t-phone", "aria-label": "رقم الموبايل" });
    // What was typed survives a re-draw (switching kind or language).
    phone.value = S.draft.phone;
    phone.addEventListener("input", function () { S.draft.phone = phone.value; });
    box.appendChild(seg);
    box.appendChild(phone);
    var boxes = [];
    if (S.addKind === "teacher") {
      var subs = el("div", { class: "t-subjects", role: "group", "aria-label": "المواد" });
      Object.keys(SUBJECT).forEach(function (s) { var c = el("input", { type: "checkbox", value: s, "aria-label": SUBJECT[s] }); c.checked = !!S.draft.subj[s]; c.addEventListener("change", function () { S.draft.subj[s] = c.checked; }); boxes.push([s, c]); subs.appendChild(el("label", {}, [c, SUBJECT[s]])); });
      box.appendChild(subs);
      box.appendChild(el("p", { class: "t-help", text: "المدرّس بيدخل بحسابه كطالب، وبيشوف مواده وطلابه بس. يقدر يضيف لحد 3 مساعدين ليه، ويستلم طلبات الدفع على التليجرام." }));
    } else box.appendChild(el("p", { class: "t-help", text: "المساعد بيدخل بنفس رقمه والباسورد بتوعه، وبيفتح صفحات المتابعة والتصحيح بس. لازم يكون عامل حساب على الموقع." }));
    var go = el("button", { class: "fu-btn primary", type: "button", id: "t-add-go", text: S.addKind === "teacher" ? "خلّيه مدرّس" : "ضيفه مساعد" });
    go.addEventListener("click", function () {
      var v = String(phone.value || "").trim();
      if (!v) { say("اكتب رقم الموبايل.", "err"); phone.focus(); return; }
      if (S.addKind === "teacher") {
        var scope = boxes.filter(function (b) { return b[1].checked; }).map(function (b) { return b[0]; }).join(",");
        if (!scope) { say("علّم مادة واحدة على الأقل.", "err"); return; }
        act(go, null, { action: "p4_admin_set_teacher", phone: v, scope: scope }, function () { S.adding = false; S.draft = { phone: "", subj: {} }; return "اتحفظ: بقى مدرّس " + subjects(scope).join("، ") + "."; });
      } else {
        act(go, null, { action: "p3_admin_set_role", phone: v, role: "assistant" }, function (r) { S.adding = false; S.draft = { phone: "", subj: {} }; return r.changed ? "اتضاف " + (r.name || r.phone) + " كمساعد." : (r.name || r.phone) + " مساعد بالفعل."; });
      }
    });
    box.appendChild(go);
    return box;
  }
  function peopleCard() {
    var owners = S.staff.filter(function (s) { return s.role === "admin"; });
    var mine = S.staff.filter(function (s) { return s.role === "assistant"; });
    var total = owners.length + mine.length + S.teachers.length + S.teachers.reduce(function (n, t) { return n + (t.assistants || []).length; }, 0);
    var open = el("button", { class: "fu-btn" + (S.adding ? "" : " primary"), type: "button", id: "t-add-open", text: S.adding ? "اقفل" : "+ ضيف حد للفريق",
      on: { click: function () { S.adding = !S.adding; say(""); render(); var i = document.getElementById("t-phone"); if (i && S.adding) i.focus(); } } });
    var groups = [
      ["صاحب الموقع", owners.map(ownerRow), "t-owners"],
      ["المدرّسين ومساعدينهم", S.teachers.map(teacherRow), "t-teachers", "لسه مفيش مدرّسين."],
      ["مساعدينك", mine.map(assistantRow), "t-assistants", "لسه مفيش مساعدين."]
    ];
    var card = el("section", { class: "fu-card", id: "t-people" }, [
      el("h3", { text: "الفريق (" + total + ")" }), open, addPanel(),
      el("div", { class: "t-msg", id: "t-msg", role: "status" })
    ]);
    groups.forEach(function (g) {
      if (!g[1].length && !g[3]) return;
      card.appendChild(el("div", { class: "t-group" }, [el("h4", { text: g[0] }),
        el("ul", { class: "t-list", id: g[2] }, g[1].length ? g[1] : [el("li", { class: "t-state", text: g[3] })])]));
    });
    return card;
  }

  // ---------- recent changes ----------
  var KIND = { teacher: "مدرّس", assistant: "مساعد" };
  function logCard() {
    var card = el("section", { class: "fu-card", id: "t-logcard" }, [el("h3", { text: "آخر التعديلات" }),
      el("p", { class: "t-help", style: "margin-top:2px", text: "اللي عمله المدرّسين والمساعدين (الأحدث فوق): أسماء وأرقام الطلاب، الحضور، الدرجات، المطلوبات وخطوات المتابعة. تعديلاتك إنت مش هنا." })]);
    if (S.log === null) { card.appendChild(el("div", { class: "t-state", text: "جاري التحميل…" })); return card; }
    if (S.log.error) { card.appendChild(el("div", { class: "t-state err", text: S.log.error })); return card; }
    var sel = el("select", { id: "t-logwho", "aria-label": "تعديلات مين" }, [["", "الكل"], ["teacher", "المدرّسين بس"], ["assistant", "المساعدين بس"]].map(function (o) {
      var op = el("option", { value: o[0], text: o[1] }); if (o[0] === S.logWho) op.selected = true; return op; }));
    sel.addEventListener("change", function (e) { S.logWho = e.target.value; render(); });
    card.appendChild(el("label", { class: "t-filter" }, ["اعرض:", sel]));
    var list = S.log.rows.filter(function (x) { return !S.logWho || x.actor_kind === S.logWho; });
    var ul = el("ul", { class: "t-log", id: "t-log" });
    if (!list.length) ul.appendChild(el("li", { class: "t-state", text: S.log.rows.length ? "مفيش تعديلات من النوع ده." : "لسه مفيش تعديلات." }));
    list.forEach(function (x) {
      var stu = x.student_old === x.student_new ? x.student_old : x.student_old + " ← " + x.student_new;
      var before = logValue(x.old_value), after = logValue(x.new_value);
      ul.appendChild(el("li", { "data-kind": x.actor_kind || "" }, [
        el("div", { class: "t-when", translate: "no", text: String(x.ts || "") + " · " + (KIND[x.actor_kind] ? t(KIND[x.actor_kind]) : "") + " " + (x.actor_name || x.actor_id || "") }),
        el("div", { class: "t-what", text: logWhat(x.field) }),
        stu ? el("div", { class: "t-ba" }, ["الطالب: ", el("span", { class: "t-phone", text: logValue(stu) })]) : null,
        before || after ? el("div", { class: "t-ba", translate: "no", text: (before ? t("قبل: {0}", [before]) : "") + (before && after ? "  ·  " : "") + (after ? t("بعد: {0}", [after]) : "") }) : null
      ]));
    });
    card.appendChild(ul);
    if (!S.logMore && S.log.rows.length >= 50) card.appendChild(el("button", { class: "fu-btn", type: "button", id: "t-logmore", text: "اعرض أقدم (لحد 200)", on: { click: function () { S.logMore = true; loadLog(); } } }));
    return card;
  }
  function loadLog() {
    return api({ action: "p4_admin_list_edit_log", limit: S.logMore ? 200 : 50 }).then(function (r) { S.log = { rows: r.rows || [] }; render(); },
      function (e) { S.log = { rows: [], error: e.message }; render(); });
  }

  // ---------- folded details ----------
  function moreCard() {
    var can = el("ul"), cannot = el("ul");
    var seen = {};
    S.allow.forEach(function (a) { var l = labelOf(a); if (!seen[l]) { seen[l] = 1; can.appendChild(el("li", { text: l })); } });
    CANNOT.forEach(function (c) { cannot.appendChild(el("li", { text: c })); });
    var keys = el("ul", {}, S.tokens.length ? S.tokens.map(function (k) { return el("li", { translate: "no", text: k.name + " — " + subjects(k.scope).map(function (x) { return t(x); }).join(I.lang() === "en" ? ", " : "، ") + (k.created ? " — " + t("من {0}", [k.created]) : "") }); }) : [el("li", { text: "مفيش." })]);
    return el("div", {}, [
      el("p", { class: "t-warn", text: "تنبيه: المساعد بيشوف أرقام الطلاب وأولياء الأمور في صفحة المتابعة. ضيف بس حد بتثق فيه." }),
      el("details", { class: "t-more", id: "t-powers" }, [el("summary", { text: "المساعد يقدر يعمل إيه؟" }),
        el("h5", { text: "يقدر" }), can, el("h5", { text: "ما يقدرش" }), cannot]),
      el("details", { class: "t-more", id: "t-keys" }, [el("summary", { text: "أجهزة برنامج الكويزات (أسماء بس)" }),
        el("p", { class: "t-help", text: "الأجهزة اللي مدرّس بيستخدم عليها برنامج عمل الكويزات بمفتاح خاص بيه." }), keys]),
      el("p", { class: "t-links" }, [el("a", { href: "revenue.html", text: "الإيرادات ←" }), el("a", { href: "teacher-stats.html", text: "أرقام كل مدرّس ومادة ←" })])
    ]);
  }

  // ---------- render ----------
  function render() {
    var focusId = document.activeElement && document.activeElement.id;
    clear(root);
    root.appendChild(peopleCard());
    root.appendChild(logCard());
    root.appendChild(moreCard());
    if (S.flash) say(S.flash.text, S.flash.kind);
    if (focusId) { var f = document.getElementById(focusId); if (f && f.focus) f.focus(); }
  }
  function reload() {
    return Promise.all([api({ action: "p3_admin_list_staff" }), api({ action: "p4_admin_list_teachers" }).catch(function () { return { teachers: [], tokens: [] }; })]).then(function (r) {
      S.staff = r[0].staff || []; S.allow = r[0].allow || [];
      S.teachers = r[1].teachers || []; S.tokens = r[1].tokens || [];
      render();
    }, function (e) { clear(root).appendChild(el("div", { class: "t-state err", text: e.message })); });
  }

  // ---------- boot ----------
  function start(session) { S.session = session; I.onChange(function () { if (S.staff.length || S.log) render(); }); reload().then(loadLog); }
  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("ما قدرناش نحمّل " + src)); }; document.head.appendChild(s); }); }
  function boot() {
    if (MOCK) { document.getElementById("t-mock").hidden = false; var g = document.getElementById("authgate"); if (g) g.remove(); start(null); return; }
    loadScript("/assets/auth.js").then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
        if (!session.session_token) { clear(root).appendChild(el("div", { class: "t-state err", text: "تسجيل الدخول المحفوظ ناقصه رمز الجلسة. اخرج وادخل تاني." })); return; }
        // Convenience only: the server re-checks the role on every call. Owner-only page.
        window.StaffGuard.require(null, session).then(function (role) { if (role) start(session); });
      });
    }, function (e) { clear(root).appendChild(el("div", { class: "t-state err", text: e.message })); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
