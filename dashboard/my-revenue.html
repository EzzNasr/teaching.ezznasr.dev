      "h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:22px 0 8px;border-bottom:2px solid #111;padding-bottom:4px}.meta{color:#555;font-size:12px;margin:0 0 14px}" +
      "table{width:100%;border-collapse:collapse;margin:0 0 6px;page-break-inside:auto}tr{page-break-inside:avoid}th,td{border:1px solid #bbb;padding:5px 7px;text-align:start;vertical-align:top}" +
      "th{background:#f0f0f0;font-size:12px}td.n,.sum td{font-family:Consolas,monospace;white-space:nowrap}.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 6px}" +
      ".sum div{border:1px solid #bbb;padding:8px}.sum b{display:block;font-size:17px}tfoot td{font-weight:700;background:#fafafa}.foot{color:#777;font-size:11px;margin-top:18px}" +
      "@media print{body{padding:0}.noprint{display:none}}";
    var lessonsByCourse = d.courses.map(function (co) {
      var ls = d.lessons.filter(function (l) { return l.course === co.key; });
      return "<h2>" + esc(courseName(co.key)) + "</h2><table><thead>" + th(["الدرس", "السعر", "الفيديوهات", "ظاهر للطلاب", "عمليات الشراء", "المبيعات"]) + "</thead><tbody>" +
        rows(ls.map(function (l) { return [lessonName(l.key), { t: money(l.price) }, { t: count(l.videos) }, l.visible ? tr("أيوه") : tr("مخفي"), { t: count(l.sales.count) }, { t: money(l.sales.amount) }]; })) +
        (co.subscriptions.count ? rows([[tr("اشتراكات (فصل / ترم)"), { t: "" }, { t: "" }, "", { t: count(co.subscriptions.count) }, { t: money(co.subscriptions.amount) }]]) : "") +
        "</tbody><tfoot><tr><td>" + T("إجمالي الكورس") + "</td><td></td><td class=\"n\">" + esc(count(co.videos)) + "</td><td></td><td class=\"n\">" + esc(count(co.total.count)) + "</td><td class=\"n\">" + esc(money(co.total.amount)) + "</td></tr></tfoot></table>";
    }).join("");
    return "<!DOCTYPE html><html lang=\"" + (en ? "en" : "ar") + "\" dir=\"" + dir + "\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">" +
      "<title>" + T("تقرير الإيرادات") + " — " + esc(today) + "</title><style>" + css + "</style></head><body>" +
      "<p class=\"noprint\" style=\"background:#ffd;border:1px solid #cc9;padding:6px 10px\">" + T("علشان تحفظه PDF: اطبع الصفحة (Ctrl+P) واختار «Save as PDF».") + "</p>" +
      "<h1>" + T("تقرير الإيرادات") + "</h1><p class=\"meta\">" + esc(who) + " · " + T("حتى يوم {0}", [today]) + " · " + T("المبالغ بالجنيه المصري. المحسوب: المدفوعات اللي اتقبلت على الموقع بس.") + "</p>" +
      "<h2>" + T("الملخص") + "</h2><div class=\"sum\">" +
      [["الطلاب", count(c.students)], ["الكورسات", count(c.courses)], ["الدروس", count(c.lessons)], ["المشتريات", count(c.purchases)], ["إجمالي المبيعات", money(c.total_sales)]]
        .map(function (x) { return "<div>" + T(x[0]) + "<b>" + esc(x[1]) + "</b></div>"; }).join("") + "</div>" +
      (c.pending ? "<p class=\"meta\">" + T("{0} مستنية موافقة (مش محسوبة).", [c.pending]) + "</p>" : "") +
      "<h2>" + T("حسب الكورس") + "</h2><table><thead>" + th(["الكورس", "الدروس", "الفيديوهات", "عمليات الشراء", "المبيعات"]) + "</thead><tbody>" +
      rows(d.courses.map(function (co) { return [courseName(co.key), { t: count(co.lessons) }, { t: count(co.videos) }, { t: count(co.total.count) }, { t: money(co.total.amount) }]; })) +
      "</tbody><tfoot><tr><td>" + T("الإجمالي") + "</td><td class=\"n\">" + esc(count(c.lessons)) + "</td><td></td><td class=\"n\">" + esc(count(c.purchases)) + "</td><td class=\"n\">" + esc(money(c.total_sales)) + "</td></tr></tfoot></table>" +
      lessonsByCourse +
      "<h2>" + T("كل المشتريات") + "</h2><table><thead>" + th(["التاريخ", "الطالب", "اشترى", "طريقة الدفع", "المبلغ"]) + "</thead><tbody>" +
      rows(d.purchases.map(function (p) { return [p.date, p.student, itemName(p), method(p.method), { t: money(p.amount) }]; })) +
      "</tbody><tfoot><tr><td colspan=\"4\">" + T("الإجمالي") + "</td><td class=\"n\">" + esc(money(c.total_sales)) + "</td></tr></tfoot></table>" +
      "<p class=\"foot\">teaching.ezznasr.dev · " + esc(d.generated_at || "") + "</p></body></html>";
  }
  function reportCsv(d) {
    var head = [tr("التاريخ"), tr("الطالب"), tr("اشترى"), tr("النوع"), tr("الكورس"), tr("المبلغ"), tr("طريقة الدفع")];
    var kind = function (k) { return k === "lesson" ? tr("درس") : k === "chapter" ? tr("فصل") : k === "term" ? tr("ترم") : k; };
    var lines = [head].concat(d.purchases.map(function (p) { return [p.date, p.student, itemName(p), kind(p.kind), courseName(p.course), p.amount == null ? "" : p.amount, method(p.method)]; }));
    return "﻿" + lines.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
  }
  function save(name, type, text) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = el("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function download(btn, msg) {
    if (!S.data) return;
    btn.disabled = true;
    try {
      var today = new Date().toISOString().slice(0, 10);
      var who = (S.session && S.session.student_name) || "";
      window.__lastReport = { html: reportHtml(S.data, who, today), csv: reportCsv(S.data) };   // for the tests
      save("revenue-report-" + today + ".html", "text/html;charset=utf-8", window.__lastReport.html);
      setTimeout(function () { save("purchases-" + today + ".csv", "text/csv;charset=utf-8", window.__lastReport.csv); }, 400);
      msg.className = "m-msg"; msg.textContent = tr("نزل ملفين: التقرير (افتحه واطبعه PDF) وملف المشتريات لإكسل.");
    } catch (e) { msg.className = "m-msg err"; msg.textContent = e.message; }
    setTimeout(function () { btn.disabled = false; }, 800);
  }

  // ---------- boot ----------
  function start(session) {
    S.session = session;
    clear(root).appendChild(el("p", { class: "m-state", text: "بنجيب الأرقام…" }));
    Promise.all([api({ action: "teacher_revenue_report" }), loadTitles()]).then(function (r) { S.data = r[0]; render(); },
      function (e) { clear(root).appendChild(el("p", { class: "m-state err", text: e.message })); });
  }
  window.addEventListener("hashchange", render);
  if (window.I18n && window.I18n.onChange) window.I18n.onChange(render);
  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("ما قدرناش نحمّل " + src)); }; document.head.appendChild(s); }); }
  function boot() {
    if (MOCK) { var g = document.getElementById("authgate"); if (g) g.remove(); start({ student_name: "Science Teacher" }); return; }
    loadScript("/assets/auth.js").then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
        if (!session.session_token) { clear(root).appendChild(el("div", { class: "m-state err", text: "تسجيل الدخول المحفوظ ناقصه رمز الجلسة. اخرج وادخل تاني." })); return; }
        window.StaffGuard.require(null, session).then(function (role) { if (role) start(session); });
      });
    }, function (e) { clear(root).appendChild(el("div", { class: "m-state err", text: e.message })); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
