<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Dashboard — Teaching Portal</title>
<link rel="icon" href="/icons/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/forms.css">
<script src="/assets/theme.js" defer></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --bg-glow: rgba(99, 102, 241, .14);
    --surface: rgba(255, 255, 255, .86);
    --surface-strong: #ffffff;
    --surface-soft: #f8f9fd;
    --ink: #172033;
    --ink-dim: #68738a;
    --line: #e4e8f1;
    --line-strong: #d7ddea;
    --accent: #5b5ce2;
    --accent-2: #8b5cf6;
    --accent-soft: #eeedff;
    --good: #159a72;
    --low: #d04d57;
    --shadow: 0 20px 55px rgba(30, 41, 72, .10);
    --shadow-soft: 0 8px 24px rgba(30, 41, 72, .07);
    --sans: 'Manrope', system-ui, sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1120;
    --bg-glow: rgba(129, 140, 248, .16);
    --surface: rgba(25, 31, 52, .86);
    --surface-strong: #1a2035;
    --surface-soft: #171d31;
    --ink: #f1f4ff;
    --ink-dim: #9da7c0;
    --line: #2a334d;
    --line-strong: #39435f;
    --accent: #9b9cff;
    --accent-2: #c084fc;
    --accent-soft: #29274d;
    --good: #50d3a9;
    --low: #ff858d;
    --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, .22);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); transition: background .25s ease; }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 0%, var(--bg-glow), transparent 32rem),
      radial-gradient(circle at 95% 18%, rgba(139, 92, 246, .08), transparent 28rem),
      var(--bg);
    font-family: var(--sans);
    transition: color .25s ease, background .25s ease;
  }

  .dash-shell { width: min(100% - 32px, 1180px); margin: 0 auto; padding: 34px 0 72px; }
  .dash-topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom: 44px; }
  .dash-back { display:inline-flex; align-items:center; gap:8px; color:var(--ink-dim); font: 600 12px/1 var(--mono); text-decoration:none; letter-spacing:.01em; transition:color .2s ease, transform .2s ease; }
  .dash-back:hover { color:var(--accent); transform:translateX(-2px); }
  .theme-toggle { display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:var(--ink-dim); background:var(--surface); box-shadow:var(--shadow-soft); font:600 11px var(--mono); cursor:pointer; transition:all .2s ease; }
  .theme-toggle:hover { color:var(--accent); border-color:var(--accent); transform:translateY(-1px); }
  .theme-toggle:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset:3px; }
  .theme-toggle-icon { font-size:15px; line-height:1; }

  #dashboard { animation: dash-in .45s ease both; }
  @keyframes dash-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .dash-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; }
  .dash-head h1 { margin:0; color:var(--ink); font:800 clamp(28px, 5vw, 42px)/1.08 var(--sans); letter-spacing:-.045em; }
  .dash-head p { margin:10px 0 0; color:var(--ink-dim); font: 13px/1.6 var(--mono); }
  .dash-head:after { content:'MASTER PORTAL'; color:var(--accent); font:700 10px var(--mono); letter-spacing:.16em; white-space:nowrap; }

  .dash-stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:32px; }
  .dash-stat { position:relative; overflow:hidden; min-height:112px; padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow-soft); backdrop-filter:blur(14px); }
  .dash-stat:after { content:''; position:absolute; width:72px; height:72px; right:-22px; bottom:-30px; border-radius:50%; background:var(--accent-soft); }
  .dash-stat b { position:relative; z-index:1; display:block; color:var(--ink); font:800 30px/1 var(--sans); letter-spacing:-.04em; }
  .dash-stat span { position:relative; z-index:1; display:block; margin-top:9px; color:var(--ink-dim); font:11px var(--mono); }

  .dash-filters { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:24px; padding:16px 18px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:var(--shadow-soft); backdrop-filter:blur(14px); }
  .dash-filters label { display:flex; flex-direction:column; gap:5px; color:var(--ink-dim); font:600 10px var(--mono); letter-spacing:.04em; }
  .dash-select, .dash-search { border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; color:var(--ink); background:var(--surface-strong); font:13px var(--sans); min-width:150px; }
  .dash-select:focus, .dash-search:focus { outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset:1px; }
  .dash-search { min-width:220px; }
  .dash-clear { align-self:flex-end; border:1px solid var(--line-strong); border-radius:9px; padding:8px 12px; color:var(--ink-dim); background:var(--surface-soft); font:600 11px var(--mono); cursor:pointer; }
  .dash-clear:hover { color:var(--accent); border-color:var(--accent); }

  .dash-section { margin-bottom:28px; padding:22px 24px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-soft); backdrop-filter:blur(14px); }
  .dash-section h2 { display:flex; align-items:center; gap:10px; margin:0 0 8px; padding:0 0 15px; border-bottom:1px solid var(--line); color:var(--ink); font:800 16px var(--sans); letter-spacing:-.02em; }
  .dash-section h2:before { content:''; width:8px; height:8px; border-radius:3px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 0 0 5px var(--accent-soft); }
  .dash-section-note { margin:-4px 0 14px; color:var(--ink-dim); font:11px var(--mono); }
  .dash-empty { padding:20px 0 6px; color:var(--ink-dim); font:13px/1.6 var(--mono); }

  .dash-row { display:flex; align-items:center; gap:16px; min-height:66px; padding:14px 2px; border-bottom:1px solid var(--line); }
  .dash-row:last-child { border-bottom:0; }
  .dash-row.is-clickable { cursor:pointer; border-radius:10px; transition:background .15s ease; }
  .dash-row.is-clickable:hover { background:var(--surface-soft); }
  .dash-row.is-selected { background:var(--accent-soft); }
  .dash-row-main { flex:1; min-width:0; }
  .dash-row-title { overflow:hidden; color:var(--ink); font:700 14px var(--sans); text-overflow:ellipsis; white-space:nowrap; }
  .dash-row-sub { margin-top:5px; overflow:hidden; color:var(--ink-dim); font:11px var(--mono); text-overflow:ellipsis; white-space:nowrap; }
  .dash-score { flex-shrink:0; min-width:84px; text-align:right; font:600 12px var(--mono); }
  .dash-score.is-good { color:var(--good); } .dash-score.is-mid { color:var(--ink); } .dash-score.is-low { color:var(--low); }
  .dash-badge { flex-shrink:0; padding:5px 8px; border:1px solid var(--line-strong); border-radius:7px; color:var(--ink-dim); background:var(--surface-soft); font:10px var(--mono); letter-spacing:.03em; }
  .dash-link { flex-shrink:0; color:var(--accent); font:600 11px var(--mono); text-decoration:none; }
  .dash-link:hover { text-decoration:underline; }
  .dash-chapter { padding:14px 2px 8px; }
  .dash-chapter-top { display:flex; justify-content:space-between; gap:14px; margin-bottom:9px; color:var(--ink-dim); font:12px var(--mono); }
  .dash-chapter-top b { overflow:hidden; color:var(--ink); font:700 13px var(--sans); text-overflow:ellipsis; white-space:nowrap; }
  .dash-bar { height:9px; overflow:hidden; border-radius:999px; background:var(--line); }
  .dash-bar-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .5s ease; }
  .dash-bar-fill.is-low { background:var(--low); } .dash-bar-fill.is-good { background:var(--good); }
  .dash-sub-text { max-height:4.5em; overflow:hidden; margin-top:8px; color:var(--ink-dim); font:12px/1.5 var(--sans); white-space:pre-wrap; }
  .dash-err { padding:18px 0; color:var(--low); font:13px/1.6 var(--mono); }
  .dash-loadbar { width:100%; max-width:260px; height:5px; margin-top:16px; overflow:hidden; border-radius:999px; background:var(--line); }
  .dash-loadbar-fill { width:42%; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--accent), var(--accent-2)); animation:dash-loadbar-slide 1.1s ease-in-out infinite; }
  @keyframes dash-loadbar-slide { 0% { transform:translateX(-120%); } 50% { transform:translateX(85%); } 100% { transform:translateX(260%); } }
  .qz-next { border:0; border-radius:10px; padding:11px 15px; color:#fff; background:var(--accent); font:700 12px var(--mono); cursor:pointer; box-shadow:var(--shadow-soft); }
  .qz-next:hover { filter:brightness(1.08); }

  .dash-rank { flex-shrink:0; width:26px; color:var(--ink-dim); font:700 13px var(--mono); text-align:center; }
  .dash-missed-q { overflow:hidden; color:var(--ink); font:600 13px/1.4 var(--sans); text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

  @media (max-width: 900px) {
    .dash-stats { grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .dash-shell { width:min(100% - 24px, 1180px); padding-top:20px; }
    .dash-topbar { margin-bottom:34px; }
    .dash-head { display:block; }
    .dash-head:after { display:block; margin-top:18px; }
    .dash-stats { grid-template-columns:1fr; gap:10px; margin-bottom:24px; }
    .dash-stat { min-height:0; padding:16px; }
    .dash-filters { flex-direction:column; align-items:stretch; }
    .dash-select, .dash-search { min-width:0; width:100%; }
    .dash-clear { align-self:stretch; }
    .dash-section { padding:18px 16px; border-radius:16px; }
    .dash-row { align-items:flex-start; gap:10px; }
    .dash-score { min-width:72px; padding-top:2px; font-size:11px; }
    .dash-badge { padding:4px 6px; }
    .theme-toggle-label { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="dash-shell">
  <div class="dash-topbar">
    <a class="dash-back" href="/">&larr; Back to teaching.ezznasr.dev</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span>
    </button>
  </div>

  <div id="authgate" style="margin-top:20px;"></div>
  <div id="dashboard" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var key = "master-dashboard-theme";
  var root = document.documentElement;
  var button = document.getElementById("themeToggle");
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  var theme = saved === "dark" || saved === "light" ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function apply(next) {
    theme = next;
    root.setAttribute("data-theme", next);
    if (!button) return;
    var dark = next === "dark";
    button.setAttribute("aria-pressed", String(dark));
    button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    button.querySelector(".theme-toggle-icon").textContent = dark ? "☀" : "☾";
    button.querySelector(".theme-toggle-label").textContent = dark ? "Light mode" : "Dark mode";
  }
  apply(theme);
  if (button) button.addEventListener("click", function () {
    var next = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(key, next); } catch (e) {}
    apply(next);
  });
})();
</script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  "use strict";

  // -- Small helpers (same conventions as student.html) -------------------

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function fmtPct(score, total) {
    if (!total) return "\u2014";
    return Math.round((score / total) * 100) + "%";
  }

  function scoreClass(score, total) {
    if (!total) return "is-mid";
    var pct = score / total;
    if (pct >= 0.8) return "is-good";
    if (pct >= 0.5) return "is-mid";
    return "is-low";
  }

  function isTruthyFlag(v) {
    return v === true || String(v).toUpperCase() === "TRUE";
  }

  function normalizePhone(s) {
    return String(s || "").replace(/[^0-9]/g, "");
  }

  function newestFirst(rows) {
    return (rows || []).slice().reverse();
  }

  function parseQuestions(row) {
    try {
      var parsed = JSON.parse(row.questions_json || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function maskPhone(phone) {
    var digits = normalizePhone(phone);
    if (digits.length <= 4) return digits;
    return "\u2022\u2022\u2022\u2022 " + digits.slice(-4);
  }

  // -- Aggregation (all client-side, over whatever's currently filtered) --

  function aggregateChapters(quizRows) {
    var byChapter = {};
    quizRows.forEach(function (row) {
      parseQuestions(row).forEach(function (q) {
        var chapter = q.chapter || "Unlabeled";
        if (!byChapter[chapter]) byChapter[chapter] = { correct: 0, total: 0 };
        byChapter[chapter].total += 1;
        if (isTruthyFlag(q.is_correct)) byChapter[chapter].correct += 1;
      });
    });
    return Object.keys(byChapter)
      .map(function (chapter) {
        var c = byChapter[chapter];
        return { chapter: chapter, correct: c.correct, total: c.total, pct: c.total ? c.correct / c.total : 0 };
      })
      .sort(function (a, b) { return a.pct - b.pct; });
  }

  // Keyed on lesson + exact question text (per the master plan's decision
  // #3) so identical wording in two different lessons is never merged.
  function aggregateMostMissed(quizRows) {
    var byKey = {};
    quizRows.forEach(function (row) {
      parseQuestions(row).forEach(function (q) {
        var key = (row.lesson || "") + "||" + (q.question || "");
        if (!byKey[key]) {
          byKey[key] = { question: q.question || "(untitled question)", lesson: row.lesson || "", subject: row.subject || "", wrong: 0, total: 0 };
        }
        byKey[key].total += 1;
        if (!isTruthyFlag(q.is_correct)) byKey[key].wrong += 1;
      });
    });
    return Object.keys(byKey)
      .map(function (k) { return byKey[k]; })
      .filter(function (x) { return x.wrong > 0; })
      .sort(function (a, b) { return b.wrong - a.wrong; })
      .slice(0, 15);
  }

  function buildRoster(students, quizRows, subRows) {
    return (students || []).map(function (s) {
      var digits = normalizePhone(s.phone);
      var sq = quizRows.filter(function (r) { return normalizePhone(r.student_id) === digits; });
      var ss = subRows.filter(function (r) { return normalizePhone(r.student_id) === digits; });
      var totalScore = 0, totalMax = 0;
      sq.forEach(function (r) { totalScore += Number(r.score) || 0; totalMax += Number(r.total) || 0; });
      return {
        phone: s.phone,
        digits: digits,
        display_name: s.display_name || digits,
        created_at: s.created_at,
        year: s.year || "",
        quizzes: sq.length,
        avgPct: totalMax ? Math.round((totalScore / totalMax) * 100) + "%" : "\u2014",
        submissions: ss.length,
      };
    }).sort(function (a, b) { return String(a.display_name).localeCompare(String(b.display_name)); });
  }

  // For a given student, which catalog assignments apply to them (their
  // own year's grade-split lessons, plus every year-agnostic one), and
  // whether they've submitted each. Matches on subject+lesson against the
  // Submissions sheet — "lesson" there is the same folder slug the site
  // generates, so this is an exact string match, not fuzzy.
  function assignmentStatusForStudent(rosterEntry, catalog, subRows) {
    var applicable = catalog.filter(function (c) { return !c.year || c.year === rosterEntry.year; });
    var mySubs = subRows.filter(function (r) { return normalizePhone(r.student_id) === rosterEntry.digits; });
    return applicable.map(function (c) {
      var match = mySubs.filter(function (r) { return r.subject === c.subject && r.lesson === c.lesson; });
      match.sort(function (a, b) { return String(a.submitted_time || "").localeCompare(String(b.submitted_time || "")); });
      var latest = match.length ? match[match.length - 1] : null;
      return { subject: c.subject, lesson: c.lesson, year: c.year, submitted: !!latest, date: latest ? latest.date : null };
    }).sort(function (a, b) {
      if (a.submitted !== b.submitted) return a.submitted ? 1 : -1; // not-yet-submitted first
      return (a.subject + a.lesson).localeCompare(b.subject + b.lesson);
    });
  }

  // Aggregate view (no student selected): per catalog lesson, how many of
  // the applicable roster have submitted vs. the size of that pool.
  function assignmentStatusAggregate(roster, catalog, subRows) {
    return catalog.map(function (c) {
      var pool = roster.filter(function (r) { return !c.year || r.year === c.year; });
      var submittedDigits = {};
      subRows.forEach(function (r) {
        if (r.subject === c.subject && r.lesson === c.lesson) submittedDigits[normalizePhone(r.student_id)] = true;
      });
      var submittedCount = pool.filter(function (r) { return submittedDigits[r.digits]; }).length;
      return { subject: c.subject, lesson: c.lesson, year: c.year, submitted: submittedCount, pool: pool.length };
    }).sort(function (a, b) {
      var ar = a.pool ? a.submitted / a.pool : 1, br = b.pool ? b.submitted / b.pool : 1;
      if (ar !== br) return ar - br; // lowest completion first
      return (a.subject + a.lesson).localeCompare(b.subject + b.lesson);
    });
  }

  function distinctSubjects(quizRows, subRows) {
    var set = {};
    quizRows.forEach(function (r) { if (r.subject) set[r.subject] = true; });
    subRows.forEach(function (r) { if (r.subject) set[r.subject] = true; });
    return Object.keys(set).sort();
  }

  // -- Assignment catalog (GitHub tree) --------------------------------
  // Programming-only year folders, e.g.
  // programming/baccalaureate/grade-2-secondary/loops-iteration/assignment.html
  // Any assignment.html NOT under a grade-N-secondary folder (English,
  // Math, and any Programming lesson outside the year split) applies to
  // both years. This is read straight from the live repo tree, so it's
  // always current with zero manifest to maintain.
  var GITHUB_REPO = "EzzNasr/teaching.ezznasr.dev";
  var YEAR_FOLDER_RE = /^grade-(\d+)-secondary$/i;
  // NOTE: assumes grade-1-secondary = "Senior 1", grade-2-secondary =
  // "Senior 2" — flip this map if that's backwards.
  var FOLDER_TO_YEAR = { "grade-1-secondary": "Senior 1", "grade-2-secondary": "Senior 2" };

  function fetchAssignmentCatalog() {
    var branches = ["main", "master"];
    function tryBranch(i) {
      if (i >= branches.length) return Promise.resolve([]);
      var url = "https://api.github.com/repos/" + GITHUB_REPO + "/git/trees/" + branches[i] + "?recursive=1";
      return fetch(url).then(function (resp) {
        if (!resp.ok) return tryBranch(i + 1);
        return resp.json().then(function (data) {
          if (!data || !Array.isArray(data.tree)) return tryBranch(i + 1);
          return parseCatalog(data.tree);
        });
      }).catch(function () { return tryBranch(i + 1); });
    }
    return tryBranch(0);
  }

  function parseCatalog(tree) {
    var catalog = [];
    tree.forEach(function (entry) {
      if (entry.type !== "blob" || !/\/assignment\.html$/.test(entry.path)) return;
      var segments = entry.path.split("/");
      if (segments.length < 3) return; // need at least subject/lesson/assignment.html
      var subject = segments[0];
      var lesson = segments[segments.length - 2];
      var year = null;
      for (var i = 1; i < segments.length - 2; i++) {
        var m = segments[i].match(YEAR_FOLDER_RE);
        if (m) { year = FOLDER_TO_YEAR[segments[i].toLowerCase()] || ("Grade " + m[1]); break; }
      }
      catalog.push({ subject: subject, lesson: lesson, year: year });
    });
    return catalog;
  }

  // -- App state ------------------------------------------------------------

  var STATE = {
    students: [],
    quizRows: [],
    subRows: [],
    catalog: [],        // assignment catalog from GitHub, [] until (if ever) it loads
    catalogError: null,
    filterPhone: "",     // "" = all students
    filterSubject: "",   // "" = all subjects
    filterYear: "",      // "" = all years
    search: "",          // matched against lesson / quiz_title / question text
  };

  function matchesSearch(text) {
    if (!STATE.search) return true;
    return String(text || "").toLowerCase().indexOf(STATE.search.toLowerCase()) !== -1;
  }

  var _yearByDigits = null;
  function studentYearByDigits(digits) {
    if (!_yearByDigits) {
      _yearByDigits = {};
      STATE.students.forEach(function (s) { _yearByDigits[normalizePhone(s.phone)] = s.year || ""; });
    }
    return _yearByDigits[digits] || "";
  }

  function getFilteredQuiz() {
    return STATE.quizRows.filter(function (r) {
      if (STATE.filterPhone && normalizePhone(r.student_id) !== STATE.filterPhone) return false;
      if (STATE.filterSubject && r.subject !== STATE.filterSubject) return false;
      if (STATE.filterYear && studentYearByDigits(normalizePhone(r.student_id)) !== STATE.filterYear) return false;
      if (STATE.search && !(matchesSearch(r.quiz_title) || matchesSearch(r.lesson) || matchesSearch(r.name))) return false;
      return true;
    });
  }

  function getFilteredSubs() {
    return STATE.subRows.filter(function (r) {
      if (STATE.filterPhone && normalizePhone(r.student_id) !== STATE.filterPhone) return false;
      if (STATE.filterSubject && r.subject !== STATE.filterSubject) return false;
      if (STATE.filterYear && studentYearByDigits(normalizePhone(r.student_id)) !== STATE.filterYear) return false;
      if (STATE.search && !(matchesSearch(r.lesson) || matchesSearch(r.name) || matchesSearch(r.text))) return false;
      return true;
    });
  }

  // -- Rendering ------------------------------------------------------------

  function renderOverviewStats() {
    var totalScore = 0, totalMax = 0;
    STATE.quizRows.forEach(function (r) { totalScore += Number(r.score) || 0; totalMax += Number(r.total) || 0; });
    var avgPct = totalMax ? Math.round((totalScore / totalMax) * 100) + "%" : "\u2014";
    return el("div", { class: "dash-stats" }, [
      el("div", { class: "dash-stat" }, [el("b", {}, [String(STATE.students.length)]), el("span", {}, ["Students"])]),
      el("div", { class: "dash-stat" }, [el("b", {}, [String(STATE.quizRows.length)]), el("span", {}, ["Quiz attempts (all-time)"])]),
      el("div", { class: "dash-stat" }, [el("b", {}, [avgPct]), el("span", {}, ["Average score (all-time)"])]),
      el("div", { class: "dash-stat" }, [el("b", {}, [String(STATE.subRows.length)]), el("span", {}, ["Submissions (all-time)"])]),
    ]);
  }

  function renderFilters(onChange) {
    var roster = buildRoster(STATE.students, STATE.quizRows, STATE.subRows);
    var subjects = distinctSubjects(STATE.quizRows, STATE.subRows);

    var studentSelect = el("select", { class: "dash-select" }, [el("option", { value: "" }, ["All students"])]);
    roster.forEach(function (r) {
      var opt = el("option", { value: r.digits }, [r.display_name]);
      if (r.digits === STATE.filterPhone) opt.setAttribute("selected", "selected");
      studentSelect.appendChild(opt);
    });
    studentSelect.addEventListener("change", function () { STATE.filterPhone = studentSelect.value; onChange(); });

    var subjectSelect = el("select", { class: "dash-select" }, [el("option", { value: "" }, ["All subjects"])]);
    subjects.forEach(function (s) {
      var opt = el("option", { value: s }, [s]);
      if (s === STATE.filterSubject) opt.setAttribute("selected", "selected");
      subjectSelect.appendChild(opt);
    });
    subjectSelect.addEventListener("change", function () { STATE.filterSubject = subjectSelect.value; onChange(); });

    var yearSelect = el("select", { class: "dash-select" }, [
      el("option", { value: "" }, ["All years"]),
      el("option", { value: "Senior 1" }, ["Senior 1"]),
      el("option", { value: "Senior 2" }, ["Senior 2"]),
    ]);
    yearSelect.value = STATE.filterYear;
    yearSelect.addEventListener("change", function () { STATE.filterYear = yearSelect.value; onChange(); });

    var searchInput = el("input", { class: "dash-search", type: "search", placeholder: "Search lesson, quiz, question\u2026" });
    searchInput.value = STATE.search;
    searchInput.addEventListener("input", function () { STATE.search = searchInput.value; onChange(); });

    var clearBtn = el("button", { class: "dash-clear", type: "button" }, ["Clear filters"]);
    clearBtn.addEventListener("click", function () {
      STATE.filterPhone = ""; STATE.filterSubject = ""; STATE.filterYear = ""; STATE.search = "";
      onChange();
    });

    return el("div", { class: "dash-filters" }, [
      el("label", {}, ["Student", studentSelect]),
      el("label", {}, ["Subject", subjectSelect]),
      el("label", {}, ["Year", yearSelect]),
      el("label", {}, ["Search", searchInput]),
      clearBtn,
    ]);
  }

  function renderRoster(onChange) {
    var roster = buildRoster(STATE.students, STATE.quizRows, STATE.subRows);
    var section = el("div", { class: "dash-section" }, [el("h2", {}, ["Roster"])]);
    if (!roster.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No registered students yet."]));
      return section;
    }
    roster.forEach(function (r) {
      var rowClass = "dash-row is-clickable" + (STATE.filterPhone === r.digits ? " is-selected" : "");
      var row = el("div", { class: rowClass }, [
        el("div", { class: "dash-row-main" }, [
          el("div", { class: "dash-row-title" }, [r.display_name]),
          el("div", { class: "dash-row-sub" }, [maskPhone(r.phone) + (r.created_at ? " \u00b7 joined " + r.created_at : "")]),
        ]),
        el("div", { class: "dash-badge" }, [r.year || "no year on file"]),
        el("div", { class: "dash-badge" }, [r.quizzes + " quiz" + (r.quizzes === 1 ? "" : "zes")]),
        el("div", { class: "dash-score " + (r.avgPct === "\u2014" ? "is-mid" : "") }, [r.avgPct]),
        el("div", { class: "dash-badge" }, [r.submissions + " sub" + (r.submissions === 1 ? "" : "s")]),
      ]);
      row.addEventListener("click", function () {
        STATE.filterPhone = (STATE.filterPhone === r.digits) ? "" : r.digits;
        onChange();
      });
      section.appendChild(row);
    });
    return section;
  }

  function renderAssignmentCompletion() {
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Assignment completion"]),
      el("div", { class: "dash-section-note" }, [
        "Programming lessons under a grade-N-secondary folder count only toward that year; " +
        "everything else (English, Math, and any ungrouped Programming lesson) counts toward both. " +
        "Catalog is read live from GitHub, so a lesson with zero submissions still shows up."
      ]),
    ]);

    if (STATE.catalogError) {
      section.appendChild(el("div", { class: "dash-empty" }, [
        "Couldn't load the assignment catalog from GitHub (" + STATE.catalogError + ") \u2014 completion tracking is unavailable this load. Quiz/submission history above is unaffected."
      ]));
      return section;
    }
    if (!STATE.catalog.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No assignment.html files found in the repo \u2014 check GITHUB_REPO/branch in master.html if this looks wrong."]));
      return section;
    }

    var roster = buildRoster(STATE.students, STATE.quizRows, STATE.subRows);
    var subjectFilter = STATE.filterSubject;
    var catalog = STATE.catalog.filter(function (c) { return !subjectFilter || c.subject === subjectFilter; });

    if (STATE.filterPhone) {
      var rosterEntry = roster.filter(function (r) { return r.digits === STATE.filterPhone; })[0];
      if (!rosterEntry) { section.appendChild(el("div", { class: "dash-empty" }, ["Student not found."])); return section; }
      if (!rosterEntry.year) {
        section.appendChild(el("div", { class: "dash-empty" }, [rosterEntry.display_name + " doesn't have a year on file yet, so year-restricted assignments can't be matched \u2014 only year-agnostic ones are shown below."]));
      }
      var perStudent = assignmentStatusForStudent(rosterEntry, catalog, STATE.subRows);
      if (!perStudent.length) {
        section.appendChild(el("div", { class: "dash-empty" }, ["No applicable assignments found for this filter."]));
        return section;
      }
      perStudent.forEach(function (a) {
        section.appendChild(el("div", { class: "dash-row" }, [
          el("div", { class: "dash-row-main" }, [
            el("div", { class: "dash-row-title" }, [a.lesson]),
            el("div", { class: "dash-row-sub" }, [a.subject + (a.year ? " \u00b7 " + a.year : " \u00b7 both years")]),
          ]),
          el("div", { class: "dash-score " + (a.submitted ? "is-good" : "is-low") }, [a.submitted ? ("Submitted" + (a.date ? " \u00b7 " + a.date : "")) : "Not yet"]),
        ]));
      });
      return section;
    }

    // Aggregate view — respects the year filter too, but only to narrow
    // which lessons are shown, not to change the roster pool per lesson
    // (that's still each lesson's own applicable-year pool).
    var aggregate = assignmentStatusAggregate(roster, catalog, STATE.subRows)
      .filter(function (a) { return !STATE.filterYear || !a.year || a.year === STATE.filterYear; });
    if (!aggregate.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No applicable assignments found for this filter."]));
      return section;
    }
    aggregate.forEach(function (a) {
      var pct = a.pool ? a.submitted / a.pool : 1;
      var barClass = pct >= 0.8 ? "is-good" : (pct < 0.5 ? "is-low" : "");
      section.appendChild(el("div", { class: "dash-chapter" }, [
        el("div", { class: "dash-chapter-top" }, [
          el("b", {}, [a.lesson]),
          document.createTextNode(a.subject + (a.year ? " \u00b7 " + a.year : " \u00b7 both years") + " \u00b7 " + a.submitted + "/" + a.pool),
        ]),
        el("div", { class: "dash-bar" }, [
          el("div", { class: "dash-bar-fill " + barClass, style: "width:" + Math.max(3, Math.round(pct * 100)) + "%" }),
        ]),
      ]));
    });
    return section;
  }

  function renderMostMissed(quizRows) {
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["Most missed questions"]),
      el("div", { class: "dash-section-note" }, ["Ranked by wrong-answer count \u2014 respects the filters above."]),
    ]);
    var ranked = aggregateMostMissed(quizRows);
    if (!ranked.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No missed questions in the current view."]));
      return section;
    }
    ranked.forEach(function (q, i) {
      section.appendChild(el("div", { class: "dash-row" }, [
        el("div", { class: "dash-rank" }, [String(i + 1)]),
        el("div", { class: "dash-row-main" }, [
          el("div", { class: "dash-missed-q" }, [q.question]),
          el("div", { class: "dash-row-sub" }, [(q.subject || "") + (q.lesson ? " \u00b7 " + q.lesson : "")]),
        ]),
        el("div", { class: "dash-score is-low" }, [q.wrong + "/" + q.total + " missed"]),
      ]));
    });
    return section;
  }

  function renderChapterSection(quizRows) {
    var section = el("div", { class: "dash-section" }, [
      el("h2", {}, ["By chapter"]),
      el("div", { class: "dash-section-note" }, ["Aggregated across the current view."]),
    ]);
    var chapters = aggregateChapters(quizRows);
    if (!chapters.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No chapter-tagged questions in the current view."]));
      return section;
    }
    chapters.forEach(function (c) {
      var pctLabel = Math.round(c.pct * 100) + "%";
      var barClass = c.pct >= 0.8 ? "is-good" : (c.pct < 0.5 ? "is-low" : "");
      section.appendChild(el("div", { class: "dash-chapter" }, [
        el("div", { class: "dash-chapter-top" }, [
          el("b", {}, [c.chapter]),
          document.createTextNode(c.correct + "/" + c.total + " \u00b7 " + pctLabel),
        ]),
        el("div", { class: "dash-bar" }, [
          el("div", { class: "dash-bar-fill " + barClass, style: "width:" + Math.max(3, Math.round(c.pct * 100)) + "%" }),
        ]),
      ]));
    });
    return section;
  }

  function renderQuizSection(quizRows) {
    var section = el("div", { class: "dash-section" }, [el("h2", {}, ["Quiz attempts"])]);
    if (!quizRows.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No quiz attempts match the current filters."]));
      return section;
    }
    newestFirst(quizRows).forEach(function (r) {
      var score = Number(r.score) || 0, total = Number(r.total) || 0;
      section.appendChild(el("div", { class: "dash-row" }, [
        el("div", { class: "dash-row-main" }, [
          el("div", { class: "dash-row-title" }, [(r.name || "Unknown") + " \u2014 " + (r.quiz_title || r.lesson || "Quiz")]),
          el("div", { class: "dash-row-sub" }, [(r.subject || "") + (r.lesson ? " \u00b7 " + r.lesson : "") + (r.date ? " \u00b7 " + r.date : "")]),
        ]),
        el("div", { class: "dash-score " + scoreClass(score, total) }, [score + "/" + total + " (" + fmtPct(score, total) + ")"]),
      ]));
    });
    return section;
  }

  function renderSubmissionsSection(subRows) {
    var section = el("div", { class: "dash-section" }, [el("h2", {}, ["Submissions"])]);
    if (!subRows.length) {
      section.appendChild(el("div", { class: "dash-empty" }, ["No submissions match the current filters."]));
      return section;
    }
    newestFirst(subRows).forEach(function (r) {
      var main = el("div", { class: "dash-row-main" }, [
        el("div", { class: "dash-row-title" }, [(r.name || "Unknown") + " \u2014 " + (r.lesson || "Assignment")]),
        el("div", { class: "dash-row-sub" }, [(r.subject || "") + (r.date ? " \u00b7 " + r.date : "")]),
      ]);
      if (r.submission_type === "text" && r.text) {
        var truncNote = isTruthyFlag(r.text_truncated) ? " (preview only \u2014 full text saved)" : "";
        main.appendChild(el("div", { class: "dash-sub-text" }, [r.text + truncNote]));
      }
      var row = el("div", { class: "dash-row" }, [main, el("div", { class: "dash-badge" }, [r.submission_type || ""])]);
      if (r.submission_type === "url" && r.url) {
        row.insertBefore(el("a", { class: "dash-link", href: r.url, target: "_blank", rel: "noopener" }, ["Open link"]), row.lastChild);
      }
      if (r.submission_type === "file" && r.file_id) {
        row.insertBefore(el("a", { class: "dash-link", href: "https://drive.google.com/file/d/" + r.file_id + "/view", target: "_blank", rel: "noopener" }, ["Open file"]), row.lastChild);
      }
      section.appendChild(row);
    });
    return section;
  }

  function renderDashboard(session) {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;

    root.appendChild(el("div", { class: "dash-head" }, [
      el("div", {}, [
        el("h1", {}, ["Master dashboard"]),
        el("p", {}, ["Signed in as " + (session.student_name || "admin") + " \u2014 every student's quiz history and submissions."]),
      ]),
    ]));

    root.appendChild(renderOverviewStats());

    var below = el("div", {}, []);
    root.appendChild(el("div", { id: "dash-filters-slot" }, []));
    root.appendChild(below);

    function rerenderFiltered() {
      var filteredQuiz = getFilteredQuiz();
      var filteredSubs = getFilteredSubs();
      below.innerHTML = "";
      below.appendChild(renderAssignmentCompletion());
      below.appendChild(renderMostMissed(filteredQuiz));
      below.appendChild(renderChapterSection(filteredQuiz));
      below.appendChild(renderQuizSection(filteredQuiz));
      below.appendChild(renderSubmissionsSection(filteredSubs));
    }

    function rerenderAll() {
      var slot = document.getElementById("dash-filters-slot");
      slot.innerHTML = "";
      slot.appendChild(renderRoster(rerenderAll));
      slot.appendChild(renderFilters(rerenderFiltered));
      rerenderFiltered();
    }

    rerenderAll();
  }

  function renderError(message) {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-err" }, [message]));
  }

  function renderNeedsRelogin() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    var btn = el("button", { class: "qz-next", type: "button" }, ["Log out & sign in again \u2192"]);
    btn.addEventListener("click", function () {
      window.AuthEngine.clearSession();
      location.reload();
    });
    root.appendChild(el("div", { class: "dash-err" }, [
      "Your saved sign-in is missing a session token \u2014 this happens once, for anyone " +
      "who logged in before the dashboard system existed. Log in again to fix it (your " +
      "phone/password stay the same, this just refreshes your session)."
    ]));
    root.appendChild(btn);
  }

  function renderLoading() {
    var root = document.getElementById("dashboard");
    root.innerHTML = "";
    root.hidden = false;
    root.appendChild(el("div", { class: "dash-empty", style: "padding-top:0;" }, ["Loading the master dashboard\u2026"]));
    root.appendChild(el("div", { class: "dash-loadbar" }, [el("div", { class: "dash-loadbar-fill" })]));
  }

  window.AuthEngine.mount("#authgate", function (session) {
    document.getElementById("authgate").remove();
    if (!session.session_token) {
      renderNeedsRelogin();
      return;
    }
    renderLoading();
    Promise.all([
      window.AuthEngine.adminGetAll(session),
      fetchAssignmentCatalog().catch(function (err) { STATE.catalogError = (err && err.message) || "network error"; return []; }),
    ])
      .then(function (results) {
        var data = results[0];
        STATE.students = data.students || [];
        STATE.quizRows = data.quiz_results || [];
        STATE.subRows = data.submissions || [];
        STATE.catalog = results[1];
        renderDashboard(session);
      })
      .catch(function (err) {
        var msg = (err && err.message) || "Couldn't load the master dashboard. Try refreshing.";
        if (msg === "Not authorized.") {
          msg = "This account is signed in, but doesn't have admin access. Set is_admin = TRUE on this row in the Students sheet to use this dashboard.";
        }
        renderError(msg);
      });
  });
})();
</script>
</body>
</html>
