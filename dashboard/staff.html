<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- SEO:START (generated by tools/seo/seo_build.py - edit tools/seo/seo_config.json, not this block) -->
<meta name="robots" content="noindex, nofollow">
<!-- SEO:END -->
<title>شغل المساعد — Teaching Portal</title>
<link rel="icon" href="/icons/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/followup.css">
<script src="/assets/theme.js" defer></script>
<style>
  .sh-hello{margin:56px 0 4px;font-size:26px;font-weight:800;line-height:1.3}
  .sh-sub{margin:0 0 18px;color:var(--fu-dim)}
  .sh-cards{display:grid;gap:14px}
  .sh-card{display:block;text-decoration:none;color:var(--fu-ink)!important;background:var(--fu-card);border:1px solid var(--fu-line);border-radius:var(--fu-r);padding:18px;box-shadow:var(--fu-shadow);position:relative}
  .sh-card:active{transform:scale(.99)}
  .sh-card:focus-visible{outline:3px solid var(--fu-teal);outline-offset:2px}
  .sh-ico{font-size:30px;line-height:1}
  .sh-t{margin:8px 0 2px;font-size:21px;font-weight:800}
  .sh-d{margin:0;color:var(--fu-dim);font-size:15px}
  .sh-steps{margin:10px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--fu-dim)}
  .sh-steps li{padding:2px 0}
  .sh-go{display:inline-block;margin-top:12px;background:var(--fu-teal);color:#fff;border-radius:14px;padding:10px 18px;font-weight:700;min-height:var(--fu-tap);line-height:28px}
  html[data-theme="dark"] .sh-go{color:#04211f}
  .sh-badge{position:absolute;top:14px;inset-inline-end:14px;background:var(--fu-warn-bg);color:var(--fu-warn);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
  .sh-badge.ok{background:var(--fu-ok-bg);color:var(--fu-ok)}
  .sh-foot{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0;font-size:15px}
  .sh-foot a,.sh-foot button{background:none;border:1px solid var(--fu-line);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:44px;color:var(--fu-ink);text-decoration:none;font-weight:600}
</style>
</head>
<body class="fu">

<header class="fu-top">
  <div class="fu-top-row">
    <h1 class="fu-title">الرئيسية</h1>
    <button class="fu-ibtn" id="theme-toggle" type="button" aria-label="الوضع الداكن" aria-pressed="false"><span class="theme-icon" aria-hidden="true"></span></button>
  </div>
</header>

<main class="fu-wrap">
  <div id="authgate"></div>
  <div id="sh-root" aria-live="polite"></div>
</main>

<script>
(function () {
  "use strict";
  var root = document.getElementById("sh-root");

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function loadScript(src) {
    return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("لم يتم تحميل " + src)); }; document.head.appendChild(s); });
  }
  function firstName(n) { return String(n || "").trim().split(/\s+/)[0] || ""; }

  function card(href, ico, title, desc, steps, cta) {
    var ul = el("ul", { class: "sh-steps" }, steps.map(function (s) { return el("li", { text: s }); }));
    var badge = el("span", { class: "sh-badge", hidden: "hidden" });
    var a = el("a", { class: "sh-card", href: href }, [
      badge, el("div", { class: "sh-ico", "aria-hidden": "true", text: ico }),
      el("h2", { class: "sh-t", text: title }), el("p", { class: "sh-d", text: desc }), ul,
      el("span", { class: "sh-go", text: cta })
    ]);
    a._badge = badge;
    return a;
  }

  function start(session, role) {
    root.textContent = "";
    root.appendChild(el("h2", { class: "sh-hello", text: "أهلاً " + firstName(session.student_name) + " 👋" }));
    root.appendChild(el("p", { class: "sh-sub", text: "اختار اللي عايز تعمله. كل حاجة هنا بتتحفظ لوحدها." }));

    var follow = card("followup.html", "📋", "متابعة الطلاب",
      "الحضور، الواجبات، ورسائل أولياء الأمور.",
      ["١. اختار الجروب", "٢. علّم الحضور", "٣. ابعت رسالة لولي الأمر بضغطة"], "افتح المتابعة ←");
    var grade = card("grading.html", "✍️", "تصحيح الإجابات",
      "إجابات الطلاب المكتوبة اللي مستنية درجة.",
      ["١. شوف صورة إجابة الطالب", "٢. قارنها بالإجابة النموذجية", "٣. اكتب الدرجة واحفظ"], "ابدأ التصحيح ←");
    root.appendChild(el("div", { class: "sh-cards" }, [follow, grade]));

    var foot = el("div", { class: "sh-foot" });
    if (role === "admin") foot.appendChild(el("a", { href: "master.html", text: "لوحة المدرّس" }));
    foot.appendChild(el("a", { href: "student.html?view=student", text: "صفحتي كطالب" }));
    foot.appendChild(el("button", { type: "button", id: "sh-out", text: "تسجيل خروج" }));
    root.appendChild(foot);
    document.getElementById("sh-out").addEventListener("click", function () { window.AuthEngine.clearSession(); location.reload(); });

    // Live "waiting for marks" count. Best effort: a failure just leaves the badge off.
    window.AuthEngine.adminCall(session, { action: "admin_grading_queue", status: "pending" }).then(function (r) {
      var n = r && r.counts ? r.counts.pending : (r && r.items ? r.items.length : null);
      if (n === null || n === undefined) return;
      grade._badge.hidden = false;
      if (n > 0) grade._badge.textContent = n + " مستني";
      else { grade._badge.textContent = "خلصت ✓"; grade._badge.className += " ok"; }
    }, function () {});
  }

  function boot() {
    root.appendChild(el("span", { class: "fu-dim", text: "جاري التحقق من تسجيل الدخول…" }));
    loadScript("/assets/auth.js").then(function () { return loadScript("/assets/staff-guard.js"); }).then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
        if (!session.session_token) {
          root.textContent = "";
          root.appendChild(el("p", { text: "تسجيل الدخول المحفوظ ناقصه رمز الجلسة. ادخل تاني." }));
          root.appendChild(el("button", { class: "fu-btn primary", type: "button", text: "سجّل خروج وادخل تاني ←" }));
          root.lastChild.addEventListener("click", function () { window.AuthEngine.clearSession(); location.reload(); });
          return;
        }
        // Convenience only: the server re-checks every call. Students are sent to their own dashboard.
        window.StaffGuard.require(["admin", "assistant"], session).then(function (role) { if (role) start(session, role); });
      }, { staff: true });
    }, function (e) { root.textContent = e.message; });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
