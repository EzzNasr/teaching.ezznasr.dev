<style>
  .rv-big{font-size:40px;font-weight:800;line-height:1.15;margin:6px 0 0}
  .rv-big small{font-size:18px;font-weight:700;color:var(--fu-dim)}
  .rv-cmp{color:var(--fu-dim);font-size:15px;margin:4px 0 0}
  .rv-cmp b{color:var(--fu-ink)}
  .rv-up{color:var(--fu-ok)!important} .rv-down{color:var(--fu-bad)!important}
  .rv-rule{font-size:14px;color:var(--fu-dim);line-height:1.7;margin:0 0 14px;border-inline-start:3px solid var(--fu-line);padding:2px 10px}
  .rv-kpis a{color:inherit;text-decoration:none;display:block}
  .rv-seg{grid-template-columns:1fr 1fr 1fr;margin:10px 0}
  .rv-month{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px}
  .rv-month select{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--fu-line);background:var(--fu-soft);color:var(--fu-ink);font:inherit;padding:4px 10px}
  .rv-list{list-style:none;margin:0;padding:0}
  .rv-row{padding:10px 0;border-bottom:1px dashed var(--fu-line)}
  .rv-row:last-child{border-bottom:0}
  .rv-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rv-name{font-weight:700;min-width:0;overflow-wrap:anywhere}
  .rv-amt{font-weight:800;white-space:nowrap}
  .rv-sub{font-size:13.5px;color:var(--fu-dim)}
  .rv-bar{height:6px;border-radius:6px;background:var(--fu-soft);margin-top:6px;overflow:hidden}
  .rv-bar i{display:block;height:100%;background:var(--fu-teal);border-radius:6px}
  .rv-total{display:flex;justify-content:space-between;font-weight:800;padding-top:10px;border-top:2px solid var(--fu-line);margin-top:4px}
  .rv-price{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .rv-price input{flex:1 1 120px;min-width:0;min-height:var(--fu-tap);border-radius:12px;border:1px solid var(--fu-line);background:var(--fu-soft);color:var(--fu-ink);font:700 18px 'Cairo',sans-serif;padding:4px 12px;direction:ltr;text-align:start}
  .rv-price .fu-btn{width:auto;flex:0 0 auto}
  .rv-msg{min-height:1.4em;font-size:14.5px;margin-top:8px}
  .rv-msg.ok{color:var(--fu-ok)} .rv-msg.err{color:var(--fu-bad)}
  .rv-warn{background:var(--fu-warn-bg);color:var(--fu-warn);border-radius:14px;padding:12px;margin-top:12px;font-size:15px;line-height:1.7}
  .rv-warn .fu-btn{margin-top:8px;border-color:var(--fu-warn);color:var(--fu-warn);background:transparent}
  .rv-more{display:block;text-align:center;padding:14px;color:var(--fu-teal);font-weight:700;text-decoration:none}
  .rv-state{padding:24px 4px;color:var(--fu-dim);text-align:center}
  .rv-state.err{color:var(--fu-bad)}
  .rv-nav{max-width:720px;margin:6px auto 12px;padding:0 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .rv-nav::-webkit-scrollbar{display:none}
  .rv-nav a{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--fu-line);color:var(--fu-dim);text-decoration:none;font-size:14px;font-weight:700;background:var(--fu-card)}
  .rv-nav a[aria-current=page]{background:var(--fu-teal);border-color:var(--fu-teal);color:#fff}
  .rv-stamp{color:var(--fu-dim);font-size:13px;margin:2px 0 0}

<script src="/assets/staff-guard.js"></script>
<script>
(function () {
  "use strict";
  var MOCK = /[?&]mock=1\b/.test(location.search);
  var root = document.getElementById("rv-root");
  var S = { session: null, data: null, view: "item", month: null, titles: {}, busy: false, draftPrice: null };
  // Arabic / English (assets/i18n.js): plain text is translated where it is written; money, counts and months are built with t().
  var I = window.I18n || { t: function (s, v) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { return v && v[k] != null ? v[k] : m; }); }, lang: function () { return "ar"; }, month: null, onChange: function () {} };
  var t = I.t;

  // Every value goes through textContent. Nothing from the server is ever parsed as HTML.
  function el(tag, attrs, kids) {
    var n = document.createElement(tag); attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

  // ---------- words ----------
  var MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  function monthName(ym) { var m = /^(\d{4})-(\d{2})$/.exec(ym || ""); return m ? (I.month ? I.month(+m[2] - 1) : MONTHS[+m[2] - 1]) + " " + m[1] : t("تاريخ مش معروف"); }
  function money(n) { return t("{0} جنيه", [Math.round(n || 0).toLocaleString("en-US")]); }
  function payments(n) {
    if (I.lang() === "en") return n === 1 ? "1 payment" : n + " payments";
    return n === 1 ? "دفعة واحدة" : n === 2 ? "دفعتين" : n + (n >= 3 && n <= 10 ? " دفعات" : " دفعة");
  }
  var GRADE = { "1": "أولى ثانوي", "2": "تانية ثانوي", "3": "تالتة ثانوي" };
  function itemName(kind, item) {
    var m = /^g(\w+)-(ch|t)(\d+)$/.exec(item || "");
    var year = m ? (GRADE[m[1]] ? t(GRADE[m[1]]) : t("سنة {0}", [m[1]])) : "";
    if (kind === "chapter" && m) return year + " · " + t("اشتراك الفصل {0}", [m[3]]);
    if (kind === "term" && m) return year + " · " + t("اشتراك الترم {0}", [m[3]]);
    if (kind === "lesson") {
      if (S.titles[item]) return S.titles[item];
      var last = String(item || "").split("/").pop() || t("درس");
      return last.replace(/-/g, " ");
    }
    return String(item || t("حاجة تانية"));
  }

  // ---------- API (real: AuthEngine.adminCall; mock: window.__REV_MOCK(payload) or the built-in sample) ----------
  function api(payload) {
    return new Promise(function (resolve) {
      if (MOCK) resolve(typeof window.__REV_MOCK === "function" ? window.__REV_MOCK(payload) : mockApi(payload));
      else if (!window.AuthEngine) throw new Error("صفحة الدخول ما اتحمّلتش. اعمل تحديث للصفحة.");
      else resolve(window.AuthEngine.adminCall(S.session, payload));
    }).then(function (r) {
      if (!r || r.ok === false) throw new Error(friendly(r && r.error));
      return r;
    });
  }
  function friendly(m) {
    m = String(m || "");
    if (m === "Not authorized.") return "الصفحة دي لصاحب الموقع بس.";
    if (/Unknown action|Not implemented yet/.test(m)) return "السيرفر لسه ما اتحدّثش بصفحة الإيرادات. محتاج تنزّل نسخة جديدة من السكريبت (Revenue.gs + Code.gs).";
    if (/lesson price as a number/.test(m)) return "اكتب سعر الدرس رقم بالجنيه، مثلاً 50.";
    if (/Set the lesson price first/.test(m)) return "حدّد سعر الدرس الأول.";
    return m || "حصلت مشكلة. جرّب تاني.";
  }

  // ---------- one table pivot: rows [{month, kind, item, group, amount, count, unpriced}] ----------
  function monthsIn(d) {
    var seen = {}; (d.rows || []).forEach(function (r) { if (r.month) seen[r.month] = true; });
    seen[d.this_month] = true; seen[d.last_month] = true;
    return Object.keys(seen).sort().reverse();
  }
  function groupBy(rows, keyOf, nameOf) {
    var acc = {};
    rows.forEach(function (r) {
      var k = keyOf(r), a = acc[k] || (acc[k] = { key: k, name: nameOf(r), amount: 0, count: 0, unpriced: 0 });
      a.amount += r.amount || 0; a.count += r.count || 0; a.unpriced += r.unpriced || 0;
    });
    return Object.keys(acc).map(function (k) { return acc[k]; });
  }
  function breakdown(d) {
    var rows = d.rows || [];
    if (S.view === "month") {
      var list = groupBy(rows, function (r) { return r.month; }, function (r) { return monthName(r.month); });
      return list.sort(function (a, b) { return a.key < b.key ? 1 : -1; });
    }
    if (S.month) rows = rows.filter(function (r) { return r.month === S.month; });
    var out = S.view === "group"
      ? groupBy(rows, function (r) { return r.group || ""; }, function (r) { return r.group || t("من غير جروب"); })
      : groupBy(rows, function (r) { return r.kind + "|" + r.item; }, function (r) { return itemName(r.kind, r.item); });
    return out.sort(function (a, b) { return b.amount - a.amount || b.count - a.count; });
  }

  // ---------- view ----------
  function hero(d) {
    var t = d.totals, now = t.this_month.amount, prev = t.last_month.amount;
    var cmp = el("p", { class: "rv-cmp" });
    if (prev > 0 || now > 0) {
      var diff = now - prev;
      cmp.appendChild(document.createTextNode("الشهر اللي فات (" + monthName(d.last_month) + "): "));
      cmp.appendChild(el("b", { text: money(prev) }));
      if (prev > 0 && diff !== 0) cmp.appendChild(el("span", { class: diff > 0 ? "rv-up" : "rv-down", text: " (" + (diff > 0 ? "▲ زيادة " : "▼ أقل بـ ") + money(Math.abs(diff)) + ")" }));
    }
    return el("section", { class: "fu-card fu-hero", id: "rv-hero" }, [
      el("p", { class: "fu-hero-sub", style: "margin:0", text: "إيرادات " + monthName(d.this_month) }),
      el("p", { class: "rv-big", id: "rv-now" }, [money(now)]),
      el("p", { class: "rv-cmp", text: payments(t.this_month.count) + " متوافق عليها لحد دلوقتي" }),
      cmp
    ]);
  }
  function kpis(d) {
    var t = d.totals;
    return el("div", { class: "fu-kpis rv-kpis" }, [
      el("a", { class: "fu-kpi" + (t.pending.count ? " bad" : ""), href: "access.html", id: "rv-pending" }, [
        el("b", { text: t.pending.count ? payments(t.pending.count) : "مفيش" }),
        el("span", { text: "مستنية موافقتك" + (t.pending.amount ? " (" + money(t.pending.amount) + ")" : "") + " ←" })
      ]),
      el("div", { class: "fu-kpi", id: "rv-all" }, [el("b", { text: money(t.all_time.amount) }), el("span", { text: "من الأول (" + payments(t.all_time.count) + ")" })])
    ]);
  }
  function breakdownCard(d) {
    var card = el("section", { class: "fu-card", id: "rv-break" }, [el("h3", { text: "الفلوس جاية منين؟" })]);
    var seg = el("div", { class: "fu-seg rv-seg", role: "radiogroup", "aria-label": "قسّم حسب" });
    [["item", "حسب الدرس"], ["month", "حسب الشهر"], ["group", "حسب الجروب"]].forEach(function (v) {
      seg.appendChild(el("button", { type: "button", role: "radio", "data-view": v[0], "aria-checked": String(S.view === v[0]), text: v[1],
        on: { click: function () { S.view = v[0]; render(); } } }));
    });
    card.appendChild(seg);
    if (S.view !== "month") {
      var sel = el("select", { id: "rv-month", "aria-label": "الشهر", on: { change: function (e) { S.month = e.target.value; render(); } } });
      sel.appendChild(el("option", { value: "", text: "من الأول" }));
      monthsIn(d).forEach(function (m) { var o = el("option", { value: m, text: monthName(m) + (m === d.this_month ? " (الشهر ده)" : "") }); if (m === S.month) o.selected = true; sel.appendChild(o); });
      if (!S.month) sel.firstChild.selected = true;
      card.appendChild(el("label", { class: "rv-month" }, ["الشهر:", sel]));
    }
    var list = breakdown(d), max = list.reduce(function (m, x) { return Math.max(m, x.amount); }, 0);
    var ul = el("ul", { class: "rv-list", id: "rv-list" });
    if (!list.length) ul.appendChild(el("li", { class: "rv-state", text: "مفيش دفعات متوافق عليها في الفترة دي." }));
    list.forEach(function (x) {
      var sub = payments(x.count) + (x.unpriced ? " · منهم " + x.unpriced + " من غير مبلغ" : "");
      ul.appendChild(el("li", { class: "rv-row" }, [
        el("div", { class: "rv-line" }, [el("span", { class: "rv-name", translate: "no", text: x.name }), el("span", { class: "rv-amt", text: money(x.amount) })]),
        el("div", { class: "rv-sub", text: sub }),
        el("div", { class: "rv-bar", "aria-hidden": "true" }, [el("i", { style: "width:" + (max ? Math.max(2, Math.round(100 * x.amount / max)) : 0) + "%" })])
      ]));
    });
    card.appendChild(ul);
    if (list.length > 1) {
      var sum = list.reduce(function (s, x) { return s + x.amount; }, 0), cnt = list.reduce(function (s, x) { return s + x.count; }, 0);
      card.appendChild(el("div", { class: "rv-total" }, [el("span", { text: "المجموع (" + payments(cnt) + ")" }), el("span", { class: "rv-amt", text: money(sum) })]));
    }
    return card;
  }
  function priceCard(d) {
    var msg = el("div", { class: "rv-msg", role: "status" });
    var input = el("input", { type: "number", inputmode: "decimal", min: "1", step: "1", id: "rv-price", "aria-label": "سعر الدرس بالجنيه", placeholder: "مثلاً 50" });
    if (S.draftPrice !== null) input.value = S.draftPrice; else if (d.lesson_price) input.value = String(d.lesson_price);
    input.addEventListener("input", function () { S.draftPrice = input.value; });   // kept when the page is re-drawn (language switch)
    var save = el("button", { class: "fu-btn primary", type: "button", id: "rv-price-save", text: "احفظ السعر" });
    function say(t, k) { msg.textContent = t || ""; msg.className = "rv-msg" + (k ? " " + k : ""); }
    save.addEventListener("click", function () {
      var v = String(input.value || "").trim();
      if (!v) { say("اكتب سعر الدرس.", "err"); input.focus(); return; }
      save.disabled = true; say("");
      api({ action: "admin_revenue_set_price", price: v }).then(function (r) {
        save.disabled = false; S.draftPrice = null; S.flash = "اتحفظ: سعر الدرس " + money(r.price) + ". أي دفعة درس جديدة هتتسجّل بالسعر ده.";
        return load();
      }, function (e) { save.disabled = false; say(e.message, "err"); });
    });
    var card = el("section", { class: "fu-card", id: "rv-price-card" }, [
      el("h3", { text: "سعر الدرس الواحد" }),
      el("p", { class: "fu-hint", style: "margin:4px 0 0", text: d.lesson_price
        ? "الطالب اللي بيدفع درس واحد من الموقع بيتسجّل له " + money(d.lesson_price) + ". تغيير السعر بيأثر على الدفعات الجديدة بس."
        : "لسه ما حددتش سعر الدرس، فدفعات الدروس الواحدة مش داخلة في الإيرادات. الاشتراكات (فصل / ترم) محسوبة بسعرها." }),
      el("div", { class: "rv-price" }, [input, save]), msg
    ]);
    if (S.flash) { say(S.flash, "ok"); S.flash = ""; }
    var u = d.unpriced || {};
    if (u.fillable > 0) {
      var box = el("div", { class: "rv-warn", id: "rv-fill" }, [
        el("div", { text: "فيه " + payments(u.fillable) + " لدروس قديمة من غير مبلغ، فمش داخلين في الحساب." })
      ]);
      if (d.lesson_price) {
        var fill = el("button", { class: "fu-btn", type: "button", id: "rv-fill-go", text: "احسبهم بسعر النهارده (" + u.fillable + " × " + money(d.lesson_price) + ")" });
        fill.addEventListener("click", function () {
          if (!window.confirm("هيتكتب " + money(d.lesson_price) + " لكل دفعة درس قديمة من غير مبلغ (" + payments(u.fillable) + "). ده بيتعمل مرة واحدة، والاشتراكات مش بتتلمس. نكمّل؟")) return;
          fill.disabled = true;
          api({ action: "admin_revenue_fill_old" }).then(function (r) { S.flash = "اتحسبت " + payments(r.filled) + " بسعر " + money(r.price) + "."; return load(); },
            function (e) { fill.disabled = false; say(e.message, "err"); });
        });
        box.appendChild(fill);
      } else box.appendChild(el("div", { text: "حدّد سعر الدرس فوق، وبعدها تقدر تحسبهم مرة واحدة." }));
      card.appendChild(box);
    }
    var other = (u.approved || 0) + (u.pending || 0) - (u.fillable || 0);
    if (other > 0) card.appendChild(el("p", { class: "fu-hint", style: "margin:10px 0 0", text: "و" + payments(other) + " تانية من غير مبلغ مفهوم. لو عايز تحسبهم، اكتب المبلغ بإيدك في عمود amount في شيت Payments." }));
    return card;
  }

  function render() {
    var d = S.data;
    if (!d) return;
    clear(root);
    root.appendChild(hero(d));
    root.appendChild(kpis(d));
    root.appendChild(el("p", { class: "rv-rule", text: "بنحسب بس الفلوس اللي الطالب دفعها من الموقع (كتب رقم التحويل) واتوافق عليها. الوصول اللي بتديه بإيدك أو بسبب الحضور في السنتر مش محسوب هنا." }));
    root.appendChild(breakdownCard(d));
    root.appendChild(priceCard(d));
    root.appendChild(el("a", { class: "rv-more", href: "teacher-stats.html", text: "أرقام كل مدرّس ومادة ←" }));
    var g = /T(\d{2}):(\d{2})/.exec(String(d.generated_at || ""));
    document.getElementById("rv-stamp").textContent = g ? "آخر تحديث الساعة " + g[1] + ":" + g[2] : "";
  }
  function fail(e) { clear(root).appendChild(el("div", { class: "rv-state err", id: "rv-error", text: e && e.message ? e.message : "حصلت مشكلة." })); }
  function load() {
    if (S.busy) return Promise.resolve();
    S.busy = true;
    return api({ action: "admin_revenue_report" }).then(function (r) {
      S.busy = false; S.data = r;
      if (S.month === null) S.month = r.this_month;   // open on this month
      render();
    }, function (e) { S.busy = false; fail(e); });
  }
  function loadTitles() {
    try {
      return fetch("/assets/lesson-titles.json").then(function (r) { return r.ok ? r.json() : {}; }).then(function (j) { S.titles = j || {}; }, function () {});
    } catch (e) { return Promise.resolve(); }
  }

  // ---------- mock (?mock=1): invented numbers, kept in memory ----------
  var M = { price: null, filled: false };
  function mockApi(p) {

  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("ما قدرناش نحمّل " + src)); }; document.head.appendChild(s); }); }
  function boot() {
    if (MOCK) { document.getElementById("rv-mock").hidden = false; var g = document.getElementById("authgate"); if (g) g.remove(); start(null); return; }
    loadScript("/assets/auth.js").then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
