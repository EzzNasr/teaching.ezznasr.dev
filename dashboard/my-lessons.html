  .l-file:last-child{ border-bottom:0; }
  .l-file .t{ flex:1 1 200px; font-weight:700; min-width:0; overflow-wrap:anywhere; }
  .l-file-new{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:8px; align-items:center; margin:12px 0 0; }
  .l-state{ font-size:14px; color:var(--ink-dim); padding:10px 0; } .l-state.err{ color:var(--status-fail); }
  .l-note{ font-size:12.5px; color:var(--ink-dim); margin:8px 0 0; line-height:1.7; }
  @media (max-width:640px){

  }

<script>
(function () {
  "use strict";
  // Phase 2.5 step G: the teacher fills in the owner's lessons from the browser. Lesson names and the lesson list are
  // the owner's (seeded in the repository); this page only sets a lesson's three videos (admin_set_video), its quiz
  // questions (admin_get/set_quiz_content) and its files (upload_attachment / delete_attachment + the server file list
  // admin_set_attachments, shown on the lesson page by attachments.js). The server checks every call against the
  // teacher's subjects; nothing here is a security boundary. Everything the page shows is set as text, never as HTML.
  var MOCK = /[?&]mock=1\b/.test(location.search);
  var MAX_FILE_MB = 15;
  var root = document.getElementById("ml-root");
  var S = { session: null, scope: [], titles: {}, videos: [], lesson: null };
  var tr = function (s, v) { return window.I18n ? window.I18n.t(s, v) : String(s).replace(/\{(\d+)\}/g, function (m, i) { return v && v[i] != null ? v[i] : m; }); };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag); attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
      else if (k === "class") n.className = attrs[k];
      else if (k === "value") n.value = attrs[k];
      else if (k === "checked") n.checked = !!attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c))); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function data(text) { return el("span", { translate: "no", text: text }); }
  function say(msg, text, kind) { msg.className = "l-msg" + (kind ? " " + kind : ""); msg.textContent = text || ""; }

  // ---------- labels ----------
  var SUBJECT = { science: "علوم", math: "رياضيات", programming: "برمجة", english: "إنجليزي" };
  var GRADE = { "grade-3-preparatory": "الصف الثالث الإعدادي", "grade-1-secondary": "الصف الأول الثانوي", "grade-2-secondary": "الصف الثاني الثانوي", "grade-3-secondary": "الصف الثالث الثانوي" };
  function humanize(slug) { return String(slug || "").replace(/[-_]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function courseOf(key) { var p = String(key).split("/"); p.pop(); return p.join("/"); }
  function courseName(key) {
    var parts = String(key || "").split("/"), last = parts[parts.length - 1];
    var sub = SUBJECT[parts[0]] ? tr(SUBJECT[parts[0]]) : humanize(parts[0]);
    return parts.length < 2 ? sub : sub + " · " + (GRADE[last] ? tr(GRADE[last]) : humanize(last));
  }
  function lessonName(key) { return S.titles[key] || humanize(String(key || "").split("/").pop()); }
  var SLOTS = [["lesson", "فيديو الدرس", "على صفحة الدرس"], ["quiz", "فيديو حل الكويز", "على صفحة الكويز"], ["assignment", "فيديو حل الواجب", "على صفحة الواجب"]];

  // ---------- API (real: AuthEngine.adminCall; mock: an in-memory server for the tests and screenshots) ----------
  var MOCK_DB = {
    titles: {
      "science/preparatory/grade-3-preparatory/chapter-1-lesson-1": "Chapter 1 Lesson 1",
      "science/preparatory/grade-3-preparatory/chapter-1-lesson-2": "Chapter 1 Lesson 2",
      "science/secondary/grade-1-secondary/chapter-1-lesson-1": "Chapter 1 Lesson 1 | Matter <b>&</b> its states",
      "science/secondary/grade-1-secondary/chapter-1-lesson-2": "Chapter 1 Lesson 2",
      "math/test/lesson-1": "Not his"
    },
    videos: [{ lesson: "science/secondary/grade-1-secondary/chapter-1-lesson-1", slot: "lesson", embed_url: "https://www.youtube.com/embed/aaaaaaaaaaa", locked: true }],
    quiz: { "science/secondary/grade-1-secondary/chapter-1-lesson-1": { title: "Chapter 1 Lesson 1", subject: "science", lesson: "chapter-1-lesson-1", questions: [
      { type: "mcq", prompt: "Which state of matter has a fixed shape?", options: ["Solid", "Liquid", "Gas"], correct: [0], explain: "" },
      { type: "truefalse", prompt: "Water boils at 100 °C at sea level.", correct: true, explain: "" },
      { type: "written", id: "w1", prompt: "Explain why ice floats.", max_marks: 2 }
    ] } },
    files: { "science/secondary/grade-1-secondary/chapter-1-lesson-1": [{ title: "Worksheet 1", drive_file_id: "1mockWorksheetAAAAAAAAAA", type: "pdf" }] },
    n: 0, calls: []
  };
  function mockCall(p) {
    var db = MOCK_DB; db.calls.push(p);
    var mine = function (k) { return String(k || "").split("/")[0] === "science"; };
    if (p.action === "p4_session_scope") return { ok: true, kind: "teacher", subjects: ["science"] };
    if (p.action === "admin_list_videos") return { ok: true, videos: db.videos.slice() };
    if (p.action === "delete_attachment") return { ok: true };
    if (!mine(p.lesson || p.subject)) return { ok: false, error: "Not authorized." };
    if (p.action === "admin_set_video") {
      db.videos = db.videos.filter(function (v) { return !(v.lesson === p.lesson && v.slot === p.slot); });
      var m = /(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/.exec(p.video_url || "");
      if (p.video_url && !m) return { ok: false, error: "That doesn't look like a YouTube or Vimeo link." };
      if (m) db.videos.push({ lesson: p.lesson, slot: p.slot, embed_url: "https://www.youtube.com/embed/" + m[1], locked: true });
      return { ok: true };
    }
    if (p.action === "admin_get_quiz_content") return { ok: true, quiz: db.quiz[p.lesson] || null };
    if (p.action === "admin_set_quiz_content") { db.quiz[p.lesson] = JSON.parse(p.content_json); return { ok: true }; }
    if (p.action === "get_attachments") return { ok: true, items: (db.files[p.lesson] || []).slice() };
    if (p.action === "upload_attachment") return { ok: true, file_id: "1mockUpload" + (++db.n) + "AAAAAAAAAAAA" };
    if (p.action === "admin_set_attachments") { db.files[p.lesson] = p.items.slice(); return { ok: true, items: p.items }; }
    return { ok: false, error: "mock: unknown action" };
  }
  window.__mlMock = MOCK ? MOCK_DB : null;   // for the tests
  function api(payload) {
    var call;
    if (MOCK) call = new Promise(function (res) { setTimeout(function () { res(mockCall(JSON.parse(JSON.stringify(payload)))); }, 20); });
    else if (!window.AuthEngine) call = Promise.reject(new Error("صفحة الدخول ما اتحمّلتش. اعمل تحديث للصفحة."));
    else call = window.AuthEngine.adminCall(S.session, payload);
    return call.then(function (r) { if (!r || r.ok === false) throw new Error((r && r.error) || "Request failed."); return r; });
  }
  function loadTitles() {
    if (MOCK) { S.titles = MOCK_DB.titles; return Promise.resolve(); }
    return fetch("/assets/lesson-titles.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (j) { S.titles = j && typeof j === "object" ? j : {}; }, function () { S.titles = {}; });
  }
  function myLessons() {
    var all = S.scope.indexOf("*") !== -1;
    return Object.keys(S.titles).filter(function (k) { return all || S.scope.indexOf(k.split("/")[0]) !== -1; }).sort(function (a, b) {
      var pa = /chapter-(\d+)-lesson-(\d+)$/.exec(a), pb = /chapter-(\d+)-lesson-(\d+)$/.exec(b);
      if (courseOf(a) !== courseOf(b) || !pa || !pb) return a < b ? -1 : a > b ? 1 : 0;
      return (+pa[1] - +pb[1]) || (+pa[2] - +pb[2]);
    });
  }
  function videoOf(lesson, slot) { return S.videos.filter(function (v) { return v.lesson === lesson && v.slot === slot; })[0] || null; }

  // ---------- the list of lessons (#/) ----------
  function crumbs(list) {
    var nav = el("nav", { class: "l-crumbs", "aria-label": "مكانك" });
    list.forEach(function (c, i) {
      if (i) nav.appendChild(el("span", { class: "sep", "aria-hidden": "true", text: "‹" }));
      nav.appendChild(c.href ? el("a", { href: c.href }, [c.data ? data(c.text) : c.text]) : el("strong", {}, [c.data ? data(c.text) : c.text]));
    });
    return nav;
  }
  function overview() {
    var lessons = myLessons(), out = [crumbs([{ text: "كل الدروس" }])];
    if (!lessons.length) { out.push(el("p", { class: "l-state", id: "ml-none", text: "لسه مفيش دروس في موادك. صاحب الموقع بيضيفها." })); return out; }
    var courses = [];
    lessons.forEach(function (k) { var c = courseOf(k); if (courses.indexOf(c) === -1) courses.push(c); });
    courses.forEach(function (c) {
      var rows = lessons.filter(function (k) { return courseOf(k) === c; }).map(function (k) {
        var n = SLOTS.filter(function (s) { return videoOf(k, s[0]); }).length;
        return el("li", { class: "l-row" }, [
          el("a", { class: "name", href: "#/lesson/" + encodeURIComponent(k) }, [data(lessonName(k))]),
          el("span", { class: "l-chip" + (n ? " ok" : ""), text: tr("{0} من 3 فيديو", [n]) })
        ]);
      });
      out.push(el("section", { class: "l-card ml-course" }, [el("h2", {}, [data(courseName(c))]), el("ul", { class: "l-list" }, rows)]));
    });
    out.push(el("p", { class: "l-note", text: "أسامي الدروس وترتيبها ثابتة؛ لو محتاج درس جديد أو اسم مختلف كلّم صاحب الموقع." }));
    return out;
  }

  // ---------- one lesson (#/lesson/<key>) ----------
  function lessonPage(key) {
    if (myLessons().indexOf(key) === -1) return [crumbs([{ text: "كل الدروس", href: "#/" }]), el("p", { class: "l-state err", text: "الدرس ده مش من موادك." })];
    var out = [crumbs([{ text: "كل الدروس", href: "#/" }, { text: courseName(courseOf(key)), data: true }, { text: lessonName(key), data: true }])];
    out.push(el("h2", { id: "ml-title", style: "margin:0 0 14px;font-size:22px" }, [data(lessonName(key))]));
    out.push(videosCard(key), quizCard(key), filesCard(key));
    return out;
  }

  // videos
  function videosCard(key) {
    var card = el("section", { class: "l-card", id: "ml-videos" }, [el("h2", { text: "الفيديوهات" }),
      el("p", { class: "sub", text: "الصق لينك يوتيوب أو فيميو واضغط حفظ. الفيديو الجديد بيبدأ مقفول؛ افتحه للطلاب من «الوصول للدروس» لما تبقى جاهز. سيب الخانة فاضية واحفظ علشان تشيل الفيديو." })]);
    SLOTS.forEach(function (s) {
      var v = videoOf(key, s[0]);
      var input = el("input", { type: "url", id: "ml-video-" + s[0], placeholder: "https://www.youtube.com/watch?v=…", value: v ? v.embed_url : "", "aria-label": tr(s[1]) });
      var msg = el("span", { class: "l-msg", role: "status" });
      if (v) say(msg, v.locked ? tr("محفوظ · مقفول للطلاب") : tr("محفوظ · مفتوح للطلاب"));
      var btn = el("button", { class: "l-btn", type: "button", id: "ml-vsave-" + s[0], text: "حفظ" });
      btn.addEventListener("click", function () {
        btn.disabled = true; say(msg, tr("بنحفظ…"));
        api({ action: "admin_set_video", lesson: key, slot: s[0], video_url: input.value.trim() }).then(function () {
          return api({ action: "admin_list_videos" });
        }).then(function (r) {
          S.videos = r.videos || [];
          var now = videoOf(key, s[0]);
          input.value = now ? now.embed_url : "";
          say(msg, now ? tr("اتحفظ. مقفول للطلاب لحد ما تفتحه.") : tr("اتشال الفيديو."), "ok");
        }, function (e) { say(msg, e.message, "err"); }).then(function () { btn.disabled = false; });
      });
      card.appendChild(el("div", { class: "l-field" }, [el("label", { for: "ml-video-" + s[0] }, [tr(s[1]), el("div", { class: "l-msg", text: tr(s[2]) })]), input, btn]));
      card.appendChild(el("div", {}, [msg]));
    });
    return card;
  }

  // quiz questions
  function quizCard(key) {
    var card = el("section", { class: "l-card", id: "ml-quiz" }, [el("h2", { text: "أسئلة الكويز" }),
      el("p", { class: "sub", text: "اختيار من متعدد أو صح وغلط. علّم الإجابة الصح، وبعدين اضغط «احفظ الأسئلة». الطلاب بيشوفوا الأسئلة الجديدة على طول." })]);
    var list = el("div", { id: "ml-qlist" }, [el("p", { class: "l-state", text: "بنجيب الأسئلة…" })]);
    var msg = el("span", { class: "l-msg", role: "status", id: "ml-quiz-msg" });
    var quiz = null;
    var addMcq = el("button", { class: "l-btn ghost", type: "button", id: "ml-add-mcq", text: "+ اختيار من متعدد" });
    var addTf = el("button", { class: "l-btn ghost", type: "button", id: "ml-add-tf", text: "+ صح وغلط" });
    var save = el("button", { class: "l-btn", type: "button", id: "ml-save-quiz", text: "احفظ الأسئلة" });
    [addMcq, addTf, save].forEach(function (b) { b.disabled = true; });
    card.appendChild(list);
    card.appendChild(el("div", { class: "l-actions" }, [addMcq, addTf, save, msg]));

    function draw() {
      clear(list);
      if (!quiz.questions.length) list.appendChild(el("p", { class: "l-state", text: "لسه مفيش أسئلة." }));
      quiz.questions.forEach(function (q, i) { list.appendChild(questionBox(q, i)); });
    }
    function move(i, d) { var j = i + d; if (j < 0 || j >= quiz.questions.length) return; var t = quiz.questions[i]; quiz.questions[i] = quiz.questions[j]; quiz.questions[j] = t; draw(); }
    function questionBox(q, i) {
      var kind = q.type === "truefalse" ? tr("صح وغلط") : q.type === "mcq" ? tr("اختيار من متعدد") : tr("سؤال من نوع تاني");
      var tools = el("span", { class: "tools" }, [
        el("button", { class: "l-btn ghost small", type: "button", "aria-label": tr("لفوق"), text: "↑", on: { click: function () { move(i, -1); } } }),
        el("button", { class: "l-btn ghost small", type: "button", "aria-label": tr("لتحت"), text: "↓", on: { click: function () { move(i, 1); } } }),
        el("button", { class: "l-btn danger small", type: "button", text: "امسح", on: { click: function () { quiz.questions.splice(i, 1); draw(); } } })
      ]);
      var box = el("div", { class: "l-q", "data-type": q.type || "" }, [el("div", { class: "head" }, [el("span", { text: tr("سؤال {0}", [i + 1]) + " · " + kind }), tools])]);
      if (q.type !== "mcq" && q.type !== "truefalse") {
        box.appendChild(el("p", {}, [data(String(q.prompt || q.q || ""))]));
        box.appendChild(el("p", { class: "small", text: "السؤال ده اتعمل من برنامج المدرس؛ بيفضل زي ما هو. تقدر تمسحه أو تغيّر مكانه بس." }));
        return box;
      }
      var prompt = el("textarea", { "aria-label": tr("نص السؤال"), placeholder: tr("اكتب السؤال هنا") });
      prompt.value = String(q.prompt || "");
      prompt.addEventListener("input", function () { q.prompt = prompt.value; });
      box.appendChild(prompt);
      if (q.type === "truefalse") {
        var name = "tf" + i + "-" + Math.random().toString(36).slice(2, 7);
        var t = el("input", { type: "radio", name: name, checked: q.correct === true }), f = el("input", { type: "radio", name: name, checked: q.correct === false });
        t.addEventListener("change", function () { q.correct = true; }); f.addEventListener("change", function () { q.correct = false; });
        box.appendChild(el("div", { class: "l-tf" }, [el("label", {}, [t, " ", tr("صح")]), el("label", {}, [f, " ", tr("غلط")])]));
        return box;
      }
      q.options = Array.isArray(q.options) ? q.options : [];
      q.correct = Array.isArray(q.correct) ? q.correct : [];
      var opts = el("div");
      function drawOpts() {
        clear(opts);
        q.options.forEach(function (o, k) {
          var c = el("input", { type: "checkbox", "aria-label": tr("إجابة صح"), checked: q.correct.indexOf(k) !== -1 });
          c.addEventListener("change", function () { q.correct = q.correct.filter(function (x) { return x !== k; }); if (c.checked) q.correct.push(k); q.correct.sort(); });
          var txt = el("input", { type: "text", "aria-label": tr("اختيار {0}", [k + 1]), placeholder: tr("اختيار {0}", [k + 1]) });
          txt.value = String(o == null ? "" : o);
          txt.addEventListener("input", function () { q.options[k] = txt.value; });
          var del = el("button", { class: "l-btn ghost small", type: "button", text: "×", "aria-label": tr("امسح الاختيار") });
          del.addEventListener("click", function () {
            q.options.splice(k, 1);
            q.correct = q.correct.filter(function (x) { return x !== k; }).map(function (x) { return x > k ? x - 1 : x; });
            drawOpts();
          });
          opts.appendChild(el("div", { class: "l-opt" }, [c, txt, del]));
        });
      }
      drawOpts();
      box.appendChild(opts);
      box.appendChild(el("button", { class: "l-btn ghost small", type: "button", text: "+ اختيار", on: { click: function () { q.options.push(""); drawOpts(); } } }));
      box.appendChild(el("p", { class: "small", text: "علّم المربع جنب كل إجابة صح (أكتر من واحدة = «اختار كل الصح»)." }));
      return box;
    }
    function problems() {
      for (var i = 0; i < quiz.questions.length; i++) {
        var q = quiz.questions[i], n = i + 1;
        if (q.type !== "mcq" && q.type !== "truefalse") continue;
        if (!String(q.prompt || "").trim()) return tr("سؤال {0}: اكتب نص السؤال.", [n]);
        if (q.type === "truefalse" && typeof q.correct !== "boolean") return tr("سؤال {0}: اختار صح ولا غلط.", [n]);
        if (q.type === "mcq") {
          q.options = q.options.map(function (o) { return String(o == null ? "" : o).trim(); });
          if (q.options.length < 2 || q.options.some(function (o) { return !o; })) return tr("سؤال {0}: محتاج اختيارين على الأقل، ومفيش اختيار فاضي.", [n]);
          if (!q.correct.length) return tr("سؤال {0}: علّم الإجابة الصح.", [n]);
        }
      }
      return "";
    }
    addMcq.addEventListener("click", function () { quiz.questions.push({ type: "mcq", prompt: "", options: ["", ""], correct: [], explain: "" }); draw(); });
    addTf.addEventListener("click", function () { quiz.questions.push({ type: "truefalse", prompt: "", correct: null, explain: "" }); draw(); });
    save.addEventListener("click", function () {
      var p = problems();
      if (p) { say(msg, p, "err"); return; }
      save.disabled = true; say(msg, tr("بنحفظ…"));
      quiz.title = lessonName(key); quiz.subject = key.split("/")[0]; quiz.lesson = key.split("/").pop();
      api({ action: "admin_set_quiz_content", lesson: key, content_json: JSON.stringify(quiz) })
        .then(function () { say(msg, tr("اتحفظ: {0} سؤال.", [quiz.questions.length]), "ok"); }, function (e) { say(msg, e.message, "err"); })
        .then(function () { save.disabled = false; });
    });
    api({ action: "admin_get_quiz_content", lesson: key }).then(function (r) {
      quiz = r.quiz && Array.isArray(r.quiz.questions) ? r.quiz : { title: lessonName(key), subject: key.split("/")[0], lesson: key.split("/").pop(), questions: [] };
      draw(); [addMcq, addTf, save].forEach(function (b) { b.disabled = false; });
    }, function (e) { clear(list).appendChild(el("p", { class: "l-state err", text: e.message })); });
    return card;
  }

  // files
  function filesCard(key) {
    var card = el("section", { class: "l-card", id: "ml-files" }, [el("h2", { text: "الملفات" }),
      el("p", { class: "sub", text: tr("ملفات PDF أو صور أو Word أو PowerPoint (لحد {0} ميجا). بتظهر للطلاب تحت الدرس على طول.", [MAX_FILE_MB]) })]);
    var list = el("div", { id: "ml-flist" }, [el("p", { class: "l-state", text: "بنجيب الملفات…" })]);
    var msg = el("span", { class: "l-msg", role: "status", id: "ml-files-msg" });
    var fileIn = el("input", { type: "file", id: "ml-file", accept: ".pdf,.png,.jpg,.jpeg,.webp,.gif,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt", "aria-label": tr("اختار ملف") });
    var titleIn = el("input", { type: "text", id: "ml-file-title", placeholder: tr("اسم الملف زي ما الطلاب هيشوفوه"), "aria-label": tr("اسم الملف") });
    var up = el("button", { class: "l-btn", type: "button", id: "ml-upload", text: "ارفع" });
    var items = [], owners = [];
    card.appendChild(list);
    card.appendChild(el("div", { class: "l-file-new" }, [fileIn, titleIn, up]));
    card.appendChild(el("div", {}, [msg]));

    function saveList(next) {
      return api({ action: "admin_set_attachments", lesson: key, items: next }).then(function (r) { items = r.items || next; draw(); });
    }
    function draw() {
      clear(list);
      if (!owners.length && !items.length) list.appendChild(el("p", { class: "l-state", text: "لسه مفيش ملفات." }));
      owners.forEach(function (it) {
        list.appendChild(el("div", { class: "l-file" }, [el("span", { class: "t" }, [data(it.title || "Untitled")]), el("span", { class: "l-chip", text: tr("من صاحب الموقع") })]));
      });
      items.forEach(function (it, i) {
        var del = el("button", { class: "l-btn danger small", type: "button", text: "امسح" });
        del.addEventListener("click", function () {
          if (!window.confirm(tr("تمسح «{0}»؟", [it.title]))) return;
          del.disabled = true; say(msg, tr("بنمسح…"));
          var next = items.filter(function (_x, j) { return j !== i; });
          saveList(next).then(function () { return api({ action: "delete_attachment", file_id: it.drive_file_id }).catch(function () { /* already gone */ }); })
            .then(function () { say(msg, tr("اتمسح."), "ok"); }, function (e) { del.disabled = false; say(msg, e.message, "err"); });
        });
        list.appendChild(el("div", { class: "l-file" }, [el("span", { class: "t" }, [data(it.title || "Untitled")]), el("span", { class: "l-chip", text: String(it.type || "").toUpperCase() || "FILE" }), del]));
      });
    }
    function readB64(file) {
      return new Promise(function (ok, bad) {
        var r = new FileReader();
        r.onload = function () { ok(String(r.result).replace(/^data:[^,]*,/, "")); };
        r.onerror = function () { bad(new Error(tr("ما قدرناش نقرا الملف."))); };
        r.readAsDataURL(file);
      });
    }
    up.addEventListener("click", function () {
      var file = fileIn.files && fileIn.files[0];
      if (!file) { say(msg, tr("اختار ملف الأول."), "err"); return; }
      if (file.size > MAX_FILE_MB * 1048576) { say(msg, tr("الملف أكبر من {0} ميجا.", [MAX_FILE_MB]), "err"); return; }
      var title = titleIn.value.trim() || file.name.replace(/\.[^.]+$/, "");
      var type = (/\.([a-z0-9]{1,10})$/i.exec(file.name) || [, ""])[1].toLowerCase();
      up.disabled = true; say(msg, tr("بنرفع «{0}»…", [title]));
      readB64(file).then(function (b64) {
        return api({ action: "upload_attachment", subject: key.split("/")[0], lesson: key, filename: file.name, mime_type: file.type || "application/octet-stream", data_base64: b64 });
      }).then(function (r) {
        return saveList(items.concat([{ title: title, drive_file_id: r.file_id, type: type }]));
      }).then(function () {
        fileIn.value = ""; titleIn.value = ""; say(msg, tr("اترفع «{0}».", [title]), "ok");
      }, function (e) { say(msg, e.message, "err"); }).then(function () { up.disabled = false; });
    });
    var fromRepo = MOCK ? Promise.resolve([]) : fetch("/" + key + "/attachments.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : []; }).then(function (j) { return Array.isArray(j) ? j : []; }, function () { return []; });
    Promise.all([api({ action: "get_attachments", lesson: key }), fromRepo]).then(function (r) {
      items = r[0].items || []; owners = r[1]; draw();
    }, function (e) { clear(list).appendChild(el("p", { class: "l-state err", text: e.message })); });
    return card;
  }

  function render() {
    if (!S.session) return;
    var m = /^#\/lesson\/(.+)$/.exec(location.hash || "");
    var nodes = m ? lessonPage(decodeURIComponent(m[1])) : overview();
    clear(root); nodes.forEach(function (n) { root.appendChild(n); });
    window.scrollTo(0, 0);
  }

  // ---------- boot ----------
  function start(session, scope) {
    S.session = session; S.scope = scope;
    clear(root).appendChild(el("p", { class: "l-state", text: "بنجيب دروسك…" }));
    Promise.all([api({ action: "admin_list_videos" }), loadTitles()]).then(function (r) { S.videos = r[0].videos || []; render(); },
      function (e) { clear(root).appendChild(el("p", { class: "l-state err", text: e.message })); });
  }
  window.addEventListener("hashchange", render);
  if (window.I18n && window.I18n.onChange) window.I18n.onChange(render);
  function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error(tr("ما قدرناش نحمّل {0}", [src]))); }; document.head.appendChild(s); }); }
  function boot() {
    if (MOCK) { var g = document.getElementById("authgate"); if (g) g.remove(); start({ student_name: "Science Teacher" }, ["science"]); return; }
    loadScript("/assets/auth.js").then(function () {
      window.AuthEngine.mount("#authgate", function (session) {
        var gate = document.getElementById("authgate"); if (gate) gate.remove();
        if (!session.session_token) { clear(root).appendChild(el("div", { class: "l-state err", text: "تسجيل الدخول المحفوظ ناقصه رمز الجلسة. اخرج وادخل تاني." })); return; }
        window.StaffGuard.require(null, session).then(function (role) {
          if (!role) return;
          var st = window.StaffGuard.STATE || {};
          start(session, role === "admin" ? ["*"] : (st.scope || []));
        });
      });
    }, function (e) { clear(root).appendChild(el("div", { class: "l-state err", text: e.message })); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
