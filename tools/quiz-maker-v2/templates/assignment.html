<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>{{LESSON_TITLE}} Assignment | {{SITE_NAME}}</title>
<meta name="description" content="Submit your {{LESSON_TITLE}} assignment.">
<link rel="canonical" href="https://teaching.ezznasr.dev/{{LESSON_URL_PATH}}/assignment.html">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./forms.css">
<style>
  :root{ --maxw:720px; }
  main{ padding:24px 0 64px; }
  .page-head p.lede{ white-space:pre-line; }

  /* ---- submission mode toggle (assignment-only) ---- */
  .qz-mode-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .qz-mode-btn{ flex:1; font-family:var(--mono); font-size:11.5px; letter-spacing:0.05em; text-transform:uppercase;
    background:var(--panel-soft); color:var(--ink-dim); border:1px solid var(--line); border-radius:9px; padding:9px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease; }
  .qz-mode-btn.active{ border-color:var(--accent); color:var(--accent-strong); }
  /* ---- attachments (files for this page, Phase 2.5 G) ---- */
  .attachments{ margin-top:32px; }
  .attach-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .attach-head h2{ font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; }
  .attach-empty{ padding:18px 20px; color:var(--ink-dim); font-size:13.5px; }
  .attach-empty code{ font-family:var(--mono); background:var(--panel-soft); padding:0.1em 0.4em; font-size:0.85em; border:1px solid var(--line); border-radius:4px; }
  .attach-item{ padding:14px 16px; margin-bottom:10px; border-radius:12px; }
  .attach-item__title{ font-family:var(--mono); font-size:13px; color:var(--ink); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .attach-item__actions a{ font-family:var(--mono); font-size:11px; letter-spacing:0.04em; color:var(--accent-strong); text-decoration:none; }
  .attach-item iframe{ width:100%; height:340px; border:1px solid var(--line); border-radius:10px; background:var(--panel-soft); }
</style>
</head>
<body class="{{TRACK_CLASS}}">

<header>
  <div class="titlebar">
    <a href="/" class="mark"><img class="brand-logo" src="/assets/brand/handasa-mark.svg" alt="" width="28" height="28"><span class="brand-name">Handasa<span class="brand-ar" lang="ar">هندسة</span></span></a>
    <nav>
      <a href="/{{LESSON_URL_PATH}}/" class="back">Back to {{LESSON_TITLE}}</a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">&#9789;</span><span class="theme-label"></span></button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap page-head">
    <h1>{{LESSON_TITLE}} — assignment</h1>
    <p class="lede">{{ASSIGN_PROMPT}}</p>
  </div>

  <div class="wrap">
    <div class="media-slot">
      {{VIDEO_BLOCK}}
    </div>

    <div id="assign-root" data-subject="{{SUBJECT_SLUG}}" data-lesson="{{LESSON_SLUG}}" data-mode="{{SUBMIT_MODE}}" aria-live="polite"></div>

    <div class="attachments" id="attachments-root" data-section="assignment" hidden>
      <div class="attach-head">
        <h2>Files</h2>
        <span class="stamp planned" id="attachments-stamp">Loading&hellip;</span>
      </div>
      <div id="attachments-list"></div>
    </div>
  </div>
</main>

<footer><div class="wrap"><p class="footer-note"><span class="brand-foot">Handasa · هندسة · by Ezz Nasr ·</span> teaching.ezznasr.dev/{{LESSON_URL_PATH}}/assignment</p></div></footer>

<script type="application/json" id="assign-questions">
{{ASSIGN_QUESTIONS_JSON}}
</script>
<script src="/assets/auth.js"></script>
<script src="/assets/video.js?v=3"></script>
<script src="/assets/assign.js"></script>
<script src="/assets/attachments.js"></script>
<script>AttachEngine.mount('#attachments-root');</script>
<script>AssignEngine.mount('#assign-root');</script>
<script>(function(){var slot=document.querySelector('.media-slot');if(!slot)return;var frame=slot.querySelector('iframe');if(!frame)return;var root=document.getElementById('assign-root');var subject=root?root.getAttribute('data-subject'):null;var lesson=root?root.getAttribute('data-lesson'):null;var key='teaching_last_submission:'+(subject||'?')+':'+(lesson||'?');function done(){try{return !!localStorage.getItem(key);}catch(e){return false;}}var overlay=document.createElement('div');overlay.className='video-lock';overlay.innerHTML='<span class="video-lock__icon" aria-hidden="true">\uD83D\uDD12</span><span class="video-lock__msg">Submit the assignment below to unlock this video.</span>';function lock(){if(slot.contains(overlay))return;slot.classList.add('is-locked');slot.appendChild(overlay);}function unlock(){slot.classList.remove('is-locked');if(slot.contains(overlay))slot.removeChild(overlay);}function sync(){if(done())unlock();else lock();}sync();overlay.addEventListener('click',function(){overlay.classList.add('is-tapped');overlay.classList.remove('shake');void overlay.offsetWidth;overlay.classList.add('shake');});if(root)new MutationObserver(sync).observe(root,{childList:true,subtree:true});})();</script>
<script>(function(){var root=document.documentElement,toggle=document.getElementById('theme-toggle'),stored;try{stored=localStorage.getItem('teaching-theme')}catch(e){}var initial=stored||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');function apply(theme){root.setAttribute('data-theme',theme);toggle.setAttribute('aria-pressed',theme==='dark'?'true':'false');toggle.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');toggle.querySelector('.theme-icon').textContent=theme==='dark'?'\u2600':'\u263E';try{localStorage.setItem('teaching-theme',theme)}catch(e){}}apply(initial);toggle.addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'light':'dark')})})();</script>

</body>
</html>
