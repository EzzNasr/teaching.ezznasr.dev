<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video.js demo (not part of the site)</title>
<!--
  Manual test page for assets/video.js — talks to your REAL Apps Script backend.
  Serve the repo root and open this page:

      cd <repo root>
      python -m http.server 8000
      http://localhost:8000/tools/quiz-maker-v2/tests/manual/video-demo.html

  (localhost counts as a secure context, so the sign-in code works.)
  It uses the made-up lesson "zz-test/step3" so it can't touch a real lesson.
  Needs the synced assets/ (Quiz Maker -> "Sync site assets") first.
-->
<link rel="stylesheet" href="/assets/base.css">
</head>
<body>
<main>
  <div class="wrap page-head">
    <h1>video.js demo</h1>
    <p class="lede">Lesson <code>zz-test/step3</code>, slot <code>lesson</code>.</p>
  </div>
  <div class="wrap">
    <div class="media-slot" data-video-lesson="zz-test/step3" data-video-slot="lesson">Video placeholder &mdash; add a YouTube embed URL to replace this box.</div>
  </div>
</main>
<script src="/assets/auth.js"></script>
<script src="/assets/video.js"></script>
</body>
</html>
