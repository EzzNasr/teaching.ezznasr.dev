  body{

    background:linear-gradient(var(--line-faint) 1px, transparent 1px) 0 0/100% 42px,
      linear-gradient(90deg, var(--line-faint) 1px, transparent 1px) 0 0/42px 100%, var(--bg);
    color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;

    content:""; position:absolute; width:10px; height:10px; border-color:var(--copper); border-style:solid; border-width:0; opacity:.85;

  header{ position:sticky; top:0; z-index:20; background:rgba(11,35,24,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }

  /* ---- quiz engine styling ---- */
  .qz-progress{ font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); letter-spacing:0.04em; margin-bottom:12px; }
  .qz-card{ padding:24px; }
  .qz-question{ font-size:17px; margin:0 0 18px; color:var(--ink); }
  .qz-question code{ font-family:var(--mono); background:var(--bg-soft); padding:0.1em 0.4em; font-size:0.9em; border:1px solid var(--line); }
  .qz-options{ display:flex; flex-direction:column; gap:9px; }
  .qz-option{
    display:flex; align-items:flex-start; gap:10px; text-align:left; width:100%;
    padding:12px 14px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink);
    cursor:pointer; font-size:14.5px; transition:border-color .15s ease, transform .1s ease;
  }
  .qz-option:hover:not(:disabled){ border-color:var(--copper); }
  .qz-option:active:not(:disabled){ transform:scale(0.995); }
  .qz-option__tag{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); flex-shrink:0; padding-top:2px; }
  .qz-option:disabled{ cursor:default; }
  .qz-option--correct{ border-color:var(--status-shipped); }
  .qz-option--correct .qz-option__tag{ color:var(--status-shipped); }
  .qz-option--incorrect{ border-color:var(--status-fail); }
  .qz-option--incorrect .qz-option__tag{ color:var(--status-fail); }
  .qz-verdict{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); font-family:var(--mono); font-size:13px; }

  .qz-verdict__tag--fail{ color:var(--status-fail); }
  .qz-verdict__explain{ display:block; color:var(--ink-dim); font-family:var(--serif); font-size:14.5px; margin-top:4px; }
  .qz-actions{ display:flex; justify-content:flex-end; margin-top:16px; }
  .qz-next{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; background:var(--copper-bright); color:#0B2318; border:none; padding:10px 16px; cursor:pointer; }

  .qz-summary{ padding:36px 24px; text-align:center; }
  .qz-summary__score{ font-family:var(--mono); font-size:2.2rem; color:var(--copper-bright); margin-bottom:6px; }
  .qz-summary__label{ color:var(--ink-dim); font-family:var(--mono); font-size:12.5px; letter-spacing:0.04em; margin-bottom:14px; }
  .qz-timestamp{ font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:0.02em; margin-bottom:22px; opacity:.8; }
  .qz-retry{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; background:transparent; border:1px solid var(--line); color:var(--ink-dim); padding:9px 16px; cursor:pointer; margin-right:8px; }
  .qz-retry:hover{ border-color:var(--copper); color:var(--copper-bright); }
  .qz-summary__next{
    font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; text-decoration:none;

<script type="application/json" id="quiz-data">
{
  "title": "Functions",
  "questions": [
    {
      "q": "What does the <code>def</code> keyword do in Python?",
      "options": [
        "Deletes a variable",
        "Starts a function definition",
        "Defines a class",
        "Imports a module"
      ],
      "correct": 1,
      "explain": "def marks the start of a function definition — the block that follows is the function's body."
    },
    {
      "q": "In <code>def greet(name):</code>, what is <code>name</code>?",
      "options": [
        "A return value",
        "A global variable",
        "A parameter — a placeholder for the input",
        "A function call"
      ],
      "correct": 2,
      "explain": "name is a parameter: a placeholder that gets filled in with a real value (the argument) when the function is called."
    },
    {
      "q": "A function has no <code>return</code> statement. What happens when you call it?",
      "options": [
        "It raises an error",
        "It runs, but gives back None",
        "It returns the last variable used",
        "It won't run at all"
      ],
      "correct": 1,
      "explain": "Without a return statement, a function still runs fully — it just implicitly returns None."
    },
    {
      "q": "A variable created inside a function...",
      "options": [
        "Is available everywhere in the program",
        "Only exists inside that function (its scope)",
        "Overwrites any global variable with the same name",
        "Must be declared outside the function first"
      ],
      "correct": 1,
      "explain": "Variables created inside a function are local to it — they don't exist outside its scope."
    },
    {
      "q": "What's the main benefit of writing a function instead of repeating code?",
      "options": [
        "It makes the code run faster",
        "It's required by Python's syntax",
        "Write the logic once, reuse it anywhere — easier to fix and maintain",
        "It hides the code from other programmers"
      ],
      "correct": 2,
      "explain": "This is the DRY principle — Don't Repeat Yourself. One place to fix bugs, one place to update logic."
    }
  ]
}
</script>
