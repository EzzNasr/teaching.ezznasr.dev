<style>
  :root{
    --bg:#0B2318; --bg-soft:#0F2C1E; --panel:#123420; --line:#25523A;
    --line-faint:rgba(201,151,76,0.14); --copper:#C9974C; --copper-bright:#E3B168;
    --ink:#EDEAE0; --ink-dim:#9FB3A6;
    --status-shipped:#7CB68A; --status-fail:#D97757;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif:'Source Serif 4', Georgia, serif;
    --maxw:720px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(var(--line-faint) 1px, transparent 1px) 0 0/100% 42px,
      linear-gradient(90deg, var(--line-faint) 1px, transparent 1px) 0 0/42px 100%, var(--bg);
    color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--copper-bright);}
  button{ font-family:inherit; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--copper-bright); outline-offset:3px; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }
  h1{ font-family:var(--mono); text-transform:uppercase; letter-spacing:0.03em; color:var(--ink); margin:0; }
  .frame{ position:relative; border:1px solid var(--line); background:var(--bg); }
  .frame::before,.frame::after,.frame .tick-br,.frame .tick-bl{
    content:""; position:absolute; width:10px; height:10px; border-color:var(--copper); border-style:solid; border-width:0; opacity:.85;
  }
  .frame::before{ top:-1px; left:-1px; border-top-width:2px; border-left-width:2px; }
  .frame::after{ top:-1px; right:-1px; border-top-width:2px; border-right-width:2px; }
  .frame .tick-bl{ bottom:-1px; left:-1px; border-bottom-width:2px; border-left-width:2px; }
  .frame .tick-br{ bottom:-1px; right:-1px; border-bottom-width:2px; border-right-width:2px; }
  header{ position:sticky; top:0; z-index:20; background:rgba(11,35,24,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .titlebar{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:16px; max-width:var(--maxw); margin:0 auto; padding-left:28px; padding-right:28px; }
  .titlebar .mark{ font-family:var(--mono); font-weight:600; letter-spacing:0.06em; font-size:14px; color:var(--ink); display:flex; align-items:center; gap:8px; text-decoration:none; }
  .titlebar .mark .dot{ width:7px;height:7px;border-radius:1px;background:var(--copper); box-shadow:0 0 6px var(--copper); }
  .titlebar nav a{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-dim); text-decoration:none; }
  .titlebar nav a::before{ content:"\2190 "; }
  .page-head{ padding:44px 0 8px; }
  .page-head p.lede{ color:var(--ink-dim); font-size:15.5px; margin:10px 0 0; }
  main{ padding:24px 0 64px; }

  .qz-card{ padding:24px; }
  .qz-field{ margin-bottom:12px; }
  .qz-input, .qz-textarea{
    width:100%; background:var(--bg-soft); border:1px solid var(--line); color:var(--ink);
    font-family:var(--serif); font-size:15px; padding:11px 13px;
  }
  .qz-input:focus, .qz-textarea:focus{ outline:none; border-color:var(--copper); }
  .qz-textarea{ resize:vertical; font-family:var(--mono); font-size:13.5px; line-height:1.5; }
  .qz-error{ color:var(--status-fail); font-family:var(--mono); font-size:12px; margin-bottom:8px; min-height:1em; }
  .qz-actions{ display:flex; justify-content:flex-end; margin-top:16px; }
  .qz-next{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; background:var(--copper-bright); color:#0B2318; border:none; padding:10px 16px; cursor:pointer; }
  .qz-next:hover{ filter:brightness(1.08); }
  .qz-summary{ padding:36px 24px; text-align:center; }
  .qz-summary__label{ color:var(--ink-dim); font-family:var(--mono); font-size:13.5px; letter-spacing:0.04em; }

  footer{ border-top:1px solid var(--line); padding:32px 0; }
  .footer-note{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); letter-spacing:0.04em; text-align:center; }
</style>
