e the forecast. Using the three-tier model, name which tier does each job \u2014 taking the city name, looking up the forecast data, and storing past forecasts \u2014 and identify one job the frontend cannot do on its own.", "max_marks": 4, "explain": "", "chapter": 3, "id": "w239bc671"}, {"type": "written", "qid": "w0d06e985", "prompt": "(a) Choose one tier and describe one observable failure a user would notice if that tier failed. (b) Choose ONE service from the lesson's table (video sharing site, SNS, or e-commerce site) and give one frontend task, one backend task and one database task for it.", "max_marks": 5, "explain": "", "chapter": 3, "id": "w0d06e985"}, {"id": "g34", "type": "mcq", "prompt": "In the six-step product-search flow (1 frontend receives the keywords, 2 frontend sends them to the backend, 3 backend searches the database, 4 database returns matching data to the backend, 5 backend returns organized results to the frontend, 6 frontend displays the results), step 3 is skipped but step 6 still runs. What appears on the user's screen?", "options": ["The correct matching results", "No correct matching results, because the data was never returned", "A new database", "Backend code"], "correct": [1], "explain": "Without the search in step 3 no data is returned, so the frontend has no correct results to display.", "chapter": 3}, {"id": "g35", "type": "mcq", "prompt": "The recommendation logic is removed from the backend of a video-sharing site. Which function stops?", "options": ["Recommended-video selection", "The video playback screen", "The stored video data", "Browser input"], "correct": [0], "explain": "Recommended-video selection is backend processing, so it stops when that logic is removed.", "chapter": 3}, {"id": "g36", "type": "mcq", "prompt": "On a social media app, a user's photo post cannot be written to the database. What is the outcome?", "options": ["The photo can still be stored permanently", "The frontend and backend may process the reque
