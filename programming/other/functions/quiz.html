  .qz-option--incorrect{ border-color:var(--status-fail); }

  .qz-verdict__tag--fail{ color:var(--status-fail); }

<script type="application/json" id="quiz-data">
{
  "title": "Functions",
  "subject": "programming",
  "lesson": "functions",
  "questions": [
    {
      "q": "What does the <code>def</code> keyword do in Python?",
      "options": [
        "Deletes a variable",
        "Starts a function definition",
        "Defines a class",
        "Imports a module"
      ],
      "correct": 1,
      "explain": "def marks the start of a function definition \u2014 the block that follows is the function's body."
    },
    {
      "q": "In <code>def greet(name):</code>, what is <code>name</code>?",
      "options": [
        "A return value",
        "A global variable",
        "A parameter \u2014 a placeholder for the input",
        "A function call"
      ],
      "correct": 2,
      "explain": "name is a parameter: a placeholder that gets filled in with a real value (the argument) when the function is called."
    },
    {
      "q": "A function has no <code>return</code> statement. What happens when you call it?",
      "options": [
        "It raises an error",
        "It runs, but gives back None",
        "It returns the last variable used",
        "It won't run at all"
      ],
      "correct": 1,
      "explain": "Without a return statement, a function still runs fully \u2014 it just implicitly returns None."
    },
    {
      "q": "A variable created inside a function...",
      "options": [
        "Is available everywhere in the program",
        "Only exists inside that function (its scope)",
        "Overwrites any global variable with the same name",
        "Must be declared outside the function first"
      ],
      "correct": 1,
      "explain": "Variables created inside a function are local to it \u2014 they don't exist outside its scope."
    },
    {
      "q": "What's the main benefit of writing a function instead of repeating code?",
      "options": [
        "It makes the code run faster",
        "It's required by Python's syntax",
        "Write the logic once, reuse it anywhere \u2014 easier to fix and maintain",
        "It hides the code from other programmers"
      ],
      "correct": 2,
      "explain": "This is the DRY principle \u2014 Don't Repeat Yourself."
    }
  ]
}
</script>
