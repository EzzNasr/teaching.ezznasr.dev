<script type="application/json" id="quiz-data">
{
  "title": "If Conditional",
  "subject": "programming",
  "lesson": "if-conditional",
  "questions": [
    {
      "q": "What does the if keyword do in Python?",
      "options": [
        "Deletes a variable",
        "Checks whether a condition is True or False",
        "Defines a class",
        "Imports a module"
      ],
      "correct": 1,
      "explain": "An if statement evaluates a condition and runs code only when it's True (slide 4)."
    },
    {
      "q": "In the trace example, age = 20 and the check is age >= 18. What happens?",
      "options": [
        "The condition is False, so nothing prints",
        "The condition is True, so \"You are eligible to vote\" prints",
        "A syntax error occurs",
        "The program skips the if entirely"
      ],
      "correct": 1,
      "explain": "20 >= 18 is True, so the indented line runs and prints the message (slide 5)."
    },
    {
      "q": "Which operator compares two values for equality in Python?",
      "options": [
        "=",
        "==",
        "!=",
        "==="
      ],
      "correct": 1,
      "explain": "A single = assigns a value; == compares values \u2014 a distinction the deck specifically flags (slide 6)."
    },
    {
      "q": "What does != mean?",
      "options": [
        "Equal to",
        "Greater than",
        "Not equal to",
        "Less than or equal to"
      ],
      "correct": 2,
      "explain": "!= checks that two values are different (slide 6)."
    },
    {
      "q": "age = 15. What does this code print?",
      "options": [
        "You can vote",
        "You cannot vote yet",
        "Nothing prints",
        "Both lines print"
      ],
      "correct": 1,
      "explain": "15 >= 18 is False, so the else block runs instead (slide 7)."
    },
    {
      "q": "score = 95, using three SEPARATE if statements (each checking >=60, >=75, >=90). What prints?",
      "options": [
        "Excellent only",
        "Pass",
        "Pass, Good, and Excellent \u2014 all three",
        "Nothing"
      ],
      "correct": 2,
      "explain": "Independent if statements each run on their own if their condition is true, so all three conditions being met means all three print (slide 8)."
    },
    {
      "q": "score = 95, using an if/elif/elif chain (>=90, >=75, >=60 in that order). What prints?",
      "options": [
        "Pass, Good, and Excellent",
        "Excellent only",
        "Pass only",
        "Nothing"
      ],
      "correct": 1,
      "explain": "An elif chain stops at the first True condition and skips the rest \u2014 so only \"Excellent\" prints (slide 8)."
    },
    {
      "q": "x = 10. What does this code print?",
      "options": [
        "A",
        "B",
        "C",
        "A and B"
      ],
      "correct": 0,
      "explain": "The first condition (x > 5) is already True, so Python runs that block and skips elif and else entirely (slide 9)."
    },
    {
      "q": "age = 15, but the print line has NO indentation before it (it's outside the if block). What happens?",
      "options": [
        "\"You can vote\" prints",
        "Nothing prints, since the print line is now outside the if block",
        "A logic error is silently ignored",
        "It still runs since Python ignores indentation"
      ],
      "correct": 1,
      "explain": "Without indentation, the print line is not part of the if block at all \u2014 it's a separate statement, and here nothing prints for age=15 (slide 10)."
    },
    {
      "q": "What decides which lines belong inside an if block in Python?",
      "options": [
        "Curly braces {}",
        "Semicolons",
        "Indentation (spaces at the start of the line)",
        "Parentheses"
      ],
      "correct": 2,
      "explain": "Python uses indentation, not braces, to define which lines belong to a branch (slide 10)."
    },
    {
      "q": "When should you use separate if statements instead of an elif chain?",
      "options": [
        "When only one outcome should ever run",
        "When every matching condition's action should run",
        "Never \u2014 elif is always better",
        "Only when there's no else"
      ],
      "correct": 1,
      "explain": "Separate ifs each get checked independently, so all true ones execute \u2014 unlike elif, which stops at the first match (slide 8)."
    }
  ]
}
