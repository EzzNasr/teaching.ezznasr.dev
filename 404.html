<style>

9px;cursor:pointer;font:600 11px 'DM Mono',monospace;transition:transform .2s ease,border-color .2s ease,color .2s ease}.theme-toggle:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent-strong)}.theme-label:after{content:'Dark mode'}html[data-theme="dark"] .theme-label:after{content:'Light mode'}.error-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:60px 0}.error-card{width:min(100%,680px);padding:50px 46px;text-align:center;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px color-mix(in srgb,var(--ink) 11%,transparent);position:relative}.error-number{font:600 13px 'DM Mono',monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.error-card h1{font:800 clamp(64px,15vw,132px)/.95 Manrope,sans-serif;letter-spacing:-.08em;margin:16px 0 18px;color:var(--accent)}.error-card h2{font:700 clamp(30px,6vw,48px)/1.25 Cairo,sans-serif;margin:0 0 10px}.error-card p{font:500 clamp(18px,3vw,22px)/1.8 Cairo,sans-serif;color:var(--ink-dim);margin:0 0 30px}.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}.home-btn,.back-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:9px;text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease}.home-btn{background:var(--accent);color:#fff;border:1px solid var(--accent);font:700 12px 'DM Mono',monospace;box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 28%,transparent)}.home-btn:hover{transform:translateY(-3px);box-shadow:0 15px 28px color-mix(in srgb,var(--accent) 34%,transparent)}.back-btn{background:transparent;color:var(--accent-strong);border:1px solid var(--line-strong);font:500 12px 'DM Mono',monospace}.back-btn:hover{transform:translateY(-3px);border-color:var(--accent)}footer{padding:24px 0;border-top:1px solid var(--line);color:var(--ink-dim);font:10px 'DM Mono',monospace;text-align:center}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;scroll-behavior:auto!important}}@media(max-width:650px){.wrap{padding:0 20px}.topbar{padding:15px 0}.brand{font-size:11px}.theme-toggle{padding:8px 10px}.theme-label{display:none}.error-wrap{min-height:calc(100vh - 62px);padding:28px 0}.error-card{padding:38px 22px;border-radius:16px}.error-card h2{font-size:32px}.error-card p{font-size:18px}.actions{flex-direction:column;align-items:stretch}.home-btn,.back-btn{width:100%}}
