<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{LESSON_TITLE}} Quiz — Ezz Nasr : Teaching</title>
<meta name="description" content="A quiz on {{LESSON_TITLE}}.">
<link rel="canonical" href="https://teaching.ezznasr.dev/{{SUBJECT_SLUG}}/{{LESSON_SLUG}}/quiz.html">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/forms.css">
<style>
  :root{ --maxw:720px; }
  main{ padding:24px 0 64px; }

  /* ---- nav (single "back to lesson" link) ---- */
  .titlebar nav a{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-dim); text-decoration:none; }
  .titlebar nav a::before{ content:"\2190 "; }

  /* ---- quiz engine styling ---- */
  .qz-progress{ font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); letter-spacing:0.04em; margin-bottom:12px; }
  .qz-question{ font-size:17px; margin:0 0 18px; color:var(--ink); }
  .qz-question code{ font-family:var(--mono); background:var(--bg-soft); padding:0.1em 0.4em; font-size:0.9em; border:1px solid var(--line); }
  .qz-options{ display:flex; flex-direction:column; gap:9px; }
  .qz-option{
    display:flex; align-items:flex-start; gap:10px; text-align:left; width:100%;
    padding:12px 14px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink);
    cursor:pointer; font-size:14.5px; transition:border-color .15s ease, transform .1s ease;
  }
  .qz-option:hover:not(:disabled){ border-color:var(--copper); }
  .qz-option:active:not(:disabled){ transform:scale(0.995); }
  .qz-option__tag{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); flex-shrink:0; padding-top:2px; }
  .qz-option:disabled{ cursor:default; }
  .qz-option--correct{ border-color:var(--status-shipped); }
  .qz-option--correct .qz-option__tag{ color:var(--status-shipped); }
  .qz-option--incorrect{ border-color:var(--status-fail); }
  .qz-option--incorrect .qz-option__tag{ color:var(--status-fail); }
  .qz-verdict{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); font-family:var(--mono); font-size:13px; }
  .qz-verdict__tag{ display:inline-block; letter-spacing:0.06em; text-transform:uppercase; font-size:11px; padding:3px 8px; border:1px solid currentColor; margin-bottom:8px; }
  .qz-verdict__tag--pass{ color:var(--status-shipped); }
  .qz-verdict__tag--fail{ color:var(--status-fail); }
  .qz-verdict__explain{ display:block; color:var(--ink-dim); font-family:var(--serif); font-size:14.5px; margin-top:4px; }
  .qz-summary__score{ font-family:var(--mono); font-size:2.2rem; color:var(--copper-bright); margin-bottom:6px; }
  .qz-retry{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; background:transparent; border:1px solid var(--line); color:var(--ink-dim); padding:9px 16px; cursor:pointer; }
  .qz-retry:hover{ border-color:var(--copper); color:var(--copper-bright); }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <a href="/" class="mark"><span class="dot"></span> EZZ NASR : TEACHING</a>
    <nav><a href="/{{SUBJECT_SLUG}}/{{LESSON_SLUG}}/">Back to {{LESSON_TITLE}}</a></nav>
  </div>
</header>

<main>
  <div class="wrap page-head">
    <h1>{{LESSON_TITLE}} — quiz</h1>
    <p class="lede">{{QUESTION_COUNT}} questions. Instant feedback.</p>
  </div>

  <div class="wrap">
    <div id="quiz-root" aria-live="polite"></div>
  </div>
</main>

<footer><p class="footer-note">teaching.ezznasr.dev/{{SUBJECT_SLUG}}/{{LESSON_SLUG}}/quiz</p></footer>

<script type="application/json" id="quiz-data">
{{QUIZ_JSON}}
</script>
<script src="/assets/quiz.js"></script>
<script>QuizEngine.mount('#quiz-root', '#quiz-data');</script>

</body>
</html>
